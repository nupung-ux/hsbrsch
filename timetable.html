function RoomView({ year, bell, classList, teachers, ctt, lessons, bookings, lectures, canBook, addBooking, deleteBooking, myRole, toast, setModal, goLecture }) {
  const rooms = year.rooms || [];
  const [room, setRoom] = useState(decodeURIComponent(location.hash.match(/#\/room\/([^/]+)/)?.[1]||'') || rooms[0]?.name || '');
  const [sem, setSem] = useState(1);
  const [dimPast, setDimPast] = useState(readPref('dimPast', true));
  const [headRef, fixedStyle] = useFixedHead();
  useEffect(()=>{ if (!room && rooms.length) setRoom(rooms[0].name); }, [rooms]);
  useEffect(()=>{ if (room) history.replaceState(null,'',`#/room/${encodeURIComponent(room)}`); }, [room]);
  const weeks = year.semesters?.[sem]?.weeks || [];
  const cols = useMemo(()=>roomColumns(bell), [bell]);
  const roomTeachers = teachers.filter(t => t.room===room || normTeacher(t).subjects.some(x=>x.room===room));
  const colKeyFor = (grade, p) => { const t = periodTime(bell, grade||'3', p); return t ? `${t.s}-${t.e}` : null; };
  // 날짜|시간열 → 항목들
  const entries = useMemo(() => { const m = {}; const put = (date, ck, e) => { if (!ck) return; (m[`${date}|${ck}`] = m[`${date}|${ck}`]||[]).push(e); };
    for (const [bid,b] of Object.entries(bookings)) if (b.room===room) put(b.date, b.colKey || colKeyFor(b.grade||gradeOf(b.classId), b.p), { id:bid, kind: b.lectureId?'lec':'book', text:b.text, b });
    for (const t of roomTeachers) for (const [lid,L] of Object.entries(lessons)) { if (!lid.endsWith('_'+sem)) continue; for (const [k,sl] of Object.entries(L.slots||{})) if (sl.teacherId===t.id && roomForLesson(t, sl.t)===room) { const { date, p } = parseKey(k); put(date, colKeyFor(gradeOf(L.classId), p), { kind:'room', text: classCode(L.classId), teacher:`${t.name} ${sl.t}` }); } }
    return m; }, [bookings, lessons, room, sem, roomTeachers, bell]);
  const cellOf = (date, col) => { const arr = entries[`${date}|${col.key}`]; if (!arr?.length) return canBook ? { cls:'free', title:'눌러서 예약' } : {}; const c = arr.length>1; const main = arr[0]; const cls = main.kind==='lec'?'lock':main.kind==='book'?'book':'room'; return { text: arr.map(e=>e.text).join('/'), cls: cls+(c?' conflict':''), title: arr.map(e=>e.kind==='lec'?`외부강의 ${lectures[e.b.lectureId]?.name||''}`:e.kind==='room'?`${e.teacher} 전담 수업`:`예약 (${e.b.createdBy||''})`).join(', ')+(c?' · 겹침':'') }; };
  const onClick = (date, col) => {
    const arr = entries[`${date}|${col.key}`]||[];
    const lec = arr.find(e=>e.kind==='lec'); const book = arr.find(e=>e.kind==='book');
    if (lec) { setModal({ type:'confirm', title:'외부강의에서 등록된 예약입니다', body:<p>{lectures[lec.b.lectureId]?.name} — 외부강의 화면에서 수정하거나 삭제하세요.</p>, actions:[{label:'닫기',on:()=>setModal(null)},{label:'외부강의로 이동',primary:true,on:()=>{ setModal(null); goLecture(); }}] }); return; }
    if (book) { if (!canBook) return; setModal({ type:'confirm', title:'예약을 지울까요?', body:<p>{fmtDate(date)} {col.p}교시 ({col.s}~{col.e}) · {book.text}{book.b.groupId && ' (반복 예약)'}</p>, actions:[{label:'취소',on:()=>setModal(null)},...(book.b.groupId?[{label:'반복 전체 삭제',on:async()=>{ await deleteBooking(book.id,true); setModal(null); }}]:[]),{label:'이 날만 삭제',primary:true,on:async()=>{ await deleteBooking(book.id,false); setModal(null); }}] }); return; }
    if (!canBook) { toast('로그인하면 예약할 수 있습니다.', true); return; }
    setModal({ type:'book', room, date, col });
  };
  return <div style={fixedStyle}>
    <div className="fixedhead" ref={headRef}><div className="bar">
      <span style={{fontWeight:700,fontSize:17}}>{room}</span>
      <div className="seg"><button className={sem===1?'on':''} onClick={()=>setSem(1)}>1학기</button><button className={sem===2?'on':''} onClick={()=>setSem(2)}>2학기</button></div>
      <PastToggle value={dimPast} onChange={setDimPast} />
      <div className="spacer"/>
      <div className="legend"><span><i style={{background:'#dff4ec'}}/>전담 수업{roomTeachers.length?` (${roomTeachers.map(t=>t.name).join(', ')})`:''}</span><span><i style={{background:'#fff0c2'}}/>예약</span><span><i style={{background:'#e9dcff'}}/>외부강의(잠금)</span><span style={{color:'var(--danger)'}}>빨간 테두리 = 겹침</span></div>
    </div></div>
    {!rooms.length ? <div className="empty">학년도 설정에서 특별실을 먼저 등록해 주세요.</div>
    : !weeks.length ? <div className="empty">{sem}학기 연간시간표가 아직 없습니다.</div>
    : <div className="roomside">
      <div className="roombtns">{rooms.map(r=><button key={r.name} className={room===r.name?'on':''} onClick={()=>setRoom(r.name)}>{r.name}</button>)}</div>
      <div>
      <table className="tt"><thead>
        <tr><th rowSpan={2} style={{width:34}}>주</th><th rowSpan={2} style={{width:112}}>기간</th>{DAYS.map(d=><th key={d} colSpan={cols.length} className="day">{d}</th>)}</tr>
        <tr>{DAYS.map(d=>cols.map((c,i)=><th key={d+c.key} className={'pn'+(i===0?' day':'')} style={{width:'var(--cell)'}} title={`${c.p}교시 ${c.s}~${c.e}${c.label?' · '+c.label:''}`}>{c.p}{c.label && <small>{c.label.replace(/학년/g,'')}</small>}</th>))}</tr></thead>
        <tbody>{weeks.map(w=><tr key={w.no}><td className="wk">{w.no}</td><td className="period">{w.label}</td>
          {DAYS.map((d,di)=>cols.map((c,i)=>{ const date=addDays(w.start,di); const cell=cellOf(date,c); return <td key={date+c.key} className={['slot',i===0?'first':'',cell.cls||'',dimPast&&isPast(date)?'past':''].join(' ')} title={`${fmtDate(date)} ${c.p}교시 ${c.s}~${c.e}${cell.title?' · '+cell.title:''}`} onClick={()=>onClick(date,c)}>{cell.text||''}</td>; }))}
        </tr>)}</tbody></table>
      <p className="hint">시정표에 따라 시간이 다른 교시(예: 5교시)는 열이 나뉩니다. 열 머리글에 마우스를 올리면 시간과 학년군이 보입니다. 빈 칸을 누르면 예약(학년반 또는 자유 글, 매주 반복 가능), 예약 칸을 누르면 삭제.</p>
      </div>
    </div>}
  </div>;
}

function CalendarView({ calEvents, calAppId, lectures }) {
  const today = new Date().toISOString().slice(0,10);
  const ref = useRef();
  useEffect(()=>{ ref.current?.scrollIntoView({ block:'center' }); }, [calEvents.length]);
  useEffect(()=>{ history.replaceState(null,'','#/calendar/today'); }, []);
  const groups = {}; for (const e of calEvents) (groups[e.date]=groups[e.date]||[]).push(e);
  const dates = Object.keys(groups).sort();
  const firstTodayOrAfter = dates.find(d=>d>=today);
  return <>
    <div className="bar"><span className="hint">연동 대상: <b>{calAppId==='hwaseong-barun-calendar' ? '실제 월간운영계획' : '시험용 일정표'}</b> (학년도 설정에서 바꿀 수 있습니다) · 보라색 표시는 외부강의에서 자동으로 들어온 줄입니다. 실제 화면은 월간운영계획에서 확인하세요.</span></div>
    <div className="list" style={{maxWidth:1100}}>
      {!dates.length && <div className="it hint">일정이 없습니다. 외부강의를 저장하면 여기에 나타납니다.</div>}
      {dates.map(d=><div key={d} ref={d===firstTodayOrAfter?ref:null}>
        <div className={'ev'+(d===today?' today':'')} style={{background:'var(--head)',fontWeight:700}}>{fmtDate(d)}</div>
        {groups[d].map(e=><div key={e.id} className="ev"><span style={{width:90,color:'var(--muted)'}}>{e.time}</span><span className={e.lectureId?'tag':''} style={{width:70,textAlign:'center'}}>{e.department}</span><b style={{minWidth:260}}>{e.activity}</b><span className="hint">{e.manager}{e.location&&` · ${e.location}`}{e.note&&` · ${e.note}`}</span></div>)}
      </div>)}
    </div>
  </>;
}

  return <Modal title={`연간시간표 확인${fileCount>1?` — 파일 ${fileCount}개, 표 ${list.length}개`:''}`} onClose={onClose}>
    {failed?.length>0 && <div className="warn" style={{marginBottom:8}}>{failed.map((x,i)=><div key={i}>· {x}</div>)}</div>}
    {allExisting.length>1 && <div style={{marginBottom:10,padding:'8px 10px',background:'#fff8e1',borderRadius:6,fontSize:14}}>이미 올라온 시간표 {allExisting.length}개 — 한꺼번에: <button className="btn" style={{padding:'2px 10px'}} onClick={()=>setAllModes('merge')}>기존 수정 유지</button> <button className="btn" style={{padding:'2px 10px',marginLeft:4}} onClick={()=>setAllModes('replace')}>전부 덮어쓰기</button></div>}
    {!list.length && <p className="warn">파일에서 학급(예: 6학년 1반)을 찾지 못했습니다.</p>}
    {blocked.length>0 && <p className="warn">{blocked.map(p=>classLabel(p.classId)).join(', ')} 시간표는 편집 권한이 없어 저장할 수 없습니다.</p>}
    <div style={{maxHeight:'55vh',overflow:'auto',paddingRight:4}}>
    {results.map(({ p, id, report, needPattern }) => <div key={id} style={{marginBottom:16,paddingBottom:12,borderBottom:'1px solid var(--line)'}}>
      <div style={{fontWeight:700}}>{classLabel(p.classId)} {p.sem}학기 <span className="hint" style={{fontWeight:400}}>· {p.weeks.length}주 · {p.weeks[0]?.label} ~ {p.weeks.at(-1)?.label}</span></div>
      {existing[id] && (()=>{ const L = lessons[id]; const nEdit = Object.values(L?.slots||{}).filter(v=>v.from==='manual'||v.from==='move').length + Object.keys(L?.removed||{}).length; const nEv = Object.values(existing[id].cells||{}).filter(c=>c.app).length; const mode = modes[id]||'merge';
        return <div style={{margin:'6px 0 8px',padding:'8px 10px',background:'#fff8e1',borderRadius:6,fontSize:14}}>
          <b>이미 올라온 시간표가 있습니다.</b> 앱에서 수정한 전담 수업 {nEdit}건, 행사 표시 {nEv}건.
          <div style={{display:'flex',gap:14,marginTop:6}}>
            <label className="chk" style={{margin:0}}><input type="radio" checked={mode==='merge'} onChange={()=>setModes({...modes,[id]:'merge'})}/> 기존 수정 유지하고 나머지만 새 파일로 (권장)</label>
            <label className="chk" style={{margin:0}}><input type="radio" checked={mode==='replace'} onChange={()=>setModes({...modes,[id]:'replace'})}/> 전부 새 파일로 덮어쓰기</label>
          </div>
          <div className="hint" style={{marginTop:4}}>외부강의·비교과는 어느 쪽이든 그대로 남습니다.</div>
        </div>; })()}
      {!report.length && !needPattern.length && <p className="warn">이 학급을 담당하는 전담 교사가 설정에 없습니다. 담임 과목만 저장됩니다.</p>}
      {report.filter(r=>r.dup).map((r,i)=><div key={'d'+i} className="warn">{r.dup}</div>)}
      {report.filter(r=>!r.dup).map(r => <div key={r.pid} className="chk"><i className="legend" style={{width:16,height:16,background:r.teacher.color,border:'1px solid var(--line)',display:'inline-block'}}/> {r.subject} {r.teacher.name}: <b>{r.count}</b>시간{r.expected!=null && <span className={r.count===r.expected?'okc':'warn'}> ({r.coverage==='full'?'파일 시수':'설정 시수'} {r.expected}{r.count===r.expected?' 일치':' — 확인 필요'})</span>}{r.coverage==='partial' && <span className="hint"> · 색칠 칸 기준</span>}{r.warn && <div className="warn" style={{marginLeft:24}}>{r.warn}</div>}</div>)}
      {needPattern.map(np => <div key={np.pid} style={{marginTop:8}}>
        <div className="warn">{np.subject} {np.teacher.name}: 일부 전담 과목인데 색칠된 칸이 없습니다. 전담이 들어가는 시간을 골라 주세요.</div>
        <div className="picker" style={{margin:'8px 0'}}>{np.patterns.sort((a,b)=>a.pk.localeCompare(b.pk)).map(({pk,n})=>{ const [d,pp]=pk.split('-'); const on=(choices[id]?.[np.pid]||[]).includes(pk); return <label key={pk} className={on?'on':''} onClick={()=>togglePat(id,np.pid,pk)}>{DAYS[d]} {pp}교시<br/><small>{n}회</small></label>; })}</div>
        <button className="btn" onClick={()=>confirmPat(id,np.pid)}>이 시간으로 정하기</button>
      </div>)}
    </div>)}
    </div>
    <div className="row"><button className="btn" onClick={onClose}>취소</button><button className="btn primary" disabled={saving || pending || !list.length || blocked.length>0} onClick={async()=>{ setSaving(true); try { await onSave(parsed, choices, modes); } finally { setSaving(false); } }}>{saving ? '저장 중…' : `저장 (${list.length}개)`}</button></div>
  </Modal>;
}

createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
