<style>

  *{box-sizing:border-box}

  .cp{display:flex;flex-direction:column;gap:3px}
  .cp .g{display:flex;align-items:center;gap:4px}
  .cp button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:2px 7px;font-size:13px;line-height:1.4}
  .cp button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cp button.gr{font-weight:700;min-width:52px}
  .cp button.gr.part{background:#e9ecf1;color:var(--ink)}
  table.tt td.slot.lec{background:#e9dcff;font-weight:700;color:#4b2a8a}
  table.tt td.slot.pick{background:#4b2a8a;color:#fff;font-weight:700;cursor:pointer}
  table.tt td.slot.free{cursor:pointer}
  table.tt td.slot.free:hover{outline:2px solid #4b2a8a;outline-offset:-2px}
  table.tt td.slot.blocked{background:#f1f1ef;color:#b0b5bc;cursor:not-allowed}
  table.tt td.slot.room{background:#dff4ec;color:#0f6b4a;font-weight:700}
  table.tt td.slot.book{background:#fff0c2;font-weight:700;cursor:pointer}
  table.tt td.slot.lock{background:#e9dcff;color:#4b2a8a;font-weight:700;cursor:pointer}
  table.tt td.cls{width:64px;font-weight:700;background:var(--head)}
  .list{background:#fff;border:1px solid var(--line);border-radius:8px;margin:0 18px 14px;max-width:1100px}
  .list .it{display:flex;gap:14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .list .it:hover{background:#f6f7f9}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#e9dcff;color:#4b2a8a}
  .tag.b{background:#dff4ec;color:#0f6b4a}
  .ev{display:flex;gap:12px;padding:6px 14px;border-bottom:1px solid var(--line);font-size:14px}
  .ev.today{background:#fff7d6}
  .field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
  .field input,.field select{padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:#fff;font-size:15px;color:var(--ink)}
  @media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}}
  @keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.dropzone{position:fixed;inset:0;z-index:900;background:rgba(61,95,214,.12);border:4px dashed var(--event);display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:18px;text-align:center}
.dropzone>div{background:#fff;padding:22px 30px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.15)}
</style>

<script type="text/babel" data-type="module">
import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import { initializeApp } from 'firebase/app';
import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from 'firebase/auth';
import { getFirestore, collection, onSnapshot, doc, setDoc, getDoc, getDocs, addDoc, deleteDoc, query } from 'firebase/firestore';

// ---------- Firebase (기존 월간운영계획과 같은 프로젝트, 저장 경로만 분리) ----------
const firebaseConfig = {
  apiKey: "AIzaSyDeV51pP4BQqxReIfBmXPEST9zeok5aAOs",
  authDomain: "school-calendar-6789a.firebaseapp.com",
  projectId: "school-calendar-6789a",
  storageBucket: "school-calendar-6789a.firebasestorage.app",
  messagingSenderId: "697249862283",
  appId: "1:697249862283:web:4b75b2deb2693d771b7a8e"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const APP_ID = 'hwaseong-barun-timetable-test';
const VERSION = 'v5.6';
const isAdminPage = () => location.hash.startsWith('#/admin');
const base = ['artifacts', APP_ID, 'public', 'data'];
const sref = (name) => doc(db, ...base, 'settings', name);
const cref = (name) => collection(db, ...base, name);
const dref = (name, id) => doc(db, ...base, name, id);

// ---------- 유틸 ----------
const DAYS = ['월','화','수','목','금'];
const PERIODS = [1,2,3,4,5,6];
const pad = n => String(n).padStart(2,'0');
const addDays = (iso, n) => { const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtDate = iso => { const d = new Date(iso+'T00:00:00'); return `${d.getMonth()+1}월 ${d.getDate()}일(${['일','월','화','수','목','금','토'][d.getDay()]})`; };
const shortDate = iso => { const d = new Date(iso+'T00:00:00'); return `${d.getMonth()+1}.${d.getDate()}(${['일','월','화','수','목','금','토'][d.getDay()]})`; };
const slotKey = (date, p) => `${date}_${p}`;
const parseKey = k => { const [date, p] = k.split('_'); return { date, p: Number(p) }; };
const classCode = id => id.replace('-','');        // "6-1" -> "61"
const classLabel = id => id.startsWith('유') ? id : `${id.split('-')[0]}학년 ${id.split('-')[1]}반`;
const sha256 = async s => { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); };
const nowIso = () => new Date().toISOString();
const isGray = hex => { if(!hex||hex==='none') return false; const m=hex.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i); if(!m) return false; const [r,g,b]=[1,2,3].map(i=>parseInt(m[i],16)); return Math.abs(r-g)<8 && Math.abs(g-b)<8 && r<0xF5; };
const isColor = hex => hex && hex!=='none' && !isGray(hex);
// 전담 설정용 과목 목록 (글자 = 연간시간표 칸의 글자). 창체는 '창'으로 통일하되 자·동·봉·진도 창체로 인식
const SUBJECTS = [['국','국어'],['수','수학'],['사','사회'],['도','도덕'],['과','과학'],['실','실과'],['체','체육'],['음','음악'],['미','미술'],['영','영어'],['바','바른 생활'],['슬','슬기로운 생활'],['즐','즐거운 생활'],['창','창체 (창·자·동·봉·진)']];
const SUBJECT_ALIAS = { '창': ['창','자','동','봉','진'] };
const canonSubject = t => Object.entries(SUBJECT_ALIAS).find(([k,v]) => v.includes(t))?.[0] || t;
const matchSubject = (subject, t) => (SUBJECT_ALIAS[subject] || [subject]).includes(t);
const subjectName = l => SUBJECTS.find(x=>x[0]===l)?.[1] || l;
const DEFAULT_BELL = { groups: [
  { name:'3·4·6학년', grades:['3','4','6'], periods:{1:['09:00','09:40'],2:['09:50','10:30'],3:['10:40','11:20'],4:['11:30','12:10'],5:['12:20','13:00'],6:['13:50','14:30']} },
  { name:'유·1·2·5학년', grades:['유','1','2','5'], periods:{1:['09:00','09:40'],2:['09:50','10:30'],3:['10:40','11:20'],4:['11:30','12:10'],5:['13:00','13:40'],6:['13:50','14:30']} },
]};
const gradeOf = classId => classId ? classId.split('-')[0] : null;
const bellGroup = (bell, grade) => (bell?.groups||[]).find(g => (g.grades||[]).includes(String(grade))) || (bell?.groups||[])[0];
const periodTime = (bell, grade, p) => { const g = bellGroup(bell, grade); const t = g?.periods?.[p]; return t ? { s: t[0], e: t[1] } : null; };
const overlaps = (a, b) => !!(a && b) && a.s < b.e && b.s < a.e;
const periodsText = ps => { const u = Array.from(new Set(ps)).sort((a,b)=>a-b); if (!u.length) return ''; if (u.length===1) return `${u[0]}교시`; const contiguous = u.every((v,i)=>i===0||v===u[i-1]+1); return contiguous ? `${u[0]}~${u.at(-1)}교시` : u.join(', ')+'교시'; };
const TODAY = new Date(Date.now()+9*3600*1000).toISOString().slice(0,10); // KST
const isPast = date => date < TODAY;
const readPref = (k, d) => { try { const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); } catch(e) { return d; } };
const writePref = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
// 특별실용 시간 칸: 학년군별 시정표에서 서로 다른 시간대를 모아 열로 만든다 (예: 5교시가 두 시간대면 열 2개)
const roomColumns = bell => { const m = {}; for (const g of (bell?.groups||[])) for (const p of PERIODS) { const t = g.periods?.[p]; if (!t||!t[0]) continue; const k = `${p}|${t[0]}|${t[1]}`; (m[k] = m[k] || { p, s:t[0], e:t[1], groups:[] }).groups.push(g.name); }
  const cols = Object.values(m).sort((a,b)=>a.s.localeCompare(b.s)||a.p-b.p); const perP = {}; cols.forEach(c=>perP[c.p]=(perP[c.p]||0)+1); cols.forEach(c=>{ c.key=`${c.s}-${c.e}`; c.label = perP[c.p]>1 ? c.groups.join(',') : ''; }); return cols; };
const NONCURR = { '영양':'영', '보건':'보', '상담':'상', '비교과':'비' }; // 비교과 종류 → 칸 표시 글자
const isNoncurr = lec => lec.kind in NONCURR;
const lecLabel = lec => isNoncurr(lec) ? NONCURR[lec.kind] : '외' + (lec.subject ? `(${lec.subject})` : '');
const LecText = ({ lec }) => isNoncurr(lec) ? NONCURR[lec.kind] : (lec.subject ? <span>외<small>({lec.subject})</small></span> : '외');

const GRADE_COLORS = { '1':'#ffe0e0', '2':'#ffe8c8', '3':'#fff6b0', '4':'#d6f5d0', '5':'#cfe6ff', '6':'#e6d9ff', '유':'#ffd9ec' };
const gradeColor = classId => GRADE_COLORS[gradeOf(classId)] || '#eee';
const makeWeeks = (startMonday, count) => { const out = []; for (let i=0;i<count;i++) { const st = addDays(startMonday, 7*i); const en = addDays(st, 4); out.push({ no:i+1, start:st, label:`${Number(st.slice(5,7))}.${Number(st.slice(8,10))}~${Number(en.slice(5,7))}.${Number(en.slice(8,10))}`, note:'' }); } return out; };
const blankCells = weeks => { const cells = {}; for (const w of weeks) for (let d=0; d<5; d++) for (const p of PERIODS) cells[slotKey(addDays(w.start,d), p)] = { t:'', k:'n' }; return cells; };
const newId = () => 'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// ---------- hwpx 파서 ----------
const NS = { hp:'http://www.hancom.co.kr/hwpml/2011/paragraph', hh:'http://www.hancom.co.kr/hwpml/2011/head', hc:'http://www.hancom.co.kr/hwpml/2011/core' };
async function parseHwpx(file) {
  const zip = await JSZip.loadAsync(file);
  const xml = async n => new DOMParser().parseFromString(await zip.file(n).async('string'), 'application/xml');
  const head = await xml('Contents/header.xml');
  const charPr = {};
  for (const c of head.getElementsByTagNameNS(NS.hh, 'charPr')) {
    const u = c.getElementsByTagNameNS(NS.hh, 'underline')[0];
    charPr[c.getAttribute('id')] = { color: c.getAttribute('textColor'), ul: u ? u.getAttribute('type') : null };
  }
  const fills = {};
  for (const b of head.getElementsByTagNameNS(NS.hh, 'borderFill')) {
    const wb = b.getElementsByTagNameNS(NS.hc, 'winBrush')[0];
    fills[b.getAttribute('id')] = wb ? wb.getAttribute('faceColor') : null;
  }
  const secNames = Object.keys(zip.files).filter(n => /^Contents\/section\d+\.xml$/.test(n)).sort();
  const results = [];
  for (const sn of secNames) {
    const sec = await xml(sn);
    for (const tbl of sec.getElementsByTagNameNS(NS.hp, 'tbl')) {
      if (Number(tbl.getAttribute('rowCnt')) < 10) continue;
      const cells = new Map();
      for (const tc of tbl.getElementsByTagNameNS(NS.hp, 'tc')) {
        const a = tc.getElementsByTagNameNS(NS.hp, 'cellAddr')[0], sp = tc.getElementsByTagNameNS(NS.hp, 'cellSpan')[0];
        const r = Number(a.getAttribute('rowAddr')), c = Number(a.getAttribute('colAddr'));
        const runs = [];
        for (const run of tc.getElementsByTagNameNS(NS.hp, 'run')) {
          const t = Array.from(run.getElementsByTagNameNS(NS.hp, 't')).map(x => x.textContent || '').join('').trim();
          if (t) runs.push({ t, ...(charPr[run.getAttribute('charPrIDRef')] || {}) });
        }
        cells.set(`${r},${c}`, { r, c, runs, bg: fills[tc.getAttribute('borderFillIDRef')] || null, cs: Number(sp.getAttribute('colSpan')) });
      }
      const get = (r, c) => cells.get(`${r},${c}`);
      const text = cell => cell ? cell.runs.map(x => x.t).join('') : '';
      const title = text(get(1,0));
      const yearM = title.match(/(\d{4})학년도/); const semM = title.match(/([12])학기/);
      if (!yearM || !semM) continue;
      const year = Number(yearM[1]), sem = Number(semM[1]);
      let classId = null;
      for (const cell of cells.values()) if (cell.r===1 && cell.c>0) { const m = text(cell).match(/(\d)학년\s*(\d+)반/); if (m) classId = `${m[1]}-${m[2]}`; }
      const dayCols = []; // {from,to,day}
      for (const cell of cells.values()) if (cell.r===2 && DAYS.includes(text(cell)) && cell.cs>=5) dayCols.push({ from: cell.c, to: cell.c+cell.cs, day: DAYS.indexOf(text(cell)) });
      const col2slot = {};
      let noteCol = null;
      for (const cell of cells.values()) {
        if (cell.r===3 && /^\d$/.test(text(cell))) { const d = dayCols.find(x => x.from<=cell.c && cell.c<x.to); if (d) for (let k=cell.c;k<cell.c+cell.cs;k++) col2slot[k] = { d: d.day, p: Number(text(cell)) }; }
        if (cell.r===2 && text(cell).replace(/\s/g,'')==='비고') noteCol = cell.c;
      }
      const weeks = []; const grid = {}; let r = 4;
      while (get(r,0) && /^\d+$/.test(text(get(r,0)))) {
        const no = Number(text(get(r,0))); const label = text(get(r,1));
        const m = label.match(/(\d{1,2})\.(\d{1,2})/);
        let start = null;
        if (m) { let y = year; const mo = Number(m[1]); if (sem===2 && mo<=2) y = year+1; start = `${y}-${pad(mo)}-${pad(m[2])}`; const dow = new Date(start+'T00:00:00').getDay(); start = addDays(start, dow===0 ? 1 : 1-dow); }
        const note = noteCol!=null ? text(get(r,noteCol)) : '';
        weeks.push({ no, label, start, note });
        for (const cell of cells.values()) {
          if (cell.r!==r || !(cell.c in col2slot) || !start) continue;
          const { d, p } = col2slot[cell.c];
          const t = cell.runs.map(x=>x.t).join('');
          const blue = cell.runs.some(x => x.ul && x.ul!=='NONE' && /4169E6/i.test(x.color||''));
          const redUl = cell.runs.some(x => x.ul && x.ul!=='NONE' && /FF0000/i.test(x.color||''));
          const kind = (isGray(cell.bg) || redUl) ? 'h' : (blue ? 'e' : 'n');
          grid[slotKey(addDays(start,d), p)] = { t, k: kind, bg: isColor(cell.bg) ? cell.bg : null };
        }
        r++;
      }
      const totals = {};
      const subjRow = get(r,0) && text(get(r,0))==='과목' ? r : null;
      if (subjRow!=null) { const names = [], nums = []; for (const cell of cells.values()) { if (cell.r===subjRow && cell.c>0) names.push([cell.c,text(cell)]); if (cell.r===subjRow+1 && cell.c>0) nums.push([cell.c,text(cell)]); } names.sort((a,b)=>a[0]-b[0]); nums.sort((a,b)=>a[0]-b[0]); names.forEach(([c,n],i)=>{ const v = nums.find(x=>x[0]===c); if (n && v && /^\d+$/.test(v[1])) totals[n]=Number(v[1]); }); }
      results.push({ year, sem, classId, weeks, grid, totals });
    }
  }
  return results;
}

// ---------- 전담 배정 계산 ----------
// 전담 한 명 = 담당 항목(subjects) 여러 줄: {subject:'체', coverage:'full'|'partial', classes:[...], semHours}
const normTeacher = t => ({ ...t, subjects: (t.subjects || (t.subject ? [{ subject: t.subject, coverage: t.coverage||'full', classes: t.classes||[], semHours: t.semHours||'' }] : [])).map(x => ({ ...x, semHours1: x.semHours1 ?? x.semHours ?? '', semHours2: x.semHours2 ?? x.semHours ?? '' })) });
function normalizeTeachers(ts) {
  const list = ts.filter(t=>t.name).map(t0 => { const t = normTeacher(t0); const { subject, coverage, classes, semHours, ...rest } = t;
    return { ...rest, id: t.id || ('t'+Math.random().toString(36).slice(2,8)), subjects: t.subjects.filter(x=>x.subject).map(({classesText,...x}) => ({ ...x, classes: classesText!=null ? classesText.split(/[,\s]+/).filter(Boolean) : (x.classes||[]) })) }; });
  const seen = {}; const dups = [];
  for (const t of list) for (const x of t.subjects) for (const c of x.classes) { const k = `${x.subject}|${c}`; if (seen[k] && seen[k]!==t.name) dups.push(`${c} ${x.subject}: ${seen[k]}·${t.name}`); seen[k]=t.name; }
  return { list, dups };
}
const semHoursOf = (sub, sem) => { const v = sem===2 ? sub.semHours2 : sub.semHours1; return v ? Number(v) : null; };
// 과목별 시수 현황: 학기별(기본) 또는 연간 기준
function subjectHours(sub, tid, classId, sem, lessons, ctt) {
  const cnt = sm => Object.values(lessons[`${classId}_${sm}`]?.slots||{}).filter(l=>l.teacherId===tid && canonSubject(l.t)===canonSubject(sub.subject)).length;
  const fileTot = sm => { const T = ctt[`${classId}_${sm}`]; if (!T) return null; return sub.subject==='창' ? (T.totals?.['창체'] ?? null) : (Object.entries(T.totals||{}).find(([k])=>k.startsWith(sub.subject))?.[1] ?? null); };
  if (sub.hoursMode==='year') { const f1 = fileTot(1), f2 = fileTot(2); return { mode:'year', n: cnt(1)+cnt(2), exp: sub.coverage==='full' ? ((f1??0)+(f2??0) || null) : (sub.yearHours ? Number(sub.yearHours) : null), has: !!ctt[`${classId}_1`] || !!ctt[`${classId}_2`] }; }
  return { mode:'sem', n: cnt(sem), exp: sub.coverage==='full' ? fileTot(sem) : semHoursOf(sub, sem), has: !!ctt[`${classId}_${sem}`] };
}
// 전담 수업이 쓰는 특별실: 과목별 설정이 있으면 그것, 없으면 전담의 주 사용 특별실
const roomForLesson = (t0, subjectLetter) => { if (!t0) return ''; const t = normTeacher(t0); const su = t.subjects.find(x => canonSubject(x.subject)===canonSubject(subjectLetter)); return (su && su.room) || t.room || ''; };
const teacherSubjects = t => normTeacher(t).subjects.map(x=>x.subject).filter(Boolean).join('·');
const teacherClasses = t => Array.from(new Set(normTeacher(t).subjects.flatMap(x=>x.classes||[])));
function computeAssignments(parsed, teachers, patternChoices) {
  // returns { slots: {key:{t, teacherId, from:'hwpx'}}, report:[...], needPattern:[...] }
  const slots = {}; const report = []; const needPattern = [];
  for (const tc0 of teachers) {
    const tc = normTeacher(tc0); if (tc.type==='coop') continue;
    for (const sub of tc.subjects) {
      const s = sub.subject; if (!s || !(sub.classes||[]).includes(parsed.classId)) continue;
      const pid = `${tc.id}|${s}`;
      const cand = Object.entries(parsed.grid).filter(([k,v]) => matchSubject(s, v.t) && v.k!=='h');
      let chosen = [];
      if (sub.coverage==='full') chosen = cand;
      else {
        const colored = cand.filter(([k,v]) => v.bg);
        if (colored.length) chosen = colored;
        else {
          const pats = {};
          for (const [k] of cand) { const { date, p } = parseKey(k); const d = (new Date(date+'T00:00:00').getDay()+6)%7; const pk = `${d}-${p}`; pats[pk] = (pats[pk]||0)+1; }
          const choice = patternChoices?.[pid];
          if (!choice) { needPattern.push({ teacher: tc, subject: s, pid, patterns: Object.entries(pats).map(([pk,n])=>({ pk, n })) }); continue; }
          chosen = cand.filter(([k]) => { const { date, p } = parseKey(k); const d = (new Date(date+'T00:00:00').getDay()+6)%7; return choice.includes(`${d}-${p}`); });
        }
      }
      for (const [k,v] of chosen) { if (slots[k] && slots[k].teacherId!==tc.id) report.push({ teacher: tc, subject: s, dup: `${k} 칸을 다른 전담도 담당으로 설정되어 있습니다.` }); slots[k] = { t: v.t, teacherId: tc.id, from: 'hwpx' }; }
      const coloredN = cand.filter(([k,v]) => v.bg).length;
      const fileTotal = s==='창' ? (parsed.totals['창체'] ?? (['자율','동아리','봉사','진로'].reduce((a,n)=>a+(parsed.totals[n]||0),0) || null)) : (Object.entries(parsed.totals).find(([n]) => n.startsWith(s))?.[1] ?? null);
      const expected = sub.coverage==='full' ? fileTotal : semHoursOf(sub, parsed.sem);
      const warn = sub.coverage==='full' && coloredN>0 && coloredN<cand.length ? `색칠된 칸은 ${coloredN}개인데 전체 ${cand.length}개를 전담으로 잡았습니다. 담임과 나누는 과목이면 설정을 "일부 전담"으로 바꿔 주세요.` : null;
      report.push({ teacher: tc, subject: s, pid, count: chosen.length, expected, coverage: sub.coverage, warn });
    }
  }
  return { slots, report, needPattern };
}

  const undo = async () => { const u = undoRef.current.pop(); if (!u) return; setUndoN(undoRef.current.length);
    if (u.kind==='cells') { const T = ctt[u.docId]; if (T) await setDoc(dref('class_timetables', u.docId), { ...T, cells: u.prev }); }
    else await setDoc(dref('lessons', u.docId), { ...(lessons[u.docId]||{}), slots: u.prev, updatedAt: nowIso(), updatedBy: editorName() });
    toast('되돌렸습니다.'); };
  // 행사 칸(파란 밑줄) 표시·해제·이동 — 담임시간표의 칸 정보(cells)를 수정
  const editCells = async (classId, sem, mutate, detail) => { const id = `${classId}_${sem}`; const T = ctt[id]; if (!T) return; const cells = { ...T.cells }; mutate(cells); undoRef.current.push({ kind:'cells', docId:id, prev:T.cells }); setUndoN(undoRef.current.length); await setDoc(dref('class_timetables', id), { ...T, cells, updatedAt: nowIso(), updatedBy: editorName() }); log('event', detail); };
  const markEvent = (classId, sem, key, text) => editCells(classId, sem, cells => { cells[key] = { ...(cells[key]||{ t:'' }), k:'e', ev: text||'', app:true }; }, `${classLabel(classId)} ${shortDate(parseKey(key).date)} ${parseKey(key).p}교시 행사 표시 "${text||''}"`);
  const unmarkEvent = (classId, sem, key) => editCells(classId, sem, cells => { const c = { ...(cells[key]||{}) }; c.k = 'n'; delete c.ev; c.app = true; cells[key] = c; }, `${classLabel(classId)} ${shortDate(parseKey(key).date)} ${parseKey(key).p}교시 행사 해제`);
  const requestMoveEvent = (classId, sem, fromKey, toKey) => {
    if (fromKey===toKey) return; const T = ctt[`${classId}_${sem}`]; const from = T?.cells?.[fromKey]; const to = T?.cells?.[toKey]; if (!from || from.k!=='e') return;
    const reasons = []; let hard = false;
    if (!to) { reasons.push('시간표에 없는 칸입니다.'); hard = true; } else if (to.k==='h') { reasons.push(`휴업일(${to.t}) 칸입니다.`); hard = true; } else if (to.k==='e') reasons.push(`이미 행사(${to.ev||to.t})로 잡힌 칸입니다. 두 행사가 겹칩니다.`);
    if (lessons[`${classId}_${sem}`]?.slots?.[toKey]) { const l = lessons[`${classId}_${sem}`].slots[toKey]; reasons.push(`전담 ${l.t} 수업이 있는 시간입니다 (전담 수업이 우선 표시됩니다).`); }
    for (const o of Object.values(lectures)) if ((o.slots||[]).some(sl=>sl.classId===classId && slotKey(sl.date,sl.p)===toKey)) reasons.push(`${o.kind} "${o.name}"이 있는 시간입니다.`);
    const doMove = async () => { await editCells(classId, sem, cells => { cells[fromKey] = { ...cells[fromKey], k:'n', app:true }; delete cells[fromKey].ev; cells[toKey] = { ...(cells[toKey]||{ t:'' }), k:'e', ev: from.ev||'', app:true }; }, `${classLabel(classId)} 행사(${from.ev||from.t}) ${shortDate(parseKey(fromKey).date)} ${parseKey(fromKey).p}교시 → ${shortDate(parseKey(toKey).date)} ${parseKey(toKey).p}교시`); setModal(null); toast('행사 시간을 옮겼습니다.'); };
    setModal({ type:'confirm', title: hard ? '옮길 수 없습니다' : '행사 시간을 옮길까요?', body:<div><p style={{margin:'4px 0 10px'}}><b>행사{from.ev?` · ${from.ev}`:''}</b> ({from.t})<br/>{fmtDate(parseKey(fromKey).date)} {parseKey(fromKey).p}교시 → <b>{fmtDate(parseKey(toKey).date)} {parseKey(toKey).p}교시</b></p>{reasons.map((r,i)=><div key={i} className="warn">· {r}</div>)}<p className="hint" style={{marginTop:8}}>원래 칸은 담임 과목({from.t})으로 돌아갑니다.</p></div>,
      actions: hard ? [{label:'닫기',on:()=>setModal(null)}] : [{label:'취소',on:()=>setModal(null)},{label: reasons.length?'그래도 옮기기':'옮기기', primary:true, on:doMove}] });
  };

  // 전담 메모(칸·비고) / 담임 비고
  const saveTeacherCell = async (tid, sem, key, text) => { const id = `${tid}_${sem}`; const cur = teacherNotes[id] || {}; const cells = { ...(cur.cells||{}) }; if (text) cells[key] = text; else delete cells[key]; await setDoc(dref('teacher_notes', id), { ...cur, cells, updatedAt: nowIso(), updatedBy: editorName() }); log('memo', `전담 메모 ${key} "${text||'(삭제)'}"`); };
  const saveTeacherWeekNote = async (tid, sem, no, text) => { const id = `${tid}_${sem}`; const cur = teacherNotes[id] || {}; const weekNotes = { ...(cur.weekNotes||{}) }; if (text) weekNotes[no] = text; else delete weekNotes[no]; await setDoc(dref('teacher_notes', id), { ...cur, weekNotes, updatedAt: nowIso(), updatedBy: editorName() }); };
  const saveClassWeekNote = async (classId, sem, no, text) => { const id = `${classId}_${sem}`; const T = ctt[id]; if (!T) return; const weeks = T.weeks.map(w => w.no===no ? { ...w, note: text, noteApp: true } : w); await setDoc(dref('class_timetables', id), { ...T, weeks }); log('memo', `${classLabel(classId)} ${no}주 비고 수정`); };
  const askText = (title, value, onSave, hint) => setModal({ type:'text', title, value: value||'', hint, onSave });

  // 수업 추가 / 삭제 (담임·전담 공용)
  // 반복 추가: 같은 요일·교시로 count회(또는 학기 끝까지). 휴업일·기존 수업·외부강의·전담 중복은 건너뜀
  const addLessonRepeat = (classId, sem, key, teacherId, subject, count) => {
    const docId = `${classId}_${sem}`; const slots = lessons[docId]?.slots || {}; const weeks = year.semesters?.[sem]?.weeks || [];
    const { date, p } = parseKey(key); const d = (new Date(date+'T00:00:00').getDay()+6)%7;
    const startIdx = weeks.findIndex(w => date>=w.start && date<addDays(w.start,7)); if (startIdx<0) { toast('학기 주차에 없는 날짜입니다.', true); return; }
    const tName = teachers.find(t=>t.id===teacherId)?.name || '';
    const made = [], skipped = [], soft = []; const max = count==='end' ? weeks.length : Number(count);
    for (let i = startIdx; i < weeks.length && made.length < max; i++) {
      const dd = addDays(weeks[i].start, d); const k = slotKey(dd, p);
      const { reasons, hard } = checkDrop(classId, sem, teacherId, null, k);
      if (hard) { skipped.push(`${shortDate(dd)} — ${reasons[0]}`); continue; }
      if (reasons.length) soft.push(`${shortDate(dd)} — ${reasons.join(', ')}`);
      made.push(k);
    }
    const doAdd = async () => { const ns = { ...slots }; const removed = { ...(lessons[docId]?.removed||{}) }; for (const k of made) { ns[k] = { t: subject, teacherId, from:'manual' }; delete removed[k]; }
      await applyMove(docId, ns, `${classLabel(classId)} ${subject}(${tName}) ${DAYS[d]} ${p}교시 ${made.length}회 반복 추가 (${shortDate(date)}부터)`, { removed }); setModal(null); toast(`${made.length}회 추가했습니다.`); };
    setModal({ type:'confirm', title:'반복 추가 미리보기', body:<div style={{maxHeight:'55vh',overflow:'auto'}}>
      <p style={{margin:'0 0 8px'}}><b>{classLabel(classId)} {subject}</b> ({tName}) · 매주 {DAYS[d]}요일 {p}교시 · {shortDate(date)}부터 <b>{made.length}</b>회{count==='end' ? ' (학기 끝까지)' : ` (요청 ${count}회)`}</p>
      {made.length>0 && <div className="hint" style={{marginBottom:8}}>{made.map(k=>shortDate(parseKey(k).date)).join(', ')}</div>}
      {skipped.length>0 && <div style={{marginBottom:8}}><b className="warn">건너뜀 ({skipped.length})</b>{skipped.map((x,i)=><div key={i} className="hint">· {x}</div>)}</div>}
      {soft.length>0 && <div><b className="warn">확인 필요 ({soft.length})</b> — 행사 시간이지만 포함했습니다{soft.map((x,i)=><div key={i} className="hint">· {x}</div>)}</div>}
    </div>, actions:[{label:'취소',on:()=>setModal(null)},{label:`${made.length}회 추가`,primary:true,on:doAdd}] });
  };
  // 지정한 칸 목록에 같은 수업 채우기 (채우기 핸들 드래그)
  const addLessonKeys = (classId, sem, keys, teacherId, subject) => {
    const docId = `${classId}_${sem}`; const slots = lessons[docId]?.slots || {}; const tName = teachers.find(t=>t.id===teacherId)?.name || '';
    const made = [], skipped = [], soft = [];
    for (const k of keys) { if (slots[k]?.teacherId===teacherId && canonSubject(slots[k].t)===canonSubject(subject)) continue; const { reasons, hard } = checkDrop(classId, sem, teacherId, null, k); if (hard) { skipped.push(`${shortDate(parseKey(k).date)} — ${reasons[0]}`); continue; } if (reasons.length) soft.push(`${shortDate(parseKey(k).date)} — ${reasons.join(', ')}`); made.push(k); }
    if (!made.length && !skipped.length) return;
    const doAdd = async () => { const ns = { ...slots }; const removed = { ...(lessons[docId]?.removed||{}) }; for (const k of made) { ns[k] = { t: subject, teacherId, from:'manual' }; delete removed[k]; } await applyMove(docId, ns, `${classLabel(classId)} ${subject}(${tName}) ${made.length}칸 채우기`, { removed }); setModal(null); toast(`${made.length}칸 채웠습니다.`); };
    const dates = made.map(k=>parseKey(k)).sort((a,b)=>a.date.localeCompare(b.date)||a.p-b.p);
    setModal({ type:'confirm', title:'이대로 채울까요?', body:<div style={{maxHeight:'55vh',overflow:'auto'}}><p style={{margin:'0 0 8px'}}><b>{classLabel(classId)} {subject}</b> ({tName}) · <b>{made.length}</b>칸{dates.length>0 && <span className="hint"> · {shortDate(dates[0].date)} ~ {shortDate(dates.at(-1).date)}</span>}</p>
      {made.length>0 && <div className="hint" style={{marginBottom:8,lineHeight:1.6}}>{dates.map(x=>`${shortDate(x.date)} ${x.p}`).join(', ')}</div>}
      {skipped.length>0 && <div style={{marginBottom:8}}><b className="warn">건너뜀 ({skipped.length})</b>{skipped.map((x,i)=><div key={i} className="hint">· {x}</div>)}</div>}
      {soft.length>0 && <div><b className="warn">확인 필요 ({soft.length})</b> — 행사 시간이지만 포함했습니다{soft.map((x,i)=><div key={i} className="hint">· {x}</div>)}</div>}</div>,
      actions:[{label:'취소',on:()=>setModal(null)},{label:made.length?`${made.length}칸 채우기`:'닫기',primary:true,on: made.length ? doAdd : ()=>setModal(null)}] });
  };
  const askRepeat = (classId, sem, key, teacherId, subject) => addLesson(classId, sem, key, teacherId, subject); // 반복은 채우기 핸들로 대체
  const addLesson = (classId, sem, key, teacherId, subject) => {
    const docId = `${classId}_${sem}`; const slots = lessons[docId]?.slots || {};
    const { reasons, hard } = checkDrop(classId, sem, teacherId, null, key);
    const tName = teachers.find(t=>t.id===teacherId)?.name || '';
    const doAdd = async () => { const removed = { ...(lessons[docId]?.removed||{}) }; delete removed[key]; await applyMove(docId, { ...slots, [key]: { t: subject, teacherId, from:'manual' } }, `${classLabel(classId)} ${subject}(${tName}) ${shortDate(parseKey(key).date)} ${parseKey(key).p}교시 추가`, { removed }); setModal(null); toast('추가했습니다.'); };
    if (hard) { setModal({ type:'confirm', title:'넣을 수 없습니다', body:<div>{reasons.map((r,i)=><div key={i} className="warn">· {r}</div>)}</div>, actions:[{label:'닫기',on:()=>setModal(null)}] }); return; }
    if (!reasons.length) { doAdd(); return; }
    setModal({ type:'confirm', title:'이 시간에 추가할까요?', body:<div><p style={{margin:'4px 0 8px'}}><b>{classLabel(classId)} {subject}</b> ({tName}) — {fmtDate(parseKey(key).date)} {parseKey(key).p}교시</p>{reasons.map((r,i)=><div key={i} className="warn">· {r}</div>)}</div>, actions:[{label:'취소',on:()=>setModal(null)},{label:'그래도 추가',primary:true,on:doAdd}] });
  };
  const deleteLesson = (classId, sem, key) => {
    const docId = `${classId}_${sem}`; const slots = lessons[docId]?.slots || {}; const l = slots[key]; if (!l) return;
    const tName = teachers.find(t=>t.id===l.teacherId)?.name || '';
    setModal({ type:'confirm', title:'이 수업을 지울까요?', body:<p><b>{classLabel(classId)} {l.t}</b> ({tName}) — {fmtDate(parseKey(key).date)} {parseKey(key).p}교시<br/><span className="hint">담임시간표와 전담시간표에서 함께 지워집니다. 되돌리기로 복구할 수 있습니다.</span></p>,
      actions:[{label:'취소',on:()=>setModal(null)},{label:'지우기',primary:true,on:async()=>{ const ns={...slots}; delete ns[key]; const removed = { ...(lessons[docId]?.removed||{}), [key]: { t:l.t, teacherId:l.teacherId } }; await applyMove(docId, ns, `${classLabel(classId)} ${l.t}(${tName}) ${shortDate(parseKey(key).date)} ${parseKey(key).p}교시 삭제`, { removed }); setModal(null); toast('지웠습니다.'); }}] });
  };
  // 충돌 검사: 특정 학급·슬롯에 특정 전담 수업을 놓을 때
  const checkDrop = (classId, sem, teacherId, fromKey, toKey) => {
    const docId = `${classId}_${sem}`; const reasons = []; let hard = false;
    const cell = ctt[docId]?.cells?.[toKey];
    if (!cell) { reasons.push('시간표에 없는 칸입니다.'); hard = true; }
    else if (cell.k==='h') { reasons.push(`휴업일·학교행사(${cell.t}) 칸입니다.`); hard = true; }
    else if (cell.k==='e') reasons.push(`행사(${cell.ev||cell.t})로 잡힌 시간입니다.`);
    const mySlots = lessons[docId]?.slots || {};
    if (mySlots[toKey] && fromKey && toKey!==fromKey) { const tt = teachers.find(t=>t.id===mySlots[toKey].teacherId); reasons.push(`${classLabel(classId)}에 이미 ${tt?.name||''} ${mySlots[toKey].t} 수업이 있습니다.`); }
    if (mySlots[toKey] && !fromKey) { const tt = teachers.find(t=>t.id===mySlots[toKey].teacherId); reasons.push(`${classLabel(classId)}에 이미 ${tt?.name||''} ${mySlots[toKey].t} 수업이 있습니다.`); hard = true; }
    for (const o of Object.values(lectures)) if ((o.slots||[]).some(sl=>sl.classId===classId && slotKey(sl.date,sl.p)===toKey)) { reasons.push(`${o.kind} "${o.name}"이 있는 시간입니다.`); hard = true; }
    for (const [id, L] of Object.entries(lessons)) { if (id===docId || !id.endsWith('_'+sem)) continue; const s = L.slots?.[toKey]; if (s && s.teacherId===teacherId) { const tt = teachers.find(t=>t.id===teacherId); reasons.push(`${tt?.name||'전담'} 선생님이 그 시간에 ${classLabel(id.split('_')[0])} 수업이 있습니다.`); } }
    return { reasons, hard };
  };
  const requestMove = (classId, sem, fromKey, toKey) => {
    if (fromKey===toKey) return;
    const docId = `${classId}_${sem}`; const slots = lessons[docId]?.slots || {}; const lesson = slots[fromKey]; if (!lesson) return;
    const { reasons, hard } = checkDrop(classId, sem, lesson.teacherId, fromKey, toKey);
    const target = slots[toKey];
    const tName = teachers.find(t=>t.id===lesson.teacherId)?.name || '';
    const doMove = async (swap) => {
      const ns = { ...slots }; delete ns[fromKey];
      if (swap && target) ns[fromKey] = target; else if (target) { /* 덮어쓰기 대신 이동 취소 */ }
      ns[toKey] = { ...lesson, from:'move', orig: lesson.orig || fromKey };
      await applyMove(docId, ns, `${classLabel(classId)} ${lesson.t}(${tName}) ${shortDate(parseKey(fromKey).date)} ${parseKey(fromKey).p}교시 → ${shortDate(parseKey(toKey).date)} ${parseKey(toKey).p}교시${swap?' (맞바꿈)':''}`);
      setModal(null); toast('옮겼습니다.');
    };
    setModal({ type:'confirm', title: hard ? '옮길 수 없습니다' : '이 시간으로 옮길까요?', body: (
      <div>
        <p style={{margin:'4px 0 10px'}}><b>{classLabel(classId)} {lesson.t}</b>{tName && ` (${tName})`}<br/>{fmtDate(parseKey(fromKey).date)} {parseKey(fromKey).p}교시 → <b>{fmtDate(parseKey(toKey).date)} {parseKey(toKey).p}교시</b></p>
        {reasons.map((r,i)=><div key={i} className="warn">· {r}</div>)}

      </div>),
      actions: hard ? [{ label:'닫기', on:()=>setModal(null) }] : [
        { label:'취소', on:()=>setModal(null) },
        ...(target && !hard ? [{ label:'맞바꾸기', on:()=>doMove(true) }] : []),
        { label: reasons.length ? '그래도 옮기기' : '옮기기', primary:true, on:()=>doMove(false) },
      ] });
  };

  // ----- 외부강의 저장: 강의 + 특별실 예약 + 일정표 한 번에 -----
  const saveLecture = async (lec) => {
    const id = lec.id || newId(); const L = { ...lec, id, updatedAt: nowIso(), updatedBy: editorName() };
    await setDoc(dref('lectures', id), L);
    // 특별실 예약 재생성
    for (const [bid,b] of Object.entries(bookings)) if (b.lectureId===id) await deleteDoc(dref('room_bookings', bid));
    if (L.room) for (const sl of L.slots) { const tt = periodTime(bell, gradeOf(sl.classId), sl.p); await setDoc(dref('room_bookings', `lec_${id}_${sl.classId}_${sl.date}_${sl.p}`), { room: L.room, date: sl.date, p: sl.p, colKey: tt?`${tt.s}-${tt.e}`:null, classId: sl.classId, grade: gradeOf(sl.classId), text: classCode(sl.classId), lectureId: id, createdBy: editorName(), createdAt: nowIso() }); }
    // 일정표: 외부강의만 날짜별 한 줄 (영양·보건·상담은 일정표에 넣지 않음)

      await setDoc(calDoc(eid), { date, endDate: date, activity: L.name, time: periodsText(ps), department: `${L.grade}학년`, manager: L.instructor || '', location: L.room || '', note: [isNoncurr(L) ? L.kind : '', L.subject && !isNoncurr(L) ? subjectName(L.subject) : ''].filter(Boolean).join(' · '), isImportant: false, groupId: `lec_${id}`, lectureId: id, isRepeating: false, repeatDays: [], excludeWeekends: false }); }
    for (const ev of calEvents) if (ev.lectureId===id && !keep.has(ev.id)) await deleteDoc(calDoc(ev.id));
    log('lecture', `${L.kind} "${L.name}" ${L.grade}학년 ${L.slots.length}칸 저장`);
    return id;
  };
  const deleteLecture = async (id) => {
    for (const [bid,b] of Object.entries(bookings)) if (b.lectureId===id) await deleteDoc(dref('room_bookings', bid));
    for (const ev of calEvents) if (ev.lectureId===id) await deleteDoc(calDoc(ev.id));
    await deleteDoc(dref('lectures', id)); log('lecture', `강의 ${id} 삭제`);
  };
  const addBooking = async (b, repeatWeeks) => {
