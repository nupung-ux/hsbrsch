    for (let i=0; i<(repeatWeeks||1); i++) { const date = addDays(b.date, 7*i); await setDoc(dref('room_bookings', `m_${b.room}_${date}_${b.p}_${Date.now().toString(36)}${i}`), { ...b, date, groupId: gid, createdBy: editorName(), createdAt: nowIso() }); }
    log('booking', `${b.room} ${b.date} ${b.p}교시 "${b.text}" ${repeatWeeks>1?repeatWeeks+'주 반복':''}`);
  };
  const deleteBooking = async (bid, wholeGroup) => { const b = bookings[bid]; if (!b) return; if (wholeGroup && b.groupId) { for (const [k,v] of Object.entries(bookings)) if (v.groupId===b.groupId) await deleteDoc(dref('room_bookings', k)); } else await deleteDoc(dref('room_bookings', bid)); log('booking', `${b.room} ${b.date} ${b.p}교시 예약 삭제`); };

  // ----- 백업 / 초기화 -----
  const backupAll = () => {
    const data = { exportedAt: nowIso(), appId: APP_ID, year, teachers, roles, class_timetables: ctt, lessons, lectures, room_bookings: bookings, teacher_notes: teacherNotes, logs };
    const blob = new Blob([JSON.stringify(data, null, 1)], { type:'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `통합시간표_백업_${year.year}학년도_${TODAY}.json`; a.click(); URL.revokeObjectURL(a.href);
    log('backup', '전체 백업 내려받기');
  };
  const resetYear = async (keepSettings) => {
    const cols = ['class_timetables','lessons','lectures','room_bookings','teacher_notes'];
    for (const c of cols) { const snap = await getDocs(query(cref(c))); for (const d of snap.docs) await deleteDoc(d.ref); }
    for (const ev of calEvents) if (ev.lectureId) await deleteDoc(calDoc(ev.id));
    if (!keepSettings) { await setDoc(sref('year'), { ...year, year: (year.year||2026)+1, semesters: {} }); await setDoc(sref('roles'), { byEmail: {} }); }
    else await setDoc(sref('year'), { ...year, semesters: {} }, { merge:false });
    log('reset', keepSettings ? '시간표 데이터 초기화(설정 유지)' : '학년도 초기화');
  };

  // ----- 빈 연간시간표 (한글 파일 없이 시작) -----
  const createBlank = async (classId, sem) => {
    const weeks = year.semesters?.[sem]?.weeks; if (!weeks?.length) { toast(`학년도 설정에서 ${sem}학기 기간을 먼저 정해 주세요.`, true); return; }
    const id = `${classId}_${sem}`; if (ctt[id]) return;
    await setDoc(dref('class_timetables', id), { classId, sem, year: year.year, weeks: weeks.map(w=>({ ...w, note: w.note||'' })), cells: blankCells(weeks), totals: {}, source:'blank', uploadedAt: nowIso(), uploadedBy: editorName() });
    if (!lessons[id]) await setDoc(dref('lessons', id), { classId, sem, slots: {}, updatedAt: nowIso(), updatedBy: editorName() });
    log('blank', `${classLabel(classId)} ${sem}학기 빈 시간표 생성`);
  };
  const createBlankAll = async (sem) => { let n=0; for (const c of classList) if (!ctt[`${c}_${sem}`]) { await createBlank(c, sem); n++; } toast(n ? `${n}개 학급에 ${sem}학기 빈 시간표를 만들었습니다.` : '이미 모든 학급에 시간표가 있습니다.'); };

  // ----- hwpx 업로드 -----
  const onUpload = async (fileOrList) => {
    const files = Array.from(fileOrList?.length!=null && !(fileOrList instanceof File) ? fileOrList : [fileOrList]).filter(Boolean);
    if (!files.length) return;
    const parsed = []; const failed = [];
    for (const f of files) { try { const r = await parseHwpx(f); if (!r.length) failed.push(`${f.name}: 연간시간표 표를 찾지 못함`); parsed.push(...r); } catch (e) { console.error(e); failed.push(`${f.name}: 읽기 실패`); } }
    if (!parsed.length) { toast(failed[0] || '파일을 읽지 못했습니다.', true); return; }
    parsed.sort((a,b)=>(a.classId||'').localeCompare(b.classId||'', 'ko', { numeric:true }) || a.sem-b.sem);
    setModal({ type:'upload', parsed, choices: {}, failed, fileCount: files.length });
  };
  const saveUpload = async (parsed, choices, modes) => {
    const list = parsed.filter(p => p.classId);
    for (const p of list) {
      const id = `${p.classId}_${p.sem}`;
      let { slots } = computeAssignments(p, teachers, choices[id]||{});
      let cells = p.grid; let weeks = p.weeks; let extra = {};
      const old = ctt[id]; const oldL = lessons[id];
      if (old && (modes?.[id]||'merge')==='merge') {
        // 앱에서 손댄 것(행사 표시·해제·이동, 비고)은 유지
        cells = { ...p.grid }; for (const [k,c] of Object.entries(old.cells||{})) if (c.app) cells[k] = { ...(cells[k]||{ t:'' }), k: c.k, ev: c.ev||'', app:true };
        weeks = p.weeks.map(w => { const ow = (old.weeks||[]).find(x=>x.no===w.no); return ow?.noteApp ? { ...w, note: ow.note, noteApp:true } : w; });
        // 앱에서 추가·이동한 전담 수업은 유지, 삭제한 것은 다시 넣지 않음
        if (oldL) { for (const [k,v] of Object.entries(oldL.slots||{})) { if (v.from==='manual' || v.from==='move') { slots[k] = v; if (v.from==='move' && v.orig && v.orig!==k && slots[v.orig]?.teacherId===v.teacherId) delete slots[v.orig]; } }
          for (const [k,r] of Object.entries(oldL.removed||{})) if (slots[k] && slots[k].teacherId===r.teacherId && !['manual','move'].includes(slots[k].from)) delete slots[k];
          extra = { removed: oldL.removed||{} }; }
      }
      await setDoc(dref('class_timetables', id), { classId: p.classId, sem: p.sem, year: p.year, weeks, cells, totals: p.totals, source:'hwpx', uploadedAt: nowIso(), uploadedBy: editorName() });
      await setDoc(dref('lessons', id), { classId: p.classId, sem: p.sem, ...extra, slots, updatedAt: nowIso(), updatedBy: editorName() });
      // 학기 주차 정보를 학년도 설정에 보관 (첫 업로드 기준)
      if (!year.semesters?.[p.sem]?.weeks?.length) await setDoc(sref('year'), { ...year, year: p.year, semesters: { ...(year.semesters||{}), [p.sem]: { weeks: p.weeks.map(w=>({no:w.no,start:w.start,label:w.label})) } } }, { merge:true });
      log('upload', `${classLabel(p.classId)} ${p.sem}학기 연간시간표 업로드`);
    }
    setModal(null); toast(list.length>4 ? `${list.length}개 시간표를 저장했습니다.` : `${list.map(p=>`${classLabel(p.classId)} ${p.sem}학기`).join(', ')} 저장했습니다.`);
  };

  if (!user || !year) return <div className="empty">불러오는 중…</div>;

  return <>
    <div className="top">
      <h1>통합 시간표 <span className="hint" style={{fontWeight:400}}>시험판 · {year.year}학년도</span></h1>
      <div className="tabs">
        <button className="btn" style={{marginRight:8,borderRadius:6}} onClick={goHome} title="내 첫 화면으로">⌂ 홈</button>
        <button className={tab==='class'?'on':''} onClick={()=>setTab('class')}>담임시간표</button>
        <button className={tab==='teacher'?'on':''} onClick={()=>setTab('teacher')}>전담시간표</button>
        <button className={tab==='lecture'?'on':''} onClick={()=>setTab('lecture')}>외부강의</button>
        <button className={tab==='room'?'on':''} onClick={()=>setTab('room')}>특별실</button>
        <button className={tab==='sub'?'on':''} onClick={()=>setTab('sub')}>보결</button>
        <button className={tab==='status'?'on':''} onClick={()=>setTab('status')}>현황</button>
        <button className={tab==='settings'?'on':''} onClick={()=>setTab('settings')}>학년도 설정</button>
      </div>
      <div className="spacer"/>
      {undoN>0 && <button className="btn" onClick={undo}>되돌리기 ({undoN})</button>}
      {(realAdmin || tryRole) && <label className="hint" style={{display:'flex',gap:4,alignItems:'center'}}>역할 체험
        <select value={tryRole ? `${tryRole.type}:${tryRole.classId||tryRole.teacherId}` : ''} onChange={e=>{ const v=e.target.value; if (!v) { setTryRole(null); return; } const [ty,id]=v.split(':'); if (ty==='담임') setTryRole({ type:'담임', classId:id, name:`${id} 담임` }); else if (ty==='교무실무사') setTryRole({ type:'교무실무사', name:'교무실무사' }); else { const t=teachers.find(x=>x.id===id); setTryRole({ type:'전담', teacherId:id, name:`${t?.name||''} 전담` }); } }} style={{padding:'4px 6px',border:'1px solid var(--line-strong)',borderRadius:6}}>
          <option value="">관리자(전체)</option>
          <optgroup label="담임으로 보기">{classList.filter(c=>!c.startsWith('유')).map(c=><option key={c} value={`담임:${c}`}>{classLabel(c)} 담임</option>)}</optgroup>
          <optgroup label="전담으로 보기">{teachers.map(t=><option key={t.id} value={`전담:${t.id}`}>{t.name} ({teacherSubjects(t)})</option>)}</optgroup>
          <option value="교무실무사:x">교무실무사 (보결 관리)</option>
        </select></label>}
      <span className="who">{tryRole ? `체험 중: ${tryRole.name}` : email ? `${myRole?.name||email}${myRole?` · ${myRole.type}${myRole.classId?' '+myRole.classId:''}`:' · 역할 미지정'}` : '로그인 안 됨 (보기만 가능)'}{adminOn && ' · 관리자'}</span>
      {email ? <button className="btn" onClick={()=>signOut(auth)}>로그아웃</button> : <button className="btn" onClick={googleLogin}>학교 계정으로 로그인</button>}
      {email && !myRole && <button className="btn" onClick={()=>setModal({type:'role', email, name:user.displayName})}>역할 선택</button>}
      {!isAdmin && <button className="btn" onClick={()=>setModal({type:'admin'})}>관리자</button>}
      <span className="hint" style={{fontSize:12}}>{VERSION}</span>
    </div>

    {tab==='class' && <ClassView key={'c'+homeKey} defaultCid={myRole?.classId} {...{ year, classList, teachers, ctt, lessons, lectures, canEditClass, requestMove, onUpload, toast, addLesson, askRepeat, addLessonKeys, deleteLesson, setModal, askText, saveClassWeekNote, markEvent, unmarkEvent, requestMoveEvent, createBlank }} />}
    {tab==='teacher' && <TeacherView key={'t'+homeKey} defaultTid={myRole?.teacherId} onSelfEdit={tid=>setModal({type:'teacherSelf', teacherId:tid})} setModal={setModal} {...{ year, teachers, ctt, lessons, lectures, canEditTeacher, requestMove, addLesson, askRepeat, addLessonKeys, deleteLesson, toast, teacherNotes, saveTeacherCell, saveTeacherWeekNote, askText }} />}
    {tab==='lecture' && <LectureView key={'l'+homeKey} defaultGrade={myRole?.grade || gradeOf(myRole?.classId)} {...{ year, bell, classList, teachers, ctt, lessons, lectures, bookings, canEditLecture, saveLecture, deleteLecture, toast, setModal }} />}
    {tab==='room' && <RoomView {...{ year, bell, classList, teachers, ctt, lessons, bookings, lectures, canBook, addBooking, deleteBooking, myRole, toast, setModal, goLecture: ()=>setTab('lecture') }} />}
    {tab==='calendar' && <CalendarView {...{ calEvents, calAppId, lectures }} />}
    {tab==='sub' && <SubView {...{ year, bell, classList, teachers, ctt, lessons, lectures, subs, canEdit: canSub, setModal, toast, defaultCid: myRole?.classId, saveSub: async (id, data) => { await setDoc(dref('subs', id), { ...data, createdBy: editorName(), createdAt: nowIso() }); log('sub', `${classLabel(data.classId)} ${shortDate(data.date)} ${data.p}교시 보결 → ${data.label}`); }, deleteSub: async (id) => { const d = subs[id]; await deleteDoc(dref('subs', id)); if (d) log('sub', `${classLabel(d.classId)} ${shortDate(d.date)} ${d.p}교시 보결 삭제`); } }} />}
    {tab==='status' && <StatusView {...{ year, teachers, classList, ctt, lessons, lectures, logs, isAdmin }} />}
    {tab==='settings' && (isAdmin ? <Settings {...{ year, teachers, roles, isAdmin, classList, toast, log }} onBlankAll={createBlankAll} onBackup={backupAll} onReset={(keep)=>setModal({ type:'confirm', title: keep ? '시간표 데이터를 모두 지울까요?' : '학년도를 초기화할까요?', body:<div><p className="warn">되돌릴 수 없습니다. 먼저 [전체 백업 내려받기]를 해 두세요.</p><p>{keep ? '담임·전담 시간표, 외부강의, 특별실 예약, 메모가 모두 지워지고 학급·전담·특별실·시정표 설정은 남습니다.' : '모든 시간표 데이터와 역할이 지워지고 학년도가 1년 올라갑니다. 학급 수·전담·특별실·시정표 설정은 남으니 바뀐 것만 고치면 됩니다.'}</p><p className="hint">연동된 일정표에서 외부강의로 들어간 줄도 함께 지웁니다.</p></div>, actions:[{label:'취소',on:()=>setModal(null)},{label: keep ? '데이터 지우기' : '학년도 초기화', primary:true, on:async()=>{ setModal(null); await resetYear(keep); toast('초기화했습니다.'); }}] })} /> : tryRole ? <div className="empty"><p>역할 체험 중에는 학년도 설정을 볼 수 없습니다.</p><button className="btn primary" onClick={()=>setTryRole(null)}>관리자(전체)로 돌아가기</button></div> : <div className="empty"><p>학년도 설정은 관리자만 할 수 있습니다.</p><button className="btn primary" onClick={()=>setModal({type:'admin'})}>관리자 암호 입력</button></div>)}

    {modal?.type==='confirm' && <Modal title={modal.title} onClose={()=>setModal(null)}>{modal.body}<div className="row">{modal.actions.map((a,i)=><button key={i} className={'btn'+(a.primary?' primary':'')} onClick={a.on}>{a.label}</button>)}</div></Modal>}
    {modal?.type==='repeat' && <RepeatModal date={parseKey(modal.key).date} p={parseKey(modal.key).p} onOnce={modal.onOnce} onRepeat={modal.onRepeat} onClose={()=>setModal(null)} />}
    {modal?.type==='text' && <TextModal title={modal.title} value={modal.value} hint={modal.hint} onClose={()=>setModal(null)} onSave={async v=>{ await modal.onSave(v); setModal(null); }} />}
    {modal?.type==='pick' && <Modal title={modal.title} onClose={()=>setModal(null)}>
      {modal.hint && <p className="hint" style={{marginTop:0}}>{modal.hint}</p>}
      <div style={{display:'flex',flexDirection:'column',gap:6,maxHeight:'60vh',overflow:'auto'}}>{modal.options.map((o,i)=><button key={i} className="btn" disabled={o.disabled} style={{textAlign:'left',display:'flex',gap:10,alignItems:'center',background:o.color?undefined:'#fff'}} onClick={()=>{ setModal(null); modal.onPick(o); }}>{o.color && <i style={{display:'inline-block',width:16,height:16,background:o.color,border:'1px solid var(--line)'}}/>}<b>{o.label}</b>{o.sub && <span className="hint">{o.sub}</span>}</button>)}</div>
      <div className="row"><button className="btn" onClick={()=>setModal(null)}>취소</button></div>
    </Modal>}
    {modal?.type==='teacherSelf' && <TeacherSelfModal teachers={teachers} teacherId={modal.teacherId} classList={classList} rooms={year.rooms||[]} toast={toast} onClose={()=>setModal(null)} onSaved={()=>{ setModal(null); toast('저장했습니다.'); log('settings','전담 본인 담당 설정'); }} />}
    {modal?.type==='book' && <BookModal room={modal.room} date={modal.date} col={modal.col} classList={classList} myRole={myRole} onClose={()=>setModal(null)} onSave={async(b,n)=>{ await addBooking(b,n); setModal(null); toast('예약했습니다.'); }} />}
    {modal?.type==='admin' && <AdminModal adminHash={adminHash} onOk={adminUnlock} onClose={()=>setModal(null)} />}
    {modal?.type==='role' && <RoleModal email={modal.email} name={modal.name} classList={classList} teachers={teachers} onSave={saveRole} onClose={()=>setModal(null)} />}
    {modal?.type==='upload' && <UploadModal parsed={modal.parsed} failed={modal.failed} fileCount={modal.fileCount} teachers={teachers} existing={ctt} lessons={lessons} canEditClass={canEditClass} onSave={saveUpload} onClose={()=>setModal(null)} />}
    {toastEl}
  </>;
}

// ---------- 연간표 격자 (담임·전담 공용) ----------
function Grid({ weeks, renderCell, notes, onDragStart, onDrop, canDrop, dimPast, onCellClick, onNoteClick, onFill }) {
  const [over, setOver] = useState(null);
  const [fill, setFill] = useState(null); // { fromKey, col, wi, toWi, toCol }  (col = 요일*6 + 교시-1)
  const fillKeys = useMemo(() => { if (!fill || fill.toWi==null) return new Set(); const a = Math.min(fill.wi, fill.toWi), b = Math.max(fill.wi, fill.toWi); const c1 = Math.min(fill.col, fill.toCol), c2 = Math.max(fill.col, fill.toCol); const ks = new Set();
    for (let i=a;i<=b;i++) for (let c=c1;c<=c2;c++) { const k = slotKey(addDays(weeks[i].start, Math.floor(c/6)), (c%6)+1); if (k!==fill.fromKey) ks.add(k); } return ks; }, [fill, weeks]);
  useEffect(() => { if (!fill) return; document.body.classList.add('filling'); const up = () => { const ks = Array.from(fillKeys); setFill(null); if (ks.length && onFill) onFill(fill.fromKey, ks); }; addEventListener('mouseup', up); return () => { removeEventListener('mouseup', up); document.body.classList.remove('filling'); }; }, [fill, fillKeys]);
  return <table className="tt">
    <thead>
      <tr><th rowSpan={2} style={{width:34}}>주</th><th rowSpan={2} style={{width:100}}>기간</th>{DAYS.map(d=><th key={d} colSpan={6} className="day">{d}</th>)}<th rowSpan={2} style={{width:220}}>비고</th></tr>
      <tr>{DAYS.map(d=>PERIODS.map(p=><th key={d+p} className={'pn'+(p===1?' day':'')} style={{width:'var(--cell)'}}>{p}</th>))}</tr>
    </thead>
    <tbody>
      {weeks.map((w,wi) => <tr key={w.no}>
        <td className="wk">{w.no}</td><td className="period">{w.label}</td>
        {DAYS.map((d,di)=>PERIODS.map(p=>{
          const date = addDays(w.start, di); const key = slotKey(date,p);
          const c = renderCell(key, date, p) || {};
          const droppable = onDrop && canDrop?.(key);
          return <td key={key} title={`${fmtDate(date)} ${p}교시${c.title?' · '+c.title:''}`}
            onMouseEnter={fill ? ()=>setFill(f=>({ ...f, toWi: wi, toCol: di*6+p-1 })) : undefined}
            className={['slot', p===1?'first':'', c.cls||'', over===key?(c.bad?'bad':'over'):'', dimPast&&isPast(date)?'past':'', fillKeys.has(key)?'fillsel':''].join(' ')}
            draggable={!!c.draggable}
            onDragStart={c.draggable ? e=>{ e.dataTransfer.effectAllowed='move'; onDragStart(key); } : undefined}
            onDragOver={droppable ? e=>{ e.preventDefault(); if(over!==key) setOver(key); } : undefined}
            onDragLeave={droppable ? ()=>setOver(o=>o===key?null:o) : undefined}
            onDrop={droppable ? e=>{ e.preventDefault(); setOver(null); onDrop(key); } : undefined}
            onClick={onCellClick ? ()=>onCellClick(key, date, p) : undefined}
            style={{ ...(c.style||{}), ...(onCellClick && c.clickable ? { cursor:'pointer' } : {}) }}
          >{c.text||''}{onFill && c.fillable && <span className="fh" title="끌어서 같은 수업 채우기 (아래·옆 모두 가능)" onMouseDown={e=>{ e.preventDefault(); e.stopPropagation(); setFill({ fromKey:key, col:di*6+p-1, wi, toWi:null, toCol:null }); }} onClick={e=>e.stopPropagation()} />}</td>;
        }))}
        <td className={'note'+(onNoteClick?' ed':'')} title={(notes?.[w.no]||w.note||'')+(onNoteClick?' (누르면 수정)':'')} onClick={onNoteClick ? ()=>onNoteClick(w.no, notes?.[w.no]||w.note||'') : undefined}>{notes?.[w.no]||w.note||''}</td>
      </tr>)}
    </tbody>
  </table>;
}

// ---------- 담임시간표 ----------
function useFixedHead() {
  const ref = useRef(null); const [h, setH] = useState(0);
  useEffect(() => { const el = ref.current; if (!el) return; const f = () => setH(el.offsetHeight); f(); const ro = new ResizeObserver(f); ro.observe(el); return () => ro.disconnect(); }, []);
  const top = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--topbar')) || 53;
  return [ref, { '--fixed': `${top + h}px` }];
}
function PastToggle({ value, onChange }) { return <label><input type="checkbox" checked={value} onChange={e=>{ onChange(e.target.checked); writePref('dimPast', e.target.checked); }} /> 지난 날짜 흐리게</label>; }
function ClassView({ year, classList, teachers, ctt, lessons, lectures, canEditClass, requestMove, onUpload, toast, defaultCid, addLesson, askRepeat, addLessonKeys, deleteLesson, setModal, askText, saveClassWeekNote, markEvent, unmarkEvent, requestMoveEvent, createBlank }) {
  const [dimPast, setDimPast] = useState(readPref('dimPast', true));
  const [headRef, fixedStyle] = useFixedHead();
  const [cid, setCid] = useState(location.hash.match(/#\/class\/([^/]+)/)?.[1] || defaultCid || classList[0] || '');
  const [sem, setSem] = useState(1);
  const [showAll, setShowAll] = useState(false);
  const dragRef = useRef(null);
  const fileRef = useRef();
  const [fileOver, setFileOver] = useState(false);
  const overCnt = useRef(0);
  const isFileDrag = e => Array.from(e.dataTransfer?.types||[]).includes('Files');
  const onFileDragEnter = e => { if (!isFileDrag(e)) return; e.preventDefault(); overCnt.current++; setFileOver(true); };
  const onFileDragOver = e => { if (!isFileDrag(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = edit ? 'copy' : 'none'; };
  const onFileDragLeave = e => { if (!isFileDrag(e)) return; overCnt.current = Math.max(0, overCnt.current-1); if (!overCnt.current) setFileOver(false); };
  const onFileDrop = e => { if (!isFileDrag(e)) return; e.preventDefault(); overCnt.current = 0; setFileOver(false);
    const files = Array.from(e.dataTransfer.files||[]).filter(f => /\.hwpx$/i.test(f.name));
    if (!edit) { toast('이 학급의 시간표를 올릴 권한이 없습니다.'); return; }
    if (!files.length) { toast('hwpx 파일만 올릴 수 있습니다.'); return; }
    onUpload(files); };
  useEffect(()=>{ if (!cid && classList.length) setCid(classList[0]); }, [classList]);
  useEffect(()=>{ if (cid) history.replaceState(null,'',`#/class/${cid}`); }, [cid]);
  const id = `${cid}_${sem}`; const T = ctt[id]; const L = lessons[id]?.slots || {};
  const edit = canEditClass(cid);
  const tById = Object.fromEntries(teachers.map(t=>[t.id,t]));
  const conflictKeys = useMemo(() => { // 같은 전담이 같은 시간에 다른 반
    const s = new Set();
    for (const [k,v] of Object.entries(L)) for (const [oid,o] of Object.entries(lessons)) { if (oid===id||!oid.endsWith('_'+sem)) continue; if (o.slots?.[k]?.teacherId===v.teacherId) s.add(k); }
    return s; }, [lessons, id, sem]);
  const lecAt = useMemo(() => { const m = {}; for (const lec of Object.values(lectures)) for (const sl of (lec.slots||[])) if (sl.classId===cid) m[slotKey(sl.date, sl.p)] = lec; return m; }, [lectures, cid]);
  const myLectures = useMemo(() => Object.values(lectures).filter(l => (l.slots||[]).some(sl=>sl.classId===cid)).map(l => ({ ...l, mine: l.slots.filter(sl=>sl.classId===cid).sort((a,b)=>a.date.localeCompare(b.date)||a.p-b.p) })), [lectures, cid]);
  // 이 반을 맡는 전담의 과목별 시수 (현재/기준)
  const subjectStats = useMemo(() => { const out = []; for (const t0 of teachers) { const t = normTeacher(t0); for (const sub of t.subjects) { if (!(sub.classes||[]).includes(cid)) continue; const h = subjectHours(sub, t.id, cid, sem, lessons, ctt); out.push({ teacher:t, sub, n:h.n, exp:h.exp, mode:h.mode }); } } return out; }, [teachers, lessons, ctt, cid, sem]);
  const options = subjectStats.map(x=>({ teacherId:x.teacher.id, subject:x.sub.subject, label:`${x.sub.subject} ${x.teacher.name}`, color:x.teacher.color }));
  const renderCell = (key) => {
    const cell = T?.cells?.[key]; const les = L[key]; const lec = lecAt[key];
    if (lec) return { text: <LecText lec={lec}/>, cls:'lec', title: `${lec.kind}${lec.subject&&!isNoncurr(lec)?' · '+subjectName(lec.subject):''}${lecName(lec)&&lecName(lec)!==lec.kind?' · '+lecName(lec):''}${lec.room?' · '+lec.room:''}` };
    if (les) { const t = tById[les.teacherId]; return { text: les.t, cls: 'lesson'+(conflictKeys.has(key)?' conflict':''), style: { background: t?.color||'#fff3b0' }, draggable: edit, clickable: edit, fillable: edit, title: (t?.name||'전담')+(conflictKeys.has(key)?' · 다른 반과 겹침':'')+(edit?' · 누르면 삭제':'') }; }
    if (!cell) return { text:'', style:{background:'#f5f5f3'} };
    if (cell.k==='h') return { text: cell.t, cls:'h', title:'휴업일·행사' };
    if (cell.k==='e') return { text: cell.t, cls:'e', clickable: edit, draggable: edit, title:'행사'+(cell.ev?` · ${cell.ev}`:'')+(edit?' · 누르면 수정, 끌어서 이동':'') };
    return { text: showAll ? cell.t : '', cls:'faint', clickable: edit, title: edit ? '누르면 전담 수업 추가' : '' };
  };
  const pickAdd = (key, date, p) => setModal({ type:'pick', title:`${fmtDate(date)} ${p}교시에 추가`, hint:`${classLabel(cid)} — 무엇을 넣을까요?`, options: [...options, { ev:true, label:'행사 시간으로 표시', sub:'파란 밑줄로 표시됩니다. 외부강의 배정 때 확인 대상이 됩니다.' }], onPick: o => o.ev ? askText('행사명 (비워도 됩니다)', '', v=>markEvent(cid, sem, key, v), `${fmtDate(date)} ${p}교시`) : askRepeat(cid, sem, key, o.teacherId, o.subject) });
  const onCellClick = (key, date, p) => {
    if (!edit) return; if (lecAt[key]) return;
    if (L[key]) { deleteLesson(cid, sem, key); return; }
    const cell = T?.cells?.[key]; if (!cell || cell.k==='h') return;
    if (cell.k==='e') { setModal({ type:'confirm', title:`행사 · ${fmtDate(date)} ${p}교시`, body:<p>{cell.ev ? <b>{cell.ev}</b> : <span className="hint">행사명 없음</span>} <span className="hint">(담임 과목 {cell.t})</span><br/><span className="hint">끌어서 다른 칸에 놓으면 옮길 수 있습니다.</span></p>,
      actions:[{label:'취소',on:()=>setModal(null)},{label:'행사 해제',on:()=>{ setModal(null); unmarkEvent(cid, sem, key); }},{label:'전담 수업 추가',on:()=>{ setModal(null); pickAdd(key,date,p); }},{label:'행사명 수정',primary:true,on:()=>{ setModal(null); askText('행사명', cell.ev||'', v=>markEvent(cid, sem, key, v), `${fmtDate(date)} ${p}교시`); }}] }); return; }
    pickAdd(key, date, p);
  };
  const canDrop = key => edit && !!T?.cells?.[key];
  return <div style={{...fixedStyle, position:'relative'}} onDragEnter={onFileDragEnter} onDragOver={onFileDragOver} onDragLeave={onFileDragLeave} onDrop={onFileDrop}>
    {fileOver && <div className="dropzone"><div><b>여기에 놓으면 연간시간표(hwpx)를 올립니다</b><br/><span className="hint">여러 파일을 한꺼번에 놓아도 됩니다. 학급은 파일 안의 정보로 자동 구분됩니다.</span></div></div>}
    <div className="fixedhead" ref={headRef}><div className="bar">
      <label>학급 <select value={cid} onChange={e=>setCid(e.target.value)}>{classList.map(c=><option key={c} value={c}>{classLabel(c)}</option>)}</select></label>
      <div className="seg"><button className={sem===1?'on':''} onClick={()=>setSem(1)}>1학기</button><button className={sem===2?'on':''} onClick={()=>setSem(2)}>2학기</button></div>
      <label><input type="checkbox" checked={showAll} onChange={e=>setShowAll(e.target.checked)} /> 담임 과목도 보기</label>
      <PastToggle value={dimPast} onChange={setDimPast} />
      <div className="spacer"/>
      <div className="legend">{subjectStats.map(x=><span key={x.teacher.id+x.sub.subject} title={(x.mode==='year'?'연간 기준 · ':'')+(x.exp!=null?`기준 ${x.exp}시간`:'')}><i style={{background:x.teacher.color}}/>{x.sub.subject} {x.teacher.name} <b style={{color:x.exp!=null&&x.n!==x.exp?'var(--danger)':'inherit'}}>{x.n}</b>{x.exp!=null&&`/${x.exp}`}{x.mode==='year'&&<small style={{color:'var(--muted)'}}>연간</small>}</span>)}<span><i style={{background:'var(--holiday)'}}/>휴업·행사</span><span style={{color:'var(--event)',textDecoration:'underline'}}>행사시간</span></div>
      <input ref={fileRef} type="file" accept=".hwpx" multiple style={{display:'none'}} onChange={e=>{ if(e.target.files.length) onUpload(e.target.files); e.target.value=''; }} />
      <button className="btn primary" disabled={!edit} onClick={()=>fileRef.current.click()} title="여러 파일을 한 번에 선택하거나, 파일을 이 화면에 끌어다 놓아도 됩니다">연간시간표(hwpx) 올리기</button>
    </div></div>
    {!classList.length ? <div className="empty">학년도 설정에서 학급 수를 먼저 입력해 주세요.</div>
    : !T ? <div className="empty"><p>{classLabel(cid)} {sem}학기 시간표가 아직 없습니다.</p>{edit ? <div style={{display:'flex',gap:10,justifyContent:'center'}}><button className="btn primary" onClick={()=>fileRef.current.click()}>스쿨마스터 연간시간표(hwpx) 올리기</button>{year.semesters?.[sem]?.weeks?.length ? <button className="btn" onClick={()=>createBlank(cid, sem)}>빈 시간표로 시작</button> : <span className="hint" style={{alignSelf:'center'}}>빈 시간표로 시작하려면 학년도 설정에서 {sem}학기 기간을 정해 주세요.</span>}</div> : <p className="hint">담임 선생님이 올리면 여기에 나타납니다.</p>}<p className="hint" style={{marginTop:12}}>빈 시간표로 시작하면 전담·외부강의·행사를 바로 넣을 수 있고, 나중에 한글 파일을 올리면 입력한 내용은 유지한 채 나머지가 채워집니다.</p></div>
    : <div className="wrap">
        <Grid weeks={T.weeks} renderCell={renderCell} canDrop={canDrop} dimPast={dimPast} onCellClick={onCellClick} onNoteClick={edit ? (no, cur)=>askText(`${no}주 비고`, cur, v=>saveClassWeekNote(cid, sem, no, v)) : undefined}
          onFill={edit ? (from, keys)=>{ const l = L[from]; if (l) addLessonKeys(cid, sem, keys, l.teacherId, l.t); } : undefined}
          onDragStart={k=>{ dragRef.current=k; }} onDrop={k=>{ const from=dragRef.current; dragRef.current=null; if(!from) return; if (L[from]) requestMove(cid, sem, from, k); else if (T?.cells?.[from]?.k==='e') requestMoveEvent(cid, sem, from, k); }} />
        <p className="hint">{T.source==='blank' ? '빈 시간표로 시작' : '올린 사람'} {T.uploadedBy} · {T.uploadedAt?.slice(0,16).replace('T',' ')}{edit && ' · 빈 칸 누르면 전담 수업 또는 행사 추가, 전담 칸 누르면 삭제, 행사 칸 누르면 수정, 끌어서 놓으면 이동.'} · <span className="tag">외</span> 외부강의 <span className="tag b">영·보·상</span> 영양·보건·상담</p>
        {myLectures.length>0 && <div className="card" style={{margin:'8px 0 0'}}><h3>{classLabel(cid)} 외부강의·비교과</h3>
          {myLectures.map(l => <div key={l.id} style={{marginBottom:6}}><span className={'tag'+(isNoncurr(l)?' b':'')}>{l.kind}{l.subject&&!isNoncurr(l)?` · ${subjectName(l.subject)}`:''}</span> <b>{lecName(l)}</b> {l.instructor && `· ${l.instructor}`} {l.room && `· ${l.room}`} — {l.mine.map(sl=>`${shortDate(sl.date)} ${sl.p}교시`).join(', ')}</div>)}
        </div>}
      </div>}
  </div>;
}

// ---------- 전담시간표 ----------
function TeacherView({ year, teachers, ctt, lessons, lectures, canEditTeacher, requestMove, defaultTid, onSelfEdit, setModal, addLesson, askRepeat, addLessonKeys, deleteLesson, toast, teacherNotes, saveTeacherCell, saveTeacherWeekNote, askText }) {
  const [dimPast, setDimPast] = useState(readPref('dimPast', true));
  const [headRef, fixedStyle] = useFixedHead();
  const [tid, setTid] = useState(location.hash.match(/#\/teacher\/([^/]+)/)?.[1] || defaultTid || teachers[0]?.id || '');
  const [sem, setSem] = useState(1);
  const dragRef = useRef(null);
  useEffect(()=>{ if (!tid && teachers.length) setTid(teachers[0].id); }, [teachers]);
  useEffect(()=>{ if (tid) history.replaceState(null,'',`#/teacher/${tid}`); }, [tid]);
  const t = teachers.find(x=>x.id===tid);
  const edit = canEditTeacher(tid);
  const weeks = year.semesters?.[sem]?.weeks || [];
  // 슬롯별 이 전담의 수업 목록
  const mine = useMemo(() => { const m = {}; for (const [id,L] of Object.entries(lessons)) { if (!id.endsWith('_'+sem)) continue; for (const [k,v] of Object.entries(L.slots||{})) if (v.teacherId===tid) (m[k]=m[k]||[]).push({ classId: L.classId, ...v }); } return m; }, [lessons, tid, sem]);
  const counts = useMemo(() => { const c = {}; for (const arr of Object.values(mine)) for (const l of arr) { const k=`${canonSubject(l.t)}|${l.classId}`; c[k]=(c[k]||0)+1; } return c; }, [mine]);
  const memo = teacherNotes[`${tid}_${sem}`] || {};
  const hourRows = useMemo(() => { if (!t) return []; const out = []; for (const su of normTeacher(t).subjects) for (const c of (su.classes||[])) { const h = subjectHours(su, t.id, c, sem, lessons, ctt); out.push({ subject:su.subject, classId:c, ...h }); } return out; }, [t, lessons, ctt, sem]);
  const holiday = key => { const ids = teacherClasses(t||{}).map(c=>`${c}_${sem}`).filter(i=>ctt[i]); if (!ids.length) return null; const cells = ids.map(i=>ctt[i].cells?.[key]).filter(Boolean); if (cells.length && cells.every(c=>c.k==='h')) return cells[0].t; return null; };
  const renderCell = (key) => {
    const arr = mine[key];
    if (arr?.length) return { text: arr.map(l=>classCode(l.classId)).join('/'), cls:'lesson'+(arr.length>1?' conflict':''), style:{ background: gradeColor(arr[0].classId) }, draggable: edit, clickable: edit, fillable: edit && arr.length===1, title: (arr.length>1 ? '같은 시간에 두 반 — 끌어서 옮기면 어느 반을 옮길지 묻습니다' : classLabel(arr[0].classId))+(edit?' · 누르면 삭제':'') };
    const h = holiday(key); if (h) return { text:h, cls:'h' };
    const mm = memo.cells?.[key]; if (mm) return { text: mm, cls:'memo', clickable: edit, title: mm+(edit?' · 누르면 수정':'') };
    return { clickable: edit, title: edit ? '누르면 수업 추가 또는 메모' : '' };
  };
  const onCellClick = (key, date, p) => {
    if (!edit || !t) return; const arr = mine[key]||[];
    if (arr.length===1) { deleteLesson(arr[0].classId, sem, key); return; }
    if (arr.length>1) { setModal({ type:'confirm', title:'어느 반 수업을 지울까요?', body:<p>{fmtDate(date)} {p}교시</p>, actions:[{label:'취소',on:()=>setModal(null)}, ...arr.map(l=>({ label: classLabel(l.classId)+' 지우기', on:()=>deleteLesson(l.classId, sem, key) }))] }); return; }
    if (holiday(key)) return;
    if (memo.cells?.[key]) { askText('메모 수정', memo.cells[key], v=>saveTeacherCell(tid, sem, key, v), `${fmtDate(date)} ${p}교시`); return; }
    const opts = []; for (const sub of normTeacher(t).subjects) for (const c of (sub.classes||[])) { if (!ctt[`${c}_${sem}`]) continue; const cell = ctt[`${c}_${sem}`].cells?.[key]; if (!cell || cell.k==='h') continue; const taken = lessons[`${c}_${sem}`]?.slots?.[key]; opts.push({ teacherId:t.id, subject:sub.subject, classId:c, label:`${classLabel(c)} ${sub.subject}`, sub: taken ? `이미 ${taken.t} 수업 있음` : (cell.k==='e' ? `행사(${cell.t})` : `담임 ${cell.t}`), disabled: !!taken && taken.teacherId!==t.id }); }
    opts.push({ free:true, label:'✎ 직접 글자 입력', sub:'행사, 출장, 연수 등 메모 (내 시간표에만 표시)' });
    setModal({ type:'pick', title:`${fmtDate(date)} ${p}교시에 추가`, hint:`${t.name} — 어느 반 수업인가요?`, options: opts, onPick: o=> o.free ? askText('메모 입력', '', v=>saveTeacherCell(tid, sem, key, v), `${fmtDate(date)} ${p}교시`) : askRepeat(o.classId, sem, key, o.teacherId, o.subject) });
  };
  const canDrop = key => edit && !holiday(key);
  return <div style={fixedStyle}>
    <div className="fixedhead" ref={headRef}><div className="bar">
      <label>전담 <select value={tid} onChange={e=>setTid(e.target.value)}>{teachers.map(x=><option key={x.id} value={x.id}>{x.name} ({teacherSubjects(x)})</option>)}</select></label>
      <div className="seg"><button className={sem===1?'on':''} onClick={()=>setSem(1)}>1학기</button><button className={sem===2?'on':''} onClick={()=>setSem(2)}>2학기</button></div>
      {edit && t && <button className="btn" onClick={()=>onSelfEdit(tid)}>내 담당 설정</button>}
      <PastToggle value={dimPast} onChange={setDimPast} />
      <div className="spacer"/>
    </div>
    {t && hourRows.length>0 && <div style={{padding:'0 18px 10px'}}>
      <table className="ov"><thead><tr><th style={{width:50}}>과목</th>{hourRows.map(r=><th key={r.subject+r.classId} style={{background:gradeColor(r.classId),minWidth:44}}>{classCode(r.classId)}</th>)}<th style={{minWidth:50}}>합계</th></tr></thead>
        <tbody><tr><td className="wk">현재</td>{hourRows.map(r=><td key={r.subject+r.classId} style={{fontWeight:700,color: r.exp!=null && r.n!==r.exp ? 'var(--danger)' : 'inherit'}}>{r.has ? r.n : '—'}</td>)}<td style={{fontWeight:700}}>{hourRows.reduce((a,r)=>a+r.n,0)}</td></tr>
        <tr><td className="wk">기준</td>{hourRows.map(r=><td key={r.subject+r.classId} className="hint">{r.exp ?? '·'}{r.mode==='year'&&<small> 연</small>}</td>)}<td className="hint">{hourRows.reduce((a,r)=>a+(r.exp||0),0)||'·'}</td></tr>
        <tr><td className="wk">과목</td>{hourRows.map(r=><td key={r.subject+r.classId}>{r.subject}</td>)}<td/></tr></tbody></table>
      {hourRows.some(r=>r.mode==='year') && <div className="hint" style={{marginTop:4}}>"연" 표시 과목은 1·2학기를 합친 연간 시수 기준입니다.</div>}
    </div>}</div>
    {!t ? <div className="empty">학년도 설정에서 전담 교사를 먼저 등록해 주세요.</div>
    : !normTeacher(t).subjects.length ? <div className="empty">{t.name} 선생님의 담당 과목·학급이 아직 없습니다. {edit ? '[내 담당 설정]을 눌러 넣어 주세요.' : '전담 선생님이 설정하면 여기에 나타납니다.'}</div>
    : !weeks.length ? <div className="empty">{sem}학기 연간시간표가 아직 하나도 올라오지 않았습니다. 담임시간표 탭에서 학급 파일을 올리면 주차가 만들어집니다.</div>
    : <div className="wrap">
        <Grid weeks={weeks} renderCell={renderCell} canDrop={canDrop} dimPast={dimPast} onCellClick={onCellClick} notes={memo.weekNotes||{}}
          onFill={edit ? (from, keys)=>{ const l = mine[from]?.[0]; if (l) addLessonKeys(l.classId, sem, keys, l.teacherId, l.t); } : undefined} onNoteClick={edit ? (no, cur)=>askText(`${no}주 비고`, cur, v=>saveTeacherWeekNote(tid, sem, no, v)) : undefined}
          onDragStart={k=>{ dragRef.current=k; }} onDrop={k=>{ const from=dragRef.current; dragRef.current=null; if(!from) return; const arr = mine[from]||[]; if (!arr.length) return;
            if (arr.length===1) { requestMove(arr[0].classId, sem, from, k); return; }
            setModal({ type:'confirm', title:'어느 반을 옮길까요?', body:<p>{fmtDate(parseKey(from).date)} {parseKey(from).p}교시에 {arr.map(l=>classLabel(l.classId)).join(', ')} 수업이 겹쳐 있습니다. → {fmtDate(parseKey(k).date)} {parseKey(k).p}교시</p>,
              actions:[{label:'취소',on:()=>setModal(null)}, ...arr.map(l=>({ label: classLabel(l.classId)+' 옮기기', primary:true, on:()=>requestMove(l.classId, sem, from, k) }))] }); }} />
        <p className="hint">빨간 테두리 = 같은 시간에 두 반. {edit && '빈 칸 누르면 추가, 수업 칸 누르면 삭제, 끌어서 놓으면 이동, 수업 칸 오른쪽 아래 점을 끌면(아래·옆) 같은 수업 채우기 — 모두 그 반 담임시간표에도 함께 반영됩니다.'}</p>
      </div>}
  </div>;
}

// ---------- 보결 ----------
function SubView({ year, bell, classList, teachers, ctt, lessons, lectures, subs, canEdit, setModal, toast, defaultCid, saveSub, deleteSub }) {
  const subClasses = classList.filter(c=>!c.startsWith('유'));
  const [cid, setCid] = useState(defaultCid || subClasses[0] || '');
  const [sem, setSem] = useState((new Date().getMonth()+1)>=8 || (new Date().getMonth()+1)<=1 ? 2 : 1);
  const [dimPast, setDimPast] = useState(readPref('dimPast', true));
  const [headRef, fixedStyle] = useFixedHead();
  const id = `${cid}_${sem}`; const T = ctt[id]; const L = lessons[id]?.slots || {};
  const tById = Object.fromEntries(teachers.map(t=>[t.id,t]));
  const extra = (year.extraSubs ?? '교감, 교장').split(/[,，]+/).map(x=>x.trim()).filter(Boolean);
  const subsOf = useMemo(() => { const m = {}; for (const [k,v] of Object.entries(subs)) if (v.classId===cid) m[slotKey(v.date, v.p)] = { id:k, ...v }; return m; }, [subs, cid]);
  const lecAt = useMemo(() => { const m = {}; for (const lec of Object.values(lectures)) for (const sl of (lec.slots||[])) if (sl.classId===cid) m[slotKey(sl.date, sl.p)] = lec; return m; }, [lectures, cid]);
  const shortWho = v => v.whoType==='class' ? classCode(v.who) : v.label.slice(0,3);
  // 학기 보결 횟수 (공평 분배 참고)
  const counts = useMemo(() => { const c = {}; const w = year.semesters?.[sem]?.weeks||[]; if (!w.length) return c; const a = w[0].start, b = addDays(w.at(-1).start, 7); for (const v of Object.values(subs)) if (v.date>=a && v.date<b) c[v.label]=(c[v.label]||0)+1; return c; }, [subs, year, sem]);
  // 후보 계산: 날짜·교시에 비어 있는 사람
  const candidates = (date, p) => {
    const me = periodTime(bell, gradeOf(cid), p); const out = [];
    const busyBySub = (label) => Object.values(subs).some(v => v.date===date && v.label===label && !(v.classId===cid && v.p===p) && overlaps(me, periodTime(bell, gradeOf(v.classId), v.p)));
    const clicked = L[slotKey(date,p)];
    // 이 반 담임 (전담 시간을 클릭한 경우)
    if (clicked) out.push({ whoType:'class', who:cid, label:`${classCode(cid)} 담임`, why:'자기 반 전담 시간', busy: busyBySub(`${classCode(cid)} 담임`) });
    // 다른 반 담임: 그 반이 전담 수업 중이면 비어 있음 (외부강의 시간은 담임이 있어야 하므로 제외)
    for (const c of classList) { if (c===cid || c.startsWith('유')) continue; const Tc = ctt[`${c}_${sem}`]; if (!Tc) continue; const Lc = lessons[`${c}_${sem}`]?.slots || {};
      const qs = PERIODS.filter(q => overlaps(me, periodTime(bell, gradeOf(c), q)));
      if (!qs.length) continue;
      const lec = Object.values(lectures).some(l => (l.slots||[]).some(sl => sl.classId===c && sl.date===date && qs.includes(sl.p)));
      if (lec) continue;
      const whys = []; let ok = true;
      for (const q of qs) { const k = slotKey(date,q); const les = Lc[k]; const cell = Tc.cells?.[k];
        if (les) { const t = tById[les.teacherId]; whys.push(`${les.t} 전담${t?' '+t.name:''}`); }
        else if (!cell || cell.k==='h') { whys.push('휴업일'); }
        else if (!cell.t) { whys.push('수업 없음'); }
        else { ok = false; break; } }
      if (ok) out.push({ whoType:'class', who:c, label:`${classCode(c)} 담임`, why: Array.from(new Set(whys)).join(', '), busy: busyBySub(`${classCode(c)} 담임`) }); }
    // 전담: 그 시간에 수업이 없으면
    for (const t of teachers) { if (t.type==='coop') continue; let busy = null;
      for (const [lid,Ld] of Object.entries(lessons)) { if (!lid.endsWith('_'+sem)) continue; for (const [k,v] of Object.entries(Ld.slots||{})) if (v.teacherId===t.id && parseKey(k).date===date && overlaps(me, periodTime(bell, gradeOf(Ld.classId), parseKey(k).p))) busy = `${classCode(Ld.classId)} ${v.t} 수업`; }
      if (clicked && clicked.teacherId===t.id) continue; // 빠지는 전담 본인
      out.push({ whoType:'teacher', who:t.id, label:t.name, why: busy || '수업 없음', busy: !!busy || busyBySub(t.name) }); }
    for (const x of extra) out.push({ whoType:'extra', who:x, label:x, why:'', busy: busyBySub(x) });
    return out;
  };
  const onCellClick = (key, date, p) => {
    const cell = T?.cells?.[key]; if (!cell || cell.k==='h') return;
    const cur = subsOf[key];
    if (!canEdit) { if (cur) toast(`보결: ${cur.label}`); return; }
    const cands = candidates(date, p); const les = L[key]; const lec = lecAt[key];
    const title = `${classLabel(cid)} ${fmtDate(date)} ${p}교시 보결` + (les ? ` (${les.t} ${tById[les.teacherId]?.name||''} 전담 시간)` : lec ? ` (${lecName(lec)})` : '');
    setModal({ type:'confirm', title, body:<div style={{maxHeight:'60vh',overflow:'auto'}}>
      {cur && <p style={{margin:'0 0 8px'}}>현재 보결: <b>{cur.label}</b> <span className="hint">({cur.createdBy})</span></p>}
      <div className="hint" style={{marginBottom:6}}>비어 있는 분부터 보입니다. 숫자는 이번 학기 보결 횟수.</div>
      <div style={{display:'flex',flexDirection:'column',gap:4}}>
        {cands.sort((a,b)=>(a.busy?1:0)-(b.busy?1:0)).map((c,i)=><button key={i} className="btn" disabled={c.busy} style={{textAlign:'left',display:'flex',gap:10,alignItems:'center',background:c.busy?'#f3f3f1':'#fff'}} onClick={async()=>{ await saveSub(`${cid}_${date}_${p}`, { classId:cid, date, p, sem, whoType:c.whoType, who:c.who, label:c.label, origin: les ? `${les.t} ${tById[les.teacherId]?.name||''}` : lec ? lecName(lec) : '담임' }); setModal(null); toast(`${c.label} 보결로 배정했습니다.`); }}>
          <b style={{minWidth:90}}>{c.label}</b><span className="hint" style={{flex:1}}>{c.busy && c.whoType==='teacher' ? c.why : c.busy ? '다른 반 보결 중' : c.why}</span><span className="tag">{counts[c.label]||0}</span></button>)}
      </div></div>,
      actions:[{label:'취소',on:()=>setModal(null)}, ...(cur ? [{label:'보결 삭제',on:async()=>{ await deleteSub(cur.id); setModal(null); toast('지웠습니다.'); }}] : [])] });
  };
  const renderCell = (key) => {
    const cell = T?.cells?.[key]; const les = L[key]; const lec = lecAt[key]; const sb = subsOf[key];
    if (sb) return { text: shortWho(sb), cls:'sub', title:`보결 ${sb.label} (원래 ${sb.origin})` };
    if (lec) return { text: <LecText lec={lec}/>, cls:'lec subable', title: `${lecName(lec)} · 누르면 보결 배정` };
    if (les) { const t = tById[les.teacherId]; return { text: les.t, cls:'lesson subable', style:{ background: t?.color||'#fff3b0' }, title: `${t?.name||'전담'} · 누르면 보결 배정` }; }
    if (!cell) return { text:'', style:{background:'#f5f5f3'} };
    if (cell.k==='h') return { text: cell.t, cls:'h' };
    if (cell.k==='e') return { text: cell.t, cls:'e subable', title:'행사 · 누르면 보결 배정' };
    return { text: cell.t, cls:'faint subable', title:'담임 수업 · 누르면 보결 배정' };
  };
  const mine = Object.values(subsOf).sort((a,b)=>a.date.localeCompare(b.date)||a.p-b.p);
  const byWho = useMemo(() => { const m = {}; for (const v of Object.values(subs)) { const w = year.semesters?.[sem]?.weeks||[]; if (!w.length) continue; if (v.date>=w[0].start && v.date<addDays(w.at(-1).start,7)) (m[v.label]=m[v.label]||[]).push(v); } return Object.entries(m).sort((a,b)=>b[1].length-a[1].length); }, [subs, year, sem]);
  return <div style={fixedStyle}>
    <div className="fixedhead" ref={headRef}><div className="bar">
      <label>학급 <select value={cid} onChange={e=>setCid(e.target.value)}>{subClasses.map(c=><option key={c} value={c}>{classLabel(c)}</option>)}</select></label>
      <div className="seg"><button className={sem===1?'on':''} onClick={()=>setSem(1)}>1학기</button><button className={sem===2?'on':''} onClick={()=>setSem(2)}>2학기</button></div>
      <PastToggle value={dimPast} onChange={setDimPast} />
      <span className="hint">{canEdit ? '보결이 필요한 칸을 누르면 그 시간에 비어 있는 분이 나옵니다. 담임 과목 칸은 담임 부재, 전담 칸은 전담 부재로 봅니다.' : '보결 배정은 교무실무사 또는 관리자만 할 수 있습니다. 보기만 가능합니다.'}</span>
      <div className="spacer"/>
      <div className="legend"><span><i style={{background:'#ffd9a8'}}/>보결 배정됨</span></div>
    </div></div>
    {!T ? <div className="empty">{classLabel(cid)} {sem}학기 시간표가 없습니다. 담임시간표에서 먼저 올려 주세요.</div>
    : <div className="wrap">
      <Grid weeks={T.weeks} renderCell={renderCell} dimPast={dimPast} onCellClick={onCellClick} />
      <div style={{display:'flex',gap:14,alignItems:'flex-start',marginTop:14,flexWrap:'wrap'}}>
        <div className="card" style={{margin:0,flex:'1 1 420px'}}><h3>{classLabel(cid)} 보결 기록 ({mine.length})</h3>
          {!mine.length && <p className="hint">아직 없습니다.</p>}
          {mine.map(v=><div key={v.id} className="ev" style={{padding:'4px 0'}}><span style={{width:110}}>{fmtDate(v.date)}</span><span style={{width:50}}>{v.p}교시</span><span style={{width:110,color:'var(--muted)'}}>{v.origin}</span><b>{v.label}</b>{canEdit && <button className="btn danger" style={{padding:'0 8px',marginLeft:'auto'}} onClick={()=>deleteSub(v.id)}>삭제</button>}</div>)}
        </div>
        <div className="card" style={{margin:0,flex:'1 1 320px'}}><h3>{sem}학기 보결 횟수 (전체)</h3>
          {!byWho.length && <p className="hint">아직 없습니다.</p>}
          <table className="ov"><tbody>{byWho.map(([w,arr])=><tr key={w}><td style={{textAlign:'left'}}>{w}</td><td style={{fontWeight:700}}>{arr.length}</td><td className="hint" style={{textAlign:'left'}}>{arr.sort((a,b)=>a.date.localeCompare(b.date)).map(v=>`${shortDate(v.date)} ${classCode(v.classId)}`).join(', ')}</td></tr>)}</tbody></table>
        </div>
      </div>
    </div>}
  </div>;
}

// ---------- 현황: 시수 검증, 외부강의 분배, 수정 기록 ----------
function StatusView({ year, teachers, classList, ctt, lessons, lectures, logs, isAdmin }) {
  const [sem, setSem] = useState((new Date().getMonth()+1)>=8 || (new Date().getMonth()+1)<=1 ? 2 : 1);
  const [sub, setSub] = useState('hours');
  // 전담 시수: 전담 × 과목 × 학급 → 현재/기준
  const rows = [];
  for (const t0 of teachers) { const t = normTeacher(t0); for (const su of t.subjects) { for (const c of (su.classes||[])) { const h = subjectHours(su, t.id, c, sem, lessons, ctt); rows.push({ teacher:t, subject:su.subject, classId:c, ...h }); } } }
  const byTeacher = {}; for (const r of rows) (byTeacher[r.teacher.id] = byTeacher[r.teacher.id] || { teacher:r.teacher, rows:[] }).rows.push(r);
  // 전담 충돌(같은 시간 두 반)
  const conflicts = []; for (const t of teachers) { const m = {}; for (const [id,L] of Object.entries(lessons)) { if (!id.endsWith('_'+sem)) continue; for (const [k,v] of Object.entries(L.slots||{})) if (v.teacherId===t.id) (m[k]=m[k]||[]).push(L.classId); } for (const [k,cs] of Object.entries(m)) if (cs.length>1) conflicts.push({ teacher:t, key:k, classes:cs }); }
  conflicts.sort((a,b)=>a.key.localeCompare(b.key));
  // 외부강의 분배
  const w2 = year.semesters?.[2]?.weeks; const semOfDate = d => (w2?.length && d >= w2[0].start) ? 2 : 1;
  const lecs = Object.values(lectures).filter(l=>(l.slots||[]).some(sl=>semOfDate(sl.date)===sem)).map(l=>({ ...l, slots:(l.slots||[]).filter(sl=>semOfDate(sl.date)===sem) })).sort((a,b)=>String(a.grade).localeCompare(String(b.grade))||(a.name||'').localeCompare(b.name||''));
  const uploaded = classList.filter(c=>ctt[`${c}_${sem}`]);
  return <>
    <div className="bar">
      <div className="seg"><button className={sem===1?'on':''} onClick={()=>setSem(1)}>1학기</button><button className={sem===2?'on':''} onClick={()=>setSem(2)}>2학기</button></div>
      <div className="seg"><button className={sub==='hours'?'on':''} onClick={()=>setSub('hours')}>전담 시수</button><button className={sub==='lec'?'on':''} onClick={()=>setSub('lec')}>외부강의 분배</button><button className={sub==='log'?'on':''} onClick={()=>setSub('log')}>수정 기록</button></div>
      <div className="spacer"/>
      <span className="hint">시간표 올라온 학급 {uploaded.length}/{classList.length} {uploaded.length<classList.length && `· 미업로드: ${classList.filter(c=>!ctt[`${c}_${sem}`]).join(', ')}`}</span>
    </div>
    {sub==='hours' && <>
      {conflicts.length>0 && <div className="sec" style={{borderColor:'var(--danger)'}}><h3 style={{color:'var(--danger)'}}>같은 시간에 두 반 — 조정 필요 ({conflicts.length})</h3>
        {conflicts.slice(0,30).map((c,i)=><div key={i} style={{fontSize:14,marginBottom:2}}>{c.teacher.name} · {fmtDate(parseKey(c.key).date)} {parseKey(c.key).p}교시 · {c.classes.map(classCode).join(', ')}</div>)}{conflicts.length>30 && <div className="hint">… 외 {conflicts.length-30}건</div>}</div>}
      {Object.values(byTeacher).map(({ teacher, rows }) => <div key={teacher.id} className="sec"><h3>{teacher.name} <span className="desc">{teacherSubjects(teacher)} · 합계 {rows.reduce((a,r)=>a+r.n,0)}시간</span></h3>
        <table className="ov"><thead><tr><th>과목</th>{rows.map(r=><th key={r.subject+r.classId} style={{background:gradeColor(r.classId)}}>{classCode(r.classId)}</th>)}</tr></thead>
          <tbody><tr><td className="wk">현재</td>{rows.map(r=><td key={r.subject+r.classId} style={{color: r.exp!=null && r.n!==r.exp ? 'var(--danger)' : 'inherit', fontWeight: r.exp!=null && r.n!==r.exp ? 700 : 400}}>{r.has ? r.n : '—'}</td>)}</tr>
          <tr><td className="wk">기준</td>{rows.map(r=><td key={r.subject+r.classId} className="hint">{r.exp ?? '·'}{r.mode==='year'&&<small> 연</small>}</td>)}</tr>
          <tr><td className="wk">과목</td>{rows.map(r=><td key={r.subject+r.classId}>{r.subject}</td>)}</tr></tbody></table>
        <p className="hint" style={{margin:'6px 0 0'}}>빨간 숫자 = 기준 시수와 다름. "—" = 그 반 시간표가 아직 없음. 기준은 전체 전담이면 파일의 과목 시수, 일부 전담이면 설정한 시수. "연"은 1·2학기 합산 연간 기준.</p>
      </div>)}
      {!teachers.length && <div className="empty">전담 교사가 아직 없습니다.</div>}
    </>}
    {sub==='lec' && <>
      {!lecs.length && <div className="empty">{sem}학기 외부강의·비교과가 없습니다.</div>}
      {lecs.map(l => { const cs = l.classes||[]; const byC = {}; const byD = {}; for (const sl of l.slots||[]) { byC[sl.classId]=(byC[sl.classId]||0)+1; const d = DAYS[(new Date(sl.date+'T00:00:00').getDay()+6)%7]; byD[`${sl.classId}|${d}${sl.p}`]=(byD[`${sl.classId}|${d}${sl.p}`]||0)+1; }
        const slotsOf = c => Object.entries(byD).filter(([k])=>k.startsWith(c+'|')).map(([k,n])=>`${k.split('|')[1]}×${n}`).join(' ');
        const vals = cs.map(c=>byC[c]||0); const uneven = vals.length>1 && Math.max(...vals)!==Math.min(...vals);
        return <div key={l.id} className="sec"><h3><span className={'tag'+(isNoncurr(l)?' b':'')}>{l.kind}</span> {lecName(l)} <span className="desc">{l.grade==='유'?'유치원':l.grade+'학년'} · {l.instructor||''} {l.room?'· '+l.room:''}{uneven && <b className="warn"> · 반별 횟수가 다릅니다</b>}</span></h3>
          <table className="ov"><thead><tr><th>학급</th>{cs.map(c=><th key={c} style={{background:gradeColor(c)}}>{classCode(c)}</th>)}<th>합계</th></tr></thead>
            <tbody><tr><td className="wk">횟수</td>{cs.map(c=><td key={c} style={{fontWeight:700,color:uneven&&(byC[c]||0)!==Math.max(...vals)?'var(--danger)':'inherit'}}>{byC[c]||0}</td>)}<td>{vals.reduce((a,b)=>a+b,0)}</td></tr>
            <tr><td className="wk">시간대</td>{cs.map(c=><td key={c} className="hint">{slotsOf(c)||'—'}</td>)}<td/></tr></tbody></table></div>; })}
    </>}
    {sub==='log' && <div className="sec" style={{padding:0}}>
      {!isAdmin && <div className="empty">수정 기록은 관리자만 볼 수 있습니다.</div>}
      {isAdmin && (logs.length ? logs.map(l => <div key={l.id} className="ev"><span style={{width:140,color:'var(--muted)'}}>{(l.at||'').slice(0,16).replace('T',' ')}</span><span style={{width:120}}>{l.by}</span><span className="tag" style={{width:60,textAlign:'center'}}>{l.action}</span><span>{l.detail}</span></div>) : <div className="empty">기록이 없습니다.</div>)}
    </div>}
  </>;
}

// ---------- 학급 선택기 (학년 전체 / 반별) ----------
function ClassPicker({ classList: all, value, onChange, excludeKinder }) {
  const classList = excludeKinder ? all.filter(c=>!c.startsWith('유')) : all;
  const sel = new Set(value||[]);
  const grades = Array.from(new Set(classList.map(gradeOf)));
  const toggle = (arr, on) => { const n = new Set(sel); arr.forEach(c => on ? n.add(c) : n.delete(c)); onChange(classList.filter(c=>n.has(c))); };
  return <div className="cp">{grades.map(g => { const cs = classList.filter(c=>gradeOf(c)===g); const n = cs.filter(c=>sel.has(c)).length; const all = n===cs.length;
    return <div key={g} className="g"><button type="button" className={'gr'+(all?' on':n?' part':'')} onClick={()=>toggle(cs, !all)} title={all?'학년 전체 해제':'학년 전체 선택'}>{g==='유'?'유치원':g+'학년'}</button>
      {cs.map(c=><button type="button" key={c} className={sel.has(c)?'on':''} onClick={()=>toggle([c], !sel.has(c))}>{c.split('-')[1]}</button>)}</div>; })}</div>;
}

function TeacherEditor({ t: t0, classList, onChange, onDelete, rooms }) {
  const t = normTeacher(t0); const updT = (k,v)=>onChange({ ...t, [k]: v }); const updS = (si,k,v)=>updT('subjects', t.subjects.map((x,j)=>j===si?{...x,[k]:v}:x));
  return <div style={{border:'1px solid var(--line)',borderRadius:8,padding:'10px 12px',marginBottom:10}}>
        <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:6}}>
          <input placeholder="이름" value={t.name||''} onChange={e=>updT('name',e.target.value)} style={{width:120,padding:'5px 6px',border:'1px solid var(--line)',borderRadius:4}}/>
          <input placeholder="이메일(선택)" value={t.email||''} onChange={e=>updT('email',e.target.value)} style={{width:240,padding:'5px 6px',border:'1px solid var(--line)',borderRadius:4}}/>
          <select value={t.room||''} onChange={e=>updT('room',e.target.value)} style={{width:200,padding:'5px 6px',border:'1px solid var(--line)',borderRadius:4}} title="주 사용 특별실 — 과목별 특별실을 비워 두면 이곳이 쓰입니다"><option value="">주 사용 특별실 없음</option>{(rooms||[]).map(r=><option key={r.name} value={r.name}>{r.name}</option>)}{t.room && !(rooms||[]).some(r=>r.name===t.room) && <option value={t.room}>{t.room} (목록에 없음)</option>}</select>
          <input type="color" value={t.color||'#fff3b0'} onChange={e=>updT('color',e.target.value)} style={{width:44,height:30,padding:0}}/>
          <select value={t.type||'normal'} onChange={e=>updT('type',e.target.value)} style={{padding:'5px 6px',border:'1px solid var(--line)',borderRadius:4}}><option value="normal">일반</option><option value="coop">협력</option></select>
          <div className="spacer"/>
          {onDelete && <button className="btn danger" style={{padding:'2px 8px'}} onClick={onDelete}>교사 삭제</button>}
        </div>
        <table className="form"><thead><tr><th style={{width:190}}>과목</th><th style={{width:110}} title="전체 전담 = 그 과목을 모두 전담이 수업 / 일부 전담 = 담임과 나누어 수업 (마우스를 올리면 설명이 나옵니다)">범위 ⓘ</th><th>담당 학급 (학년 버튼 = 전체, 숫자 = 반별)</th><th style={{width:90}} title="학기별: 1·2학기 각각 맞춤 / 연간: 1년 합계로만 맞춤(창체 등)">시수 기준</th><th style={{width:150}}>시수 (학급당)</th><th style={{width:130}} title="이 과목 수업이 열리는 특별실. 비우면 전담의 주 사용 특별실">특별실</th><th style={{width:40}}></th></tr></thead>
        <tbody>{t.subjects.map((sub,si)=><tr key={si}>
          <td><select value={sub.subject||''} onChange={e=>updS(si,'subject',e.target.value)}><option value="">선택</option>{SUBJECTS.map(([l,n])=><option key={l} value={l}>{l} · {n}</option>)}</select></td>
          <td><select value={sub.coverage||'full'} onChange={e=>updS(si,'coverage',e.target.value)} title={sub.coverage==='partial' ? '일부 전담: 담임과 과목을 나누어 수업하는 경우. 담임이 연간시간표에서 전담 시간 칸에 색을 칠해 올려야 그 칸만 전담으로 잡힙니다.' : '전체 전담: 그 과목 수업을 모두 전담이 하는 경우. 연간시간표의 그 과목 칸이 전부 전담으로 잡힙니다.'}><option value="full" title="그 과목 수업을 모두 전담이 하는 경우">전체 전담</option><option value="partial" title="담임과 과목을 나누어 수업하는 경우 (색칠 칸만 전담)">일부 전담</option></select></td>
          <td><ClassPicker classList={classList} excludeKinder value={sub.classes||[]} onChange={v=>updS(si,'classes',v)} /></td>
          <td><select value={sub.hoursMode||'sem'} onChange={e=>updS(si,'hoursMode',e.target.value)}><option value="sem">학기별</option><option value="year">연간</option></select></td>
          <td>{(sub.hoursMode||'sem')==='year' ? <input type="number" min="0" value={sub.yearHours||''} placeholder="연간" onChange={e=>updS(si,'yearHours',e.target.value)}/> : <div style={{display:'flex',gap:4,alignItems:'center'}}><input type="number" min="0" value={sub.semHours1||''} placeholder="1학기" onChange={e=>updS(si,'semHours1',e.target.value)}/><input type="number" min="0" value={sub.semHours2||''} placeholder="2학기" onChange={e=>updS(si,'semHours2',e.target.value)}/></div>}</td>
          <td><select value={sub.room||''} onChange={e=>updS(si,'room',e.target.value)}><option value="">(주 사용 특별실)</option>{(rooms||[]).map(r=><option key={r.name} value={r.name}>{r.name}</option>)}</select></td>
          <td><button className="btn danger" style={{padding:'2px 8px'}} onClick={()=>updT('subjects', t.subjects.filter((_,j)=>j!==si))}>×</button></td>
        </tr>)}</tbody></table>
        <button className="btn" style={{marginTop:6,padding:'3px 10px'}} onClick={()=>updT('subjects',[...t.subjects,{subject:'',coverage:'full',classes:[],semHours1:'',semHours2:''}])}>+ 담당 항목</button>
      </div>;
}

function TeacherSelfModal({ teachers, teacherId, classList, rooms, onSaved, onClose, toast }) {
  const base = teachers.find(t=>t.id===teacherId);
  const [t, setT] = useState(base ? normTeacher(base) : null);
  if (!t) return null;
  const save = async () => { const all = teachers.map(x=>x.id===teacherId ? t : x); const { list, dups } = normalizeTeachers(all);
    if (dups.length) { toast(`같은 반 같은 과목이 다른 전담에게 있습니다: ${dups.slice(0,3).join(', ')}`, true); return; }
    await setDoc(sref('teachers'), { list }); onSaved(); };
  return <Modal title="내 담당 과목·학급 설정" onClose={onClose}>
    <p className="hint" style={{marginTop:0}}>과목을 고르고 학년 버튼(전체) 또는 반 버튼(반별)으로 담당 학급을 선택하세요. 저장하면 담임이 올린 연간시간표에서 내 수업이 자동으로 잡힙니다.</p>
    <TeacherEditor t={t} classList={classList} rooms={rooms} onChange={setT} />
    <div className="row"><button className="btn" onClick={onClose}>취소</button><button className="btn primary" onClick={save}>저장</button></div>
  </Modal>;
}

// ---------- 학년도 설정 ----------
function Settings({ year, teachers, roles, isAdmin, classList, toast, log, onBlankAll, onBackup, onReset }) {
  const [y, setY] = useState(year); const [ts, setTs] = useState(teachers);
  useEffect(()=>setY(year),[year]); useEffect(()=>setTs(teachers),[teachers]);
  if (!isAdmin) return null;
  const saveYear = async () => { const { roomsText, ...rest } = y; const rooms = (roomsText ?? (y.rooms||[]).map(r=>r.name).join(',')).split(/[,，]+/).map(x=>x.trim()).filter(Boolean).map(name=>({name})); await setDoc(sref('year'), { ...rest, rooms, bell: y.bell||DEFAULT_BELL }, { merge:true }); toast('학년도 설정을 저장했습니다.'); log('settings','학년도 설정 저장'); };
  const bellG = (y.bell||DEFAULT_BELL).groups;
  const setBell = groups => setY({ ...y, bell: { groups } });
  const saveTeachers = async () => {
    const { list, dups } = normalizeTeachers(ts);

    await setDoc(sref('teachers'), { list }); toast('전담 교사를 저장했습니다.'); log('settings','전담 교사 저장'); };
  const upd = (i, k, v) => setTs(a => a.map((t,j)=> j===i ? { ...t, [k]: v } : t));

        <tr><th>학교 계정 도메인</th><td><input placeholder="예: school.es.kr (비우면 모든 구글 계정 허용)" value={y.domain||''} onChange={e=>setY({...y, domain:e.target.value.trim()})}/></td></tr>
        <tr><th>학년별 학급 수</th><td style={{display:'flex',gap:10,flexWrap:'wrap'}}>{[1,2,3,4,5,6].map(g=><label key={g} className="chk">{g}학년 <input type="number" min="0" style={{width:60}} value={y.grades?.[g]||0} onChange={e=>setY({...y, grades:{...(y.grades||{}), [g]:Number(e.target.value)}})}/></label>)}<label className="chk">유치원 <input type="number" min="0" style={{width:60}} value={y.kinder||0} onChange={e=>setY({...y, kinder:Number(e.target.value)})}/></label></td></tr>
        <tr><th>특별실</th><td><input value={y.roomsText ?? (y.rooms||[]).map(r=>r.name).join(', ')} placeholder="예: 음악실, 과학1실, 과학2실, 영어1실, 영어2실, 체육관, 다목적실 (쉼표로)" onChange={e=>setY({...y, roomsText:e.target.value})}/><div className="hint">전담 교사 설정의 "주 사용 특별실"과 이름이 같으면 그 전담 수업이 특별실 시간표에 자동으로 표시됩니다.</div></td></tr>
        <tr><th>보결 가능 추가 인원</th><td><input value={y.extraSubs ?? '교감, 교장'} placeholder="예: 교감, 교장, 교무부장 (쉼표로)" onChange={e=>setY({...y, extraSubs:e.target.value})}/><div className="hint">담임, 전담 외에 보결에 들어갈 수 있는 분들. 보결 탭의 선택 목록에 항상 나옵니다.</div></td></tr>
        <tr><th>일정표 연동</th><td><select value={y.calendarTarget||'test'} onChange={e=>setY({...y, calendarTarget:e.target.value})} style={{padding:6}}><option value="test">시험용 (실제 월간운영계획에 쓰지 않음)</option><option value="live">실제 월간운영계획에 자동 입력</option></select></td></tr>
        <tr><th>학기 기간</th><td>
          {[1,2].map(sm => { const cur = y.semesters?.[sm]; const st = y.semStart?.[sm] || cur?.weeks?.[0]?.start || ''; const cnt = y.semCount?.[sm] || cur?.weeks?.length || (sm===1?22:20);
            return <div key={sm} style={{display:'flex',gap:8,alignItems:'center',marginBottom:6,flexWrap:'wrap'}}><b style={{minWidth:44}}>{sm}학기</b>
              시작(월요일) <input type="date" value={st} onChange={e=>setY({...y, semStart:{...(y.semStart||{}), [sm]:e.target.value}})} style={{padding:4}}/>
              <input type="number" min="1" max="30" value={cnt} onChange={e=>setY({...y, semCount:{...(y.semCount||{}), [sm]:Number(e.target.value)}})} style={{width:60,padding:4}}/>주
              <button className="btn" style={{padding:'3px 10px'}} onClick={()=>{ const s0 = y.semStart?.[sm] || st; if (!s0) { toast('시작일을 넣어 주세요.', true); return; } const d = new Date(s0+'T00:00:00').getDay(); const mon = addDays(s0, d===0 ? 1 : 1-d); const weeks = makeWeeks(mon, Number(y.semCount?.[sm] || cnt)); setY({...y, semesters:{...(y.semesters||{}), [sm]:{ weeks }}}); toast(`${sm}학기 ${weeks.length}주를 만들었습니다. 아래 [학년도 설정 저장]을 눌러 주세요.`); }}>주차 만들기</button>
              <span className="hint">현재 {cur?.weeks?.length||0}주{cur?.weeks?.length ? ` (${cur.weeks[0].label} ~ ${cur.weeks.at(-1).label})` : ''}</span>
              {cur?.weeks?.length>0 && <button className="btn" style={{padding:'3px 10px'}} onClick={()=>onBlankAll(sm)}>빈 시간표 없는 학급에 모두 만들기</button>}
            </div>; })}
          <div className="hint">연간시간표(hwpx)를 올리면 그 파일의 주차로 자동 설정됩니다. 파일 없이 시작하려면 여기서 주차를 만든 뒤 빈 시간표를 만드세요.</div>
        </td></tr>
      </tbody></table>
      <div className="row" style={{display:'flex',justifyContent:'flex-end',marginTop:12}}><button className="btn primary" onClick={saveYear}>학년도 설정 저장</button></div>
    </div>
    <div className="card"><h3>시정표 (학년군별)</h3>
      <p className="hint" style={{marginTop:0}}>같은 교시라도 학년군에 따라 시간이 다르면 여기서 맞춰 주세요. 특별실 겹침은 이 시간으로 판정합니다.</p>
      {bellG.map((g,gi)=><div key={gi} style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:8}}>
        <input value={g.name} onChange={e=>setBell(bellG.map((x,j)=>j===gi?{...x,name:e.target.value}:x))} style={{width:120,padding:5,border:'1px solid var(--line)',borderRadius:4}}/>
        <span className="hint">학년</span><input value={(g.grades||[]).join(',')} onChange={e=>setBell(bellG.map((x,j)=>j===gi?{...x,grades:e.target.value.split(/[,\s]+/).filter(Boolean)}:x))} style={{width:110,padding:5,border:'1px solid var(--line)',borderRadius:4}} placeholder="3,4,6"/>
        {PERIODS.map(p=><span key={p} style={{display:'inline-flex',alignItems:'center',gap:2,fontSize:13}}>{p}교시 <input type="time" value={g.periods?.[p]?.[0]||''} onChange={e=>setBell(bellG.map((x,j)=>j===gi?{...x,periods:{...x.periods,[p]:[e.target.value,x.periods?.[p]?.[1]||'']}}:x))} style={{padding:2}}/>~<input type="time" value={g.periods?.[p]?.[1]||''} onChange={e=>setBell(bellG.map((x,j)=>j===gi?{...x,periods:{...x.periods,[p]:[x.periods?.[p]?.[0]||'',e.target.value]}}:x))} style={{padding:2}}/></span>)}
        <button className="btn danger" style={{padding:'2px 8px'}} onClick={()=>setBell(bellG.filter((_,j)=>j!==gi))}>×</button>
      </div>)}
      <div style={{display:'flex',justifyContent:'space-between'}}><button className="btn" onClick={()=>setBell([...bellG,{name:'새 학년군',grades:[],periods:{...DEFAULT_BELL.groups[0].periods}}])}>+ 학년군 추가</button><button className="btn primary" onClick={saveYear}>학년도 설정 저장</button></div>
    </div>
    <div className="card"><h3>전담 교사</h3>
      <p className="hint" style={{marginTop:0}}>학급 수를 먼저 저장해야 학급 버튼이 나타납니다. 한 사람이 여러 과목을 맡으면 담당 항목을 줄로 추가합니다(예: 체육 전담이 1학년 통합 놀이체육도 맡는 경우). 창체는 "창"을 고르면 파일의 창·자·동·봉·진 칸을 모두 창체로 인식합니다. "일부 전담"은 담임과 나누는 과목으로 파일의 색칠 칸만 잡습니다. 시수(학급당)를 넣으면 시간표에서 개수를 대조합니다. 창체처럼 1년 합계로만 맞추는 과목은 시수 기준을 "연간"으로 두세요. 과목마다 특별실이 다르면(과학은 과학실, 창체는 컴퓨터실) 줄마다 특별실을 고르세요.</p>
      {ts.map((t0,i)=><TeacherEditor key={i} t={t0} classList={classList} rooms={year.rooms||[]} onChange={nt=>setTs(a=>a.map((x,j)=>j===i?nt:x))} onDelete={()=>setTs(a=>a.filter((_,j)=>j!==i))} />)}
      <div style={{display:'flex',justifyContent:'space-between',marginTop:12}}>
        <button className="btn" onClick={()=>setTs(a=>[...a,{ name:'', subjects:[{subject:'',coverage:'full',classes:[],semHours1:'',semHours2:''}], color:['#fff3b0','#bfe6ff','#d5f5d0','#ffd6e0','#e8dcff','#ffe0b8'][a.length%6], type:'normal' }])}>+ 전담 추가</button>
        <button className="btn primary" onClick={saveTeachers}>전담 교사 저장</button>
      </div>
    </div>
    <div className="card"><h3>백업 · 학년도 마감</h3>
      <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>

        <button className="btn danger" onClick={()=>onReset(false)}>새 학년도로 초기화</button>
        <span className="hint">둘 다 설정(학급 수, 전담, 특별실, 시정표)은 남깁니다. 새 학년도 초기화는 역할도 비우고 학년도를 1년 올립니다.</span>
      </div>
    </div>
    <div className="card"><h3>역할 (로그인한 교사)</h3>
      <p className="hint" style={{marginTop:0}}>관리자 권한은 여기서만 줄 수 있습니다. 관리자로 지정된 계정은 로그인만 하면 모든 학급·전담 시간표 편집과 설정이 가능합니다(암호 불필요).</p>
      {Object.keys(roles).length===0 ? <p className="hint">아직 로그인한 교사가 없습니다. 각자 학교 계정으로 로그인하면 역할을 고르게 되고 여기에 나타납니다.</p>
      : <table className="form"><thead><tr><th>이메일</th><th>이름</th><th>역할</th><th>대상</th><th></th></tr></thead><tbody>
        {Object.entries(roles).map(([em,r])=><tr key={em}><td>{em}</td><td>{r.name}</td><td>{r.type}</td><td>{r.classId||(r.grade?r.grade+'학년':'')||teachers.find(t=>t.id===r.teacherId)?.name||(r.type==='관리자'?'전체':'')}</td><td style={{whiteSpace:'nowrap'}}>
          {r.type!=='관리자' ? <button className="btn" style={{padding:'2px 8px',marginRight:6}} onClick={async()=>{ await setDoc(sref('roles'),{byEmail:{...roles,[em]:{...r,type:'관리자',prev:r}}}); toast(`${r.name||em}에게 관리자 권한을 주었습니다.`); }}>관리자로</button>
           : <button className="btn" style={{padding:'2px 8px',marginRight:6}} onClick={async()=>{ const b={...roles}; b[em]=r.prev||{...r,type:'담임'}; await setDoc(sref('roles'),{byEmail:b}); }}>관리자 해제</button>}
          <button className="btn danger" style={{padding:'2px 8px'}} onClick={async()=>{ const b={...roles}; delete b[em]; await setDoc(sref('roles'),{byEmail:b}); }}>삭제</button></td></tr>)}
      </tbody></table>}
    </div>
  </div>;
}


// ---------- 외부강의 · 비교과 배정 ----------
function LectureView({ year, bell, classList, teachers, ctt, lessons, lectures, bookings, canEditLecture, saveLecture, deleteLecture, toast, setModal, defaultGrade }) {
  const [grade, setGrade] = useState(defaultGrade ? String(defaultGrade) : '6');
  const [editing, setEditing] = useState(null);
  const grades = ['1','2','3','4','5','6','유'];
  const semLabel = l => { const ss = l.sems?.length ? l.sems : [l.sem||1]; return ss.length>1 ? '1~2학기' : `${ss[0]}학기`; };
  const list = Object.values(lectures).filter(l=>String(l.grade)===grade).sort((a,b)=>((a.sems?.[0]||a.sem||1)-(b.sems?.[0]||b.sem||1))||(a.name||'').localeCompare(b.name||''));
  const edit = canEditLecture(grade);
  const curSem = (new Date().getMonth()+1)>=8 || (new Date().getMonth()+1)<=1 ? 2 : 1;
  const blank = () => ({ kind:'외부강의', name:'', subject:'', grade, instructor:'', room:'', session:1, classes: classList.filter(c=>gradeOf(c)===grade), slots:[] });
  if (editing) return <LectureEditor {...{ year, bell, classList, teachers, ctt, lessons, lectures, bookings, lec: editing, onClose: ()=>setEditing(null), saveLecture, deleteLecture, toast, setModal }} />;
  return <>
    <div className="bar">
      <div className="seg">{grades.map(g=><button key={g} className={grade===g?'on':''} onClick={()=>setGrade(g)}>{g==='유'?'유치원':g+'학년'}</button>)}</div>
      <div className="spacer"/>
      <button className="btn primary" disabled={!edit} onClick={()=>setEditing(blank())}>+ 새 강의 배정</button>
    </div>
    <div className="sec" style={{padding:0,overflow:'hidden'}}>
      <div style={{padding:'12px 16px',borderBottom:'1px solid var(--line)',display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontWeight:700,fontSize:17,background:GRADE_COLORS[grade],padding:'2px 10px',borderRadius:6}}>{grade==='유'?'유치원':grade+'학년'}</span>
        <span style={{fontWeight:700,fontSize:16}}>외부강의 · 비교과 목록</span>
        <span className="hint">{list.length}건 · 누르면 수정</span>
        {!edit && <span className="warn" style={{marginLeft:'auto'}}>이 학년 담임 또는 관리자만 배정할 수 있습니다</span>}
      </div>
      {list.length===0 && <div className="empty" style={{padding:40}}>아직 배정된 강의가 없습니다. 오른쪽 위 [+ 새 강의 배정]을 눌러 시작하세요.</div>}
      {list.map(l => { const byClass = {}; for (const sl of l.slots||[]) byClass[sl.classId]=(byClass[sl.classId]||0)+1; const dates = (l.slots||[]).map(sl=>sl.date).sort();
        return <div key={l.id} className="lecrow" onClick={()=>setEditing(l)}>
          <div><span className={'tag'+(isNoncurr(l)?' b':'')}>{l.kind}</span>{l.subject && !isNoncurr(l) && <div className="hint" style={{marginTop:3}}>{subjectName(l.subject)}</div>}</div>
          <div><div className="nm">{lecName(l)}</div><div className="meta">{semLabel(l)} · {l.instructor||'강사 미정'} · {l.room||'각 교실'} · {l.session===2?'2차시 연속':'1차시'}{dates.length?` · ${shortDate(dates[0])} ~ ${shortDate(dates.at(-1))}`:''}</div></div>
          <div style={{display:'flex',gap:4,flexWrap:'wrap',justifyContent:'flex-end'}}>{Object.entries(byClass).sort().map(([c,n])=><span key={c} className="chip" style={{background:gradeColor(c)}}>{classCode(c)} <b>{n}</b></span>)}</div>
        </div>; })}
    </div>
  </>;
}

function LectureEditor({ year, bell, classList, teachers, ctt, lessons, lectures, bookings, lec, onClose, saveLecture, deleteLecture, toast, setModal }) {
  const [f, setF] = useState({ ...lec, classes: lec.classes||[], subject: lec.subject||'' });
  const [slots, setSlots] = useState(lec.slots||[]);
  const [wi, setWi] = useState(() => { const all = [ ...(year.semesters?.[1]?.weeks||[]), ...(year.semesters?.[2]?.weeks||[]) ]; const i = all.findIndex(x => TODAY>=x.start && TODAY<addDays(x.start,7)); return i<0 ? 0 : i; });
  const [range, setRange] = useState('week'); // week | month | sem
  const [month, setMonth] = useState(null);
  const [busy, setBusy] = useState(false);
  const [plan, setPlan] = useState(() => { const per = {}; for (const c of (lec.classes||[])) { const first = (lec.slots||[]).filter(sl=>sl.classId===c).sort((a,b)=>a.date.localeCompare(b.date))[0]; per[c] = first ? { d: (new Date(first.date+'T00:00:00').getDay()+6)%7, p: first.p } : { d: 0, p: 1 }; } return { count: lec.count || 1, startWeek: 0, same: false, per, ev: 'skip' }; });
  // 1학기 + 2학기 주차를 이어서 사용 (학기는 날짜로 판단)
  const weeks = [ ...(year.semesters?.[1]?.weeks||[]).map(w=>({ ...w, sem:1 })), ...(year.semesters?.[2]?.weeks||[]).map(w=>({ ...w, sem:2 })) ];
  const semOf = date => { const w2 = year.semesters?.[2]?.weeks; return (w2?.length && date >= w2[0].start) ? 2 : 1; };
  const w = weeks[wi];
  const rooms = year.rooms || [];
  const gradeClasses = classList.filter(c=>gradeOf(c)===String(f.grade));
  const up = (k,v) => setF(x=>({ ...x, [k]: v }));
  const has = (cid, key) => slots.some(sl=>sl.classId===cid && slotKey(sl.date,sl.p)===key);
  const tById = Object.fromEntries(teachers.map(t=>[t.id,t]));
  useEffect(()=>{ setPlan(pl => { const per = { ...pl.per }; for (const c of f.classes) if (!per[c]) per[c] = pl.same && f.classes[0] && per[f.classes[0]] ? { ...per[f.classes[0]] } : { d:0, p:1 }; return { ...pl, per }; }); }, [f.classes]);
  // 시작 주 = 현재 배정된 칸 중 가장 이른 주 (칸을 넣고 빼면 그때그때 따라감)
  useEffect(()=>{ if (!slots.length || !weeks.length) return; const first = slots.map(sl=>sl.date).sort()[0]; const i = weeks.findIndex(x => first>=x.start && first<addDays(x.start,7)); if (i>=0) setPlan(pl => pl.startWeek===i ? pl : { ...pl, startWeek:i }); }, [slots]);
  const check = (cid, date, p, ignoreSelf) => {
    const key = slotKey(date,p); const sem = semOf(date); const T = ctt[`${cid}_${sem}`]; const cell = T?.cells?.[key] || (!T && weeks.length ? { t:'', k:'n' } : null);
    if (!cell) return { hard: T ? '수업 없음' : '시간표 없음' };
    if (cell.k==='h') return { hard: cell.t };
    const les = lessons[`${cid}_${sem}`]?.slots?.[key]; if (les) return { hard: `전담 ${les.t}${tById[les.teacherId]?' '+tById[les.teacherId].name:''}` };
    for (const o of Object.values(lectures)) if (o.id!==f.id && (o.slots||[]).some(sl=>sl.classId===cid && slotKey(sl.date,sl.p)===key)) return { hard: `${o.kind} ${o.name}` };
    if (!ignoreSelf && has(cid,key)) return { hard: '이미 배정' };
    const soft = [];
    if (cell.k==='e') soft.push(`행사(${cell.ev||cell.t})로 잡힌 시간`);
    if (f.room) { const me = periodTime(bell, gradeOf(cid), p); for (const b of Object.values(bookings)) if (b.room===f.room && b.date===date && b.lectureId!==f.id && overlaps(me, b.s ? { s:b.s, e:b.e } : periodTime(bell, b.grade||gradeOf(b.classId)||'3', b.p))) soft.push(`${f.room} ${b.text} 예약과 겹침`);
      for (const t of teachers) for (const [lid,L] of Object.entries(lessons)) { if (!lid.endsWith('_'+sem)) continue; const sl = L.slots?.[key]; if (sl && sl.teacherId===t.id && roomForLesson(t, sl.t)===f.room && overlaps(me, periodTime(bell, gradeOf(L.classId), p))) soft.push(`${f.room}에서 ${t.name} 전담 수업(${classCode(L.classId)})`); } }
    return { soft };
  };
  const setPer = (cid, k, v) => setPlan(pl => { const per = { ...pl.per }; if (pl.same) for (const c of f.classes) per[c] = { ...(per[c]||{d:0,p:1}), [k]: v }; else per[cid] = { ...(per[cid]||{d:0,p:1}), [k]: v }; return { ...pl, per }; });
  const toggle = (cid, date, p) => {

      for (let i = plan.startWeek; i < weeks.length && n < plan.count; i++) {
        const date = addDays(weeks[i].start, Number(pp.d)); const ps = f.session===2 ? [Number(pp.p), Number(pp.p)+1] : [Number(pp.p)];

        for (const x of ps) made.push({ classId:cid, date, p:x }); n++;

    }

      {skipped.length>0 && <div style={{marginBottom:8}}><b className="warn">건너뛴 주 ({skipped.length})</b> — 전담·휴업·다른 강의{plan.ev==='skip'?'·행사':''}와 겹쳐 다음 주로 밀었습니다{skipped.slice(0,12).map((x,i)=><div key={i} className="hint">· {x}</div>)}{skipped.length>12 && <div className="hint">… 외 {skipped.length-12}건</div>}</div>}
      {softs.length>0 && <div style={{marginBottom:8}}><b className="warn">확인 필요 ({softs.length})</b> — 행사 시간이거나 특별실이 겹치지만 배정에 포함했습니다{softs.slice(0,12).map((x,i)=><div key={i} className="hint">· {x}</div>)}{softs.length>12 && <div className="hint">… 외 {softs.length-12}건</div>}</div>}
      {slots.length>0 && <p className="warn">기존에 배정된 {slots.length}칸은 새 일정으로 바뀝니다.</p>}

          <select value={wi} onChange={e=>setWi(Number(e.target.value))} style={{padding:'6px 8px',border:'1px solid var(--line-strong)',borderRadius:6,fontSize:15}}>{weeks.map((x,i)=><option key={i} value={i}>{x.sem}학기 {x.no}주 {x.label}{slots.some(sl=>sl.date>=x.start && sl.date<addDays(x.start,7))?' ●':''}</option>)}</select>
          <button className="btn" disabled={wi>=weeks.length-1} onClick={()=>setWi(i=>i+1)}>다음 주 ▶</button>
        </>}
        {range==='month' && <div className="seg">{months.map(m=><button key={m} className={month===m?'on':''} onClick={()=>setMonth(m)}>{m}월</button>)}</div>}
        <div className="legend" style={{marginLeft:6}}><span><i style={{background:'#4b2a8a'}}/>이 강의</span><span><i style={{background:'#e9dcff'}}/>다른 강의</span><span><i style={{background:'#f1f1ef'}}/>전담·휴업(불가)</span><span style={{color:'var(--event)',textDecoration:'underline'}}>행사(물어봄)</span></div>
        <div className="spacer"/>
        <div className="legend">{f.classes.map(c=><span key={c} className="chip" style={{background:gradeColor(c)}}>{classCode(c)} <b>{counts[c]||0}</b></span>)}</div>
      </div>
      <div className="ttscroll">
      {!weeks.length ? <div className="empty">연간시간표가 아직 없습니다. 담임시간표에서 올리거나 학년도 설정에서 학기 기간을 정해 주세요.</div>
      : shownWeeks.map(x => <div key={x.i} style={{marginBottom:18}}>
        <table className="tt">
          <thead><tr><th style={{width:64,background:x.i===curWeekIdx?'#fff3b0':undefined,fontSize:12}}>{x.sem}학기 {x.no}주</th>{DAYS.map((d,di)=><th key={d} colSpan={6} className="day">{d} <span className="hint">{shortDate(addDays(x.start,di)).slice(0,-3)}</span></th>)}</tr>
            <tr><th style={{fontSize:12}}>{x.label}</th>{DAYS.map(d=>PERIODS.map(p=><th key={d+p} className={'pn'+(p===1?' day':'')} style={{width:'var(--cell)'}}>{p}</th>))}</tr></thead>
          <tbody>{f.classes.map(cid => <tr key={cid}><td className="cls" style={{background:gradeColor(cid)}}>{classCode(cid)}</td>
            {DAYS.map((d,di)=>PERIODS.map(p=>{ const date = addDays(x.start,di); const key = slotKey(date,p); const T = ctt[`${cid}_${semOf(date)}`]; const cell = T?.cells?.[key];
              const picked = has(cid,key); const r = picked ? {} : check(cid,date,p);
              let cls='slot', text='', title=`${fmtDate(date)} ${p}교시`;
              if (picked) { cls+=' pick'; text = <LecText lec={f}/>; }
              else if (r.hard) { const other = Object.values(lectures).find(o=>o.id!==f.id && (o.slots||[]).some(sl=>sl.classId===cid && slotKey(sl.date,sl.p)===key)); if (other) { cls+=' lec'; text = <LecText lec={other}/>; title+=' · '+other.name; } else if (cell?.k==='h') { cls+=' h'; text=cell.t; } else { const les = lessons[`${cid}_${semOf(date)}`]?.slots?.[key]; cls+=' blocked'; text = les ? les.t : (cell?.t||''); title+=' · '+r.hard; } }
              else { cls+=' free'; if (cell?.k==='e') { cls+=' e'; text=cell.t; } else text = cell?.t||''; if (r.soft?.length) title+=' · '+r.soft.join(', '); }
              return <td key={key} className={cls+(p===1?' first':'')+(isPast(date)?' past':'')} title={title} onClick={()=>{ if (picked || !r.hard) toggle(cid,date,p); }}>{text}</td>; }))}
          </tr>)}</tbody>
        </table>
      </div>)}
      </div>
    </div>
    </div>
    </div>
  </div>;
}
