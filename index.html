  <script type="text/babel" data-type="module">
    // --- 1. 라이브러리 및 아이콘 불러오기 ---

    // --- 3. 유틸리티 함수 및 상수 ---

      const d = new Date(dateStr);

      '2027-08-15': '광복절', '2027-08-16': '대체공휴일(광복절)',
      '2027-09-14': '추석 연휴', '2027-09-15': '추석', '2027-09-16': '추석 연휴',
      '2027-10-03': '개천절', '2027-10-04': '대체공휴일(개천절)',
      '2027-10-09': '한글날', '2027-10-11': '대체공휴일(한글날)',
      '2027-12-25': '기독탄신일', '2027-12-27': '대체공휴일(기독탄신일)',

      // 2028년
      '2028-01-01': '신정',
      '2028-01-26': '설날 연휴', '2028-01-27': '설날', '2028-01-28': '설날 연휴',
      '2028-03-01': '삼일절',
      '2028-04-12': '국회의원 선거',
      '2028-05-02': '부처님오신날',
      '2028-05-05': '어린이날',
      '2028-06-06': '현충일',

    };

    // 기본 부서 목록 (관리자가 수정하기 전 초기값)
    const DEFAULT_DEPARTMENTS = [
      { name: '전체',   bg: '#585D67', text: '#FFFFFF', border: '#4B4F58' },
      { name: '교무',   bg: '#7872C0', text: '#FFFFFF', border: '#6661A3' },
      { name: '연구',   bg: '#D193AC', text: '#FFFFFF', border: '#B27D92' },
      { name: '생활',   bg: '#83B395', text: '#FFFFFF', border: '#6F987E' },
      { name: '안전',   bg: '#D66464', text: '#FFFFFF', border: '#B65555' },
      { name: '체육',   bg: '#DE987C', text: '#FFFFFF', border: '#BC8169' },
      { name: '정보',   bg: '#7DA8B5', text: '#FFFFFF', border: '#6A8F9A' },
      { name: '미래',   bg: '#BEA302', text: '#FFFFFF', border: '#A28B02' },
      { name: '유치원', bg: '#CCFBF1', text: '#0F766E', border: '#5EEAD4' },
      { name: '1학년',  bg: '#FFE4E6', text: '#BE123C', border: '#FDA4AF' },
      { name: '2학년',  bg: '#FFEDD5', text: '#C2410C', border: '#FDBA74' },
      { name: '3학년',  bg: '#FEF08A', text: '#854D0E', border: '#FACC15' },
      { name: '4학년',  bg: '#DCFCE7', text: '#15803D', border: '#86EFAC' },
      { name: '5학년',  bg: '#DBEAFE', text: '#1D4ED8', border: '#93C5FD' },
      { name: '6학년',  bg: '#EDE9FE', text: '#6D28D9', border: '#C4B5FD' },
      { name: '특수',   bg: '#FAE8FF', text: '#A21CAF', border: '#F0ABFC' },
      { name: '행정',   bg: '#E2E8F0', text: '#334155', border: '#94A3B8' },
      { name: '늘봄',   bg: '#EDE0D4', text: '#7C4A21', border: '#D6BFA8' },
    ];

    // --- 관리자 암호 해시 (암호 원문은 저장하지 않음) ---
    const fallbackHash = (text) => {
      let h = 5381;
      for (let i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) | 0;
      return 'fb:' + (h >>> 0).toString(16);
    };

    const sha256Hash = async (text) => {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return 'sha256:' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    };

    const hashPassword = async (text) => {
      try {
        if (window.crypto && window.crypto.subtle) return await sha256Hash(text);
      } catch (e) { /* 보안 컨텍스트가 아니면 아래로 */ }
      return fallbackHash(text);
    };

    const verifyPassword = async (input, stored) => {
      if (!stored) return false;
      if (stored.startsWith('fb:')) return fallbackHash(input) === stored;
      try {
        return (await sha256Hash(input)) === stored;
      } catch (e) {
        return false;
      }
    };

    // 배경색보다 살짝 어두운 테두리색 자동 생성
    const shadeColor = (hex, ratio = 0.85) => {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
      if (!m) return hex || '#CCCCCC';
      const v = [1, 2, 3].map(i => Math.max(0, Math.min(255, Math.round(parseInt(m[i], 16) * ratio))));
      return '#' + v.map(n => n.toString(16).padStart(2, '0')).join('').toUpperCase();
    };

    const makeDeptMap = (list) => (list || []).reduce((acc, d) => { acc[d.name] = d; return acc; }, {});

    // 삭제된 부서가 일정에 남아 있을 때 쓰는 기본 스타일
    const UNKNOWN_DEPT = { bg: '#F1F5F9', text: '#64748B', border: '#CBD5E1' };

    // 일정표 / 오늘의 일정에 표시되는 부서 배지
    const DeptBadge = ({ name, map, small }) => {
      if (!name) return null;
      const d = (map && map[name]) || UNKNOWN_DEPT;
      return (
        <span
          className={`inline-block rounded-full font-semibold whitespace-nowrap border ${small ? 'px-1.5 py-0 text-[10px]' : 'px-2 py-0.5 text-xs'}`}
          style={{ backgroundColor: d.bg, color: d.text, borderColor: d.border || shadeColor(d.bg) }}
        >
          {name}
        </span>
      );
    };

    // --- 4. 메인 애플리케이션 컴포넌트 ---
    function App() {
      const [user, setUser] = useState(null);
      const [events, setEvents] = useState([]);
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [deptFilter, setDeptFilter] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [showToday, setShowToday] = useState(() => {
        try { return window.localStorage.getItem('show_today_box') !== '0'; } catch (e) { return true; }
      });

      const toggleTodayBox = () => {
        setShowToday(prev => {
          const next = !prev;
          try { window.localStorage.setItem('show_today_box', next ? '1' : '0'); } catch (e) { /* 무시 */ }
          return next;
        });
      };
      const [isFormOpen, setIsFormOpen] = useState(false); // 모바일에서 등록 패널 표시 여부
      const [departments, setDepartments] = useState(DEFAULT_DEPARTMENTS);
      const [deptAdmin, setDeptAdmin] = useState({ isOpen: false, list: [], saving: false });
      const [adminHash, setAdminHash] = useState(null);      // 저장된 관리자 암호 해시
      const [isUnlocked, setIsUnlocked] = useState(false);   // 이번 접속에서 인증 여부
      const [gate, setGate] = useState({ isOpen: false, mode: 'verify', pw: '', pw2: '', error: '', busy: false });
      const [holidays, setHolidays] = useState(DEFAULT_HOLIDAYS);
      const [adminTab, setAdminTab] = useState('dept');
      const [holidayDraft, setHolidayDraft] = useState([]);
      const [importState, setImportState] = useState({ fileName: '', rows: [], error: '', mode: 'append', busy: false });
      const [sheetSync, setSheetSync] = useState({ url: '', secret: '', enabled: false, lastHash: '', lastSyncAt: '' });
      const [sheetForm, setSheetForm] = useState({ url: '', secret: '', enabled: false, saving: false, syncing: false });
      const fileInputRef = useRef(null);
      const [holidayYear, setHolidayYear] = useState(String(new Date().getFullYear()));
      const [zoom, setZoom] = useState(() => {
        try {
          const saved = parseFloat(window.localStorage.getItem('schedule_zoom'));
          if (saved >= 0.6 && saved <= 1.4) return saved;
        } catch (e) { /* 저장소를 못 쓰면 기본값 */ }
        return 1;
      });

      const zoomRef = useRef(1);
      useEffect(() => { zoomRef.current = zoom; }, [zoom]);

      const changeZoom = (delta) => {
        setZoom(prev => {
          const next = Math.round(Math.min(1.4, Math.max(0.6, prev + delta)) * 100) / 100;
          try { window.localStorage.setItem('schedule_zoom', String(next)); } catch (e) { /* 무시 */ }
          return next;
        });
      };

      const resetZoom = () => {
        setZoom(1);
        try { window.localStorage.setItem('schedule_zoom', '1'); } catch (e) { /* 무시 */ }
      };
      const hasScrolledRef = useRef(false);
      
      const initialFormState = {
        date: formatDate(new Date()),
        endDate: formatDate(new Date()),
        isRepeating: false,
        repeatDays: [],
        excludeWeekends: false,
        activity: '',
        time: '',
        department: '',
        manager: '',
        location: '',
        note: '',
        isImportant: false,
        groupId: null,
      };
      const [formData, setFormData] = useState(initialFormState);
      const [isEditing, setIsEditing] = useState(false);
      const [editingId, setEditingId] = useState(null);

      const [repeatModal, setRepeatModal] = useState({ isOpen: false, action: null, event: null, updatedData: null });
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3000);
      };

      useEffect(() => {
        const initAuth = async () => {
          try {
            await signInAnonymously(auth);
          } catch (err) {
            console.error("Auth error:", err);
            showToast("인증에 실패했습니다. 새로고침 해주세요.", "error");
          }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const eventsRef = collection(db, 'artifacts', appId, 'public', 'data', 'school_events');
        const q = query(eventsRef);

        const unsubscribe = onSnapshot(q, (snapshot) => {
          const fetchedEvents = snapshot.docs.map(doc => ({
            ...doc.data(),
            id: doc.id 
          }));
          setEvents(fetchedEvents);
        }, (error) => {
          console.error("Fetch error:", error);
          showToast("데이터를 불러오는데 실패했습니다.", "error");
        });

        return () => unsubscribe();
      }, [user]);

      // 부서 목록 실시간 구독 (관리자가 바꾸면 모든 사용자에게 반영)
      useEffect(() => {
        if (!user) return;
        const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'departments');
        const unsubscribe = onSnapshot(settingsRef, (snap) => {
          const list = snap.exists() ? snap.data().list : null;
          if (Array.isArray(list) && list.length > 0) setDepartments(list);
        }, (error) => {
          console.error("Departments fetch error:", error);
        });
        return () => unsubscribe();
      }, [user]);

      // 공휴일 실시간 구독 (저장된 값이 있으면 그것이 기준)
      useEffect(() => {
        if (!user) return;
        const ref = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'holidays');
        const unsubscribe = onSnapshot(ref, (snap) => {
          const map = snap.exists() ? snap.data().map : null;
          if (map && typeof map === 'object') setHolidays(map);
        }, (error) => {
          console.error("Holidays fetch error:", error);
        });
        return () => unsubscribe();
      }, [user]);

      // 구글 시트 연동 설정 구독
      useEffect(() => {
        if (!user) return;
        const ref = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'sheet_sync');
        const unsubscribe = onSnapshot(ref, (snap) => {
          const d = snap.exists() ? snap.data() : null;
          const next = {
            url: (d && d.url) || '',
            secret: (d && d.secret) || '',
            enabled: !!(d && d.enabled),
            lastHash: (d && d.lastHash) || '',
            lastSyncAt: (d && d.lastSyncAt) || ''
          };
          setSheetSync(next);
          setSheetForm(prev => (prev.saving ? prev : { ...prev, url: next.url, secret: next.secret, enabled: next.enabled }));
        }, (error) => {
          console.error("Sheet sync settings fetch error:", error);
        });
        return () => unsubscribe();
      }, [user]);

      // 관리자 암호 해시 구독
      useEffect(() => {
        if (!user) return;
        const adminRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'admin');
        const unsubscribe = onSnapshot(adminRef, (snap) => {
          setAdminHash(snap.exists() ? (snap.data().passwordHash || null) : null);
        }, (error) => {
          console.error("Admin settings fetch error:", error);
        });
        return () => unsubscribe();
      }, [user]);

      const deptMap = useMemo(() => makeDeptMap(departments), [departments]);

      const searchResults = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return [];
        const words = q.split(/\s+/);
        return events
          .filter(ev => {
            const haystack = [ev.activity, ev.manager, ev.location, ev.note, ev.department, ev.date, ev.time]
              .map(v => (v || '').toString().toLowerCase()).join(' ');
            return words.every(w => haystack.includes(w));
          })
          .sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
      }, [events, searchQuery]);

      const isSearching = searchQuery.trim().length > 0;

      const goToEventDate = (dateStr) => {
        const d = new Date(dateStr);
        setCurrentMonth(new Date(d.getFullYear(), d.getMonth(), 1));
        setSearchQuery('');
        setTimeout(() => {
          const row = document.getElementById(`row-${dateStr}`);
          const container = row && row.closest('.overflow-auto, .overflow-y-auto');
          if (row && container) container.scrollTo({ top: row.offsetTop * zoomRef.current - 140, behavior: 'smooth' });
        }, 150);
      };

      const todayStr = formatDate(new Date());
      
      const daysInViewMonth = useMemo(() => {
        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth();
        const numDays = new Date(year, month + 1, 0).getDate();
        return Array.from({ length: numDays }, (_, i) => {
          const d = new Date(year, month, i + 1);
          return formatDate(d);
        });
      }, [currentMonth]);

      const sortEventsByTime = (a, b) => {
        if (a.time && b.time) return a.time.localeCompare(b.time);
        if (a.time && !b.time) return -1;
        if (!a.time && b.time) return 1;
        return 0;
      };

      const currentMonthEvents = useMemo(() => {
        const prefix = `${currentMonth.getFullYear()}-${String(currentMonth.getMonth() + 1).padStart(2, '0')}`;
        return events.filter(e => e.date.startsWith(prefix)).sort((a, b) => {
          if (a.date !== b.date) return a.date.localeCompare(b.date);
          return sortEventsByTime(a, b);
        });
      }, [events, currentMonth]);

      const visibleMonthEvents = useMemo(() => {
        if (deptFilter.length === 0) return currentMonthEvents;
        return currentMonthEvents.filter(e => deptFilter.includes(e.department || '미지정'));
      }, [currentMonthEvents, deptFilter]);

      // --- 관리자 암호 ---
      const openGate = (mode) => setGate({ isOpen: true, mode, pw: '', pw2: '', error: '', busy: false });
      const closeGate = () => setGate({ isOpen: false, mode: 'verify', pw: '', pw2: '', error: '', busy: false });

      const requestDeptAdmin = () => {
        if (isUnlocked) { openDeptAdmin(); return; }
        openGate(adminHash ? 'verify' : 'setup');
      };

      const submitGate = async () => {
        const pw = gate.pw.trim();
        setGate(prev => ({ ...prev, busy: true, error: '' }));

        try {
          if (gate.mode === 'verify') {
            const ok = await verifyPassword(pw, adminHash);
            if (!ok) {
              setGate(prev => ({ ...prev, busy: false, pw: '', error: '암호가 일치하지 않습니다.' }));
              return;
            }
            setIsUnlocked(true);
            closeGate();
            openDeptAdmin();
            return;
          }

          // setup(최초 설정) / change(변경)
          if (pw.length < 4) {
            setGate(prev => ({ ...prev, busy: false, error: '암호는 4자 이상으로 정해주세요.' }));
            return;
          }
          if (pw !== gate.pw2.trim()) {

      const pushToSheet = async (rows) => {

      // --- 전체 일정 내려받기 / 올리기 ---
      const EVENT_FIELDS = ['date', 'time', 'department', 'activity', 'manager', 'location', 'note', 'isImportant'];

      const downloadFile = (content, filename, mime) => {
        const blob = new Blob(['\ufeff' + content], { type: mime });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      const sortedAllEvents = () => [...events].sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));

      const exportAllJSON = () => {

      const exportAllCSV = () => {
        const q = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
        let csv = '날짜,시간,부서,교육활동내용,담당자,장소,비고,중요\n';
        const list = sortedAllEvents();
        list.forEach(ev => {
          csv += [ev.date, ev.time, ev.department, ev.activity, ev.manager, ev.location, ev.note, ev.isImportant ? 'Y' : 'N'].map(q).join(',') + '\n';
        });
        const stamp = formatDate(new Date());
        downloadFile(csv, `전체일정_${stamp}.csv`, 'text/csv;charset=utf-8;');
        showToast(`전체 일정 ${list.length}건을 CSV로 내려받았습니다.`);
      };

      // 따옴표를 고려한 간단한 CSV 파서
      const parseCSV = (text) => {
        const rows = [];
        let row = [], field = '', inQuotes = false;
        const src = text.replace(/^\ufeff/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        for (let i = 0; i < src.length; i++) {
          const ch = src[i];
          if (inQuotes) {
            if (ch === '"') {
              if (src[i + 1] === '"') { field += '"'; i++; }
              else inQuotes = false;
            } else field += ch;
          } else if (ch === '"') inQuotes = true;
          else if (ch === ',') { row.push(field); field = ''; }
          else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
          else field += ch;
        }
        if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
        return rows.filter(r => r.some(c => c.trim() !== ''));
      };

      const normalizeImported = (obj) => {
        const pick = (...keys) => {
          for (const k of keys) {
            if (obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== '') return String(obj[k]).trim();
          }
          return '';
        };
        const important = pick('isImportant', '중요', '중요여부').toLowerCase();
        return {
          date: pick('date', '날짜'),
          time: pick('time', '시간'),
          department: pick('department', '부서'),
          activity: pick('activity', '교육활동내용', '내용'),
          manager: pick('manager', '담당자'),
          location: pick('location', '장소'),
          note: pick('note', '비고'),
          isImportant: ['y', 'true', '1', 'o', '예', '중요'].includes(important)
        };
      };

      const handleImportFile = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            let raw = [];
            const text = String(reader.result);
            if (file.name.toLowerCase().endsWith('.json')) {
              const parsed = JSON.parse(text);
              if (!Array.isArray(parsed)) throw new Error('배열 형식이 아닙니다.');
              raw = parsed;
            } else {
              const rows = parseCSV(text);
              if (rows.length < 2) throw new Error('데이터 행이 없습니다.');
              const header = rows[0].map(h => h.trim());
              raw = rows.slice(1).map(r => {
                const o = {};
                header.forEach((h, i) => { o[h] = r[i] || ''; });
                return o;
              });
            }

            const normalized = raw.map(normalizeImported);
            const bad = normalized.filter(r => !/^\d{4}-\d{2}-\d{2}$/.test(r.date) || !r.activity);
            const good = normalized.filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date) && r.activity);

            setImportState(prev => ({
              ...prev,
              fileName: file.name,
              rows: good,
              error: bad.length > 0 ? `날짜(YYYY-MM-DD) 또는 교육활동내용이 없는 ${bad.length}줄은 제외됩니다.` : ''
            }));
          } catch (err) {
            console.error('Import parse error:', err);
            setImportState(prev => ({ ...prev, fileName: file.name, rows: [], error: '파일을 읽지 못했습니다. JSON 배열 또는 CSV 형식인지 확인해주세요.' }));
          }
        };
        reader.readAsText(file, 'utf-8');
        e.target.value = '';
      };

      const runImport = async () => {
        if (importState.rows.length === 0) return;
        if (importState.mode === 'replace') {
          const ok = window.confirm(`기존 일정 ${events.length}건을 모두 지우고 ${importState.rows.length}건으로 교체합니다. 계속할까요?`);
          if (!ok) return;
        }

        setImportState(prev => ({ ...prev, busy: true }));
        try {
          const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'school_events');

          if (importState.mode === 'replace') {
            const ids = events.map(ev => ev.id);
            for (let i = 0; i < ids.length; i += 400) {
              const batch = writeBatch(db);
              ids.slice(i, i + 400).forEach(id => batch.delete(doc(db, 'artifacts', appId, 'public', 'data', 'school_events', id)));
              await batch.commit();
            }
          }

          const now = new Date().toISOString();
          for (let i = 0; i < importState.rows.length; i += 400) {
            const batch = writeBatch(db);
            importState.rows.slice(i, i + 400).forEach(r => {
              batch.set(doc(colRef), { ...r, createdAt: now, importedAt: now });
            });
            await batch.commit();
          }

          setImportState({ fileName: '', rows: [], error: '', mode: 'append', busy: false });
          showToast(`일정 ${importState.rows.length}건을 등록했습니다.`);
        } catch (error) {
          console.error('Import error:', error);
          showToast("일정 업로드 중 오류가 발생했습니다.", "error");
          setImportState(prev => ({ ...prev, busy: false }));
        }
      };

      // --- 부서 관리(관리자) ---
      const openDeptAdmin = () => {
        setAdminTab('dept');
        setHolidayYear(String(currentMonth.getFullYear()));

            .map(([date, name]) => ({ date, name }))

        );

        });
      };

      // --- 공휴일 관리 ---
      const updateHolidayDraft = (idx, key, value) => {
        setHolidayDraft(prev => prev.map((h, i) => (i === idx ? { ...h, [key]: value } : h)));
      };

      const removeHolidayDraft = (idx) => {
        setHolidayDraft(prev => prev.filter((_, i) => i !== idx));
      };

      const addHolidayDraft = () => {
        const year = holidayYear === 'all' ? String(currentMonth.getFullYear()) : holidayYear;
        setHolidayDraft(prev => [...prev, { date: `${year}-01-01`, name: '' }]);
      };

      const restoreDefaultHolidays = () => {

            .map(([date, name]) => ({ date, name }))

      const saveHolidays = async () => {
        const draft = holidayDraft.map(h => ({ date: (h.date || '').trim(), name: (h.name || '').trim() }));

        if (draft.some(h => !/^\d{4}-\d{2}-\d{2}$/.test(h.date))) {

        });

      const generateUUID = () => {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
          const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      };

      const saveEvent = async (e) => {
        e.preventDefault();
        if (!user) return;
        if (!formData.date || !formData.activity) {
          showToast("날짜와 교육활동내용은 필수입니다.", "error");
          return;
        }

        try {
          const cleanFormData = { ...formData };
          delete cleanFormData.id;

          if (isEditing) {
            if (cleanFormData.groupId) {
              setRepeatModal({ isOpen: true, action: 'edit', event: { id: editingId, ...cleanFormData }, updatedData: cleanFormData });
            } else {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'school_events', editingId);
              await setDoc(docRef, { ...cleanFormData, updatedAt: new Date().toISOString() }, { merge: true });
              showToast("일정이 수정되었습니다.");
              resetForm();
            }
          } else {
            if (cleanFormData.isRepeating) {
              const batch = writeBatch(db);
              const startDate = new Date(cleanFormData.date);
              const endDate = new Date(cleanFormData.endDate);
              const newGroupId = generateUUID();
              let count = 0;

              for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                const day = d.getDay();
                const isWeekend = day === 0 || day === 6;

                if (cleanFormData.excludeWeekends && isWeekend) continue;

                if (cleanFormData.repeatDays.length === 0 || cleanFormData.repeatDays.includes(day)) {
                  const docRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'school_events'));
                  batch.set(docRef, {
                    ...cleanFormData,
                    date: formatDate(d),
                    groupId: newGroupId,
                    createdAt: new Date().toISOString()
                  });
                  count++;
                }
              }
              if (count > 0) {
                await batch.commit();
                showToast(`${count}개의 일정이 등록되었습니다.`);
              } else {
                showToast("선택한 기간에 해당하는 날짜가 없습니다.", "error");
                return;
              }
            } else {
              const docRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'school_events'));
              await setDoc(docRef, {
                ...cleanFormData,
                isRepeating: false,
                groupId: null,
                createdAt: new Date().toISOString()
              });
              showToast("일정이 등록되었습니다.");
            }
            resetForm();
          }
        } catch (error) {
          console.error("Save error:", error);
          showToast("저장 중 오류가 발생했습니다.", "error");
        }
      };

      const startEdit = (eventToEdit) => {
        setIsEditing(true);
        setEditingId(eventToEdit.id);
        setFormData({
          ...eventToEdit,
          department: eventToEdit.department || '',
          isRepeating: !!eventToEdit.groupId,
          endDate: eventToEdit.date,
        });
        setIsFormOpen(true);
      };

      const promptDelete = (eventToDelete) => {
        if (eventToDelete.groupId) {
          setRepeatModal({ isOpen: true, action: 'delete', event: eventToDelete });
        } else {
          executeDelete(eventToDelete.id);
        }
      };

      const executeDelete = async (id) => {
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'school_events', id));
          showToast("삭제되었습니다.");
          if (isEditing && editingId === id) resetForm();
        } catch (err) {
          showToast("삭제 실패", "error");
        }
      };

      const handleRepeatAction = async (scope) => {
        const { action, event, updatedData } = repeatModal;
        setRepeatModal({ isOpen: false, action: null, event: null, updatedData: null });
        if (!event) return;

        try {
          const batch = writeBatch(db);
          const groupEvents = events.filter(e => e.groupId === event.groupId);
          let targetEvents = [];

          if (scope === 'single') {
            targetEvents = [event];
          } else if (scope === 'future') {
            targetEvents = groupEvents.filter(e => e.date >= event.date);
          } else if (scope === 'all') {
            targetEvents = groupEvents;
          }

          if (action === 'delete') {
            targetEvents.forEach(e => {
              const ref = doc(db, 'artifacts', appId, 'public', 'data', 'school_events', e.id);
              batch.delete(ref);
            });
            await batch.commit();
            showToast(`${targetEvents.length}개의 일정이 삭제되었습니다.`);
            if (isEditing && targetEvents.some(e => e.id === editingId)) resetForm();
          } else if (action === 'edit') {
            targetEvents.forEach(e => {
              const ref = doc(db, 'artifacts', appId, 'public', 'data', 'school_events', e.id);
              const dataToSave = { ...updatedData, updatedAt: new Date().toISOString() };
              delete dataToSave.id; 
              if (scope !== 'single') {
                 delete dataToSave.date;
              }
              batch.update(ref, dataToSave);
            });
            await batch.commit();
            showToast(`${targetEvents.length}개의 일정이 수정되었습니다.`);
            resetForm();
          }
        } catch (err) {
          console.error("Batch error:", err);
          showToast("처리 중 오류가 발생했습니다.", "error");
        }
      };

      const resetForm = () => {
        setIsEditing(false);
        setEditingId(null);
        setFormData(initialFormState);
        setIsFormOpen(false);
      };

      // --- PDF 저장 (브라우저 인쇄 → PDF로 저장) ---
      const exportToPDF = () => {
        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth() + 1;
        const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        let rows = '';
        daysInViewMonth.forEach(dateStr => {
          const dayEvents = visibleMonthEvents.filter(e => e.date === dateStr);
          const dayName = getDayName(dateStr);
          const holidayName = holidays[dateStr];
          const isHoli = dayName === '일' || dayName === '토' || !!holidayName;
          const dayCls = dayName === '일' ? 'sun' : dayName === '토' ? 'sat' : '';
          const dateCell = dateStr.split('-').slice(1).join('/');

          if (dayEvents.length === 0) {
            rows += `<tr class="dayend ${isHoli ? 'holi' : ''}">` +
              `<td class="c">${dateCell}</td><td class="c ${dayCls}">${dayName}</td>` +
              `<td></td><td></td>` +
              `<td>${holidayName ? `<span class="holiname">${esc(holidayName)}</span>` : ''}</td>` +
              `<td></td><td></td><td></td></tr>`;
            return;
          }

          dayEvents.forEach((ev, idx) => {
            const d = deptMap[ev.department];
            const badge = ev.department
              ? `<span class="badge" style="background:${(d && d.bg) || '#F1F5F9'};color:${(d && d.text) || '#64748B'};border-color:${(d && (d.border || shadeColor(d.bg))) || '#CBD5E1'}">${esc(ev.department)}</span>`
              : '';
            const last = idx === dayEvents.length - 1;
            rows += `<tr class="${last ? 'dayend' : ''} ${isHoli ? 'holi' : ''}">` +
              (idx === 0
                ? `<td class="c" rowspan="${dayEvents.length}">${dateCell}</td><td class="c ${dayCls}" rowspan="${dayEvents.length}">${dayName}</td>`
                : '') +
              `<td class="c">${esc(ev.time)}</td>` +
              `<td class="c">${badge}</td>` +
              `<td class="${ev.isImportant ? 'imp' : ''}">${ev.isImportant ? '★ ' : ''}${holidayName && idx === 0 ? `[${esc(holidayName)}] ` : ''}${esc(ev.activity)}</td>` +
              `<td class="c">${esc(ev.manager)}</td>` +
              `<td class="c">${esc(ev.location)}</td>` +
              `<td class="note">${esc(ev.note)}</td></tr>`;
          });
        });

        const filterNote = deptFilter.length > 0 ? ` · 부서 필터: ${deptFilter.join(', ')}` : '';
        const title = `${year}년 ${month}월 화성바른초 월간 운영 계획`;

        const html = `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>${esc(title)}</title>
<style>
  @page { size: A4 landscape; margin: 10mm; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; box-sizing: border-box; }
  body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: #111; margin: 0; }
  h1 { font-size: 15pt; text-align: center; margin: 0 0 2mm; }
  .sub { font-size: 8pt; color: #666; text-align: center; margin-bottom: 3mm; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { border: 0.4pt solid #B0B0B0; padding: 1.6mm 1.2mm; font-size: 8.5pt; vertical-align: top; word-break: break-word; line-height: 1.35; }
  th { background: #EDEDED; text-align: center; font-size: 8.5pt; }
  td.c { text-align: center; }
  td.note { font-size: 7.5pt; color: #444; }
  tr.holi td { background: #FFF4F7; }
  tr.dayend td { border-bottom: 1pt solid #555; }
  .sun { color: #C00; } .sat { color: #06C; }
  .imp { font-weight: 700; color: #123E8C; }
  .holiname { color: #C00; font-weight: 700; }
  .badge { display: inline-block; padding: 0.3mm 1.6mm; border-radius: 6pt; border: 0.4pt solid; font-size: 7.5pt; font-weight: 700; white-space: nowrap; }
  thead { display: table-header-group; }
  tr { page-break-inside: avoid; }
</style></head><body>
  <h1>${esc(title)}</h1>
  <div class="sub">화성바른초등학교${esc(filterNote)}</div>
  <table>
    <colgroup>
      <col style="width:6.5%"><col style="width:4%"><col style="width:9%"><col style="width:7%">
      <col style="width:29%"><col style="width:8%"><col style="width:10.5%"><col style="width:26%">
    </colgroup>
    <thead><tr>
      <th>날짜</th><th>요일</th><th>시간</th><th>부서</th><th>교육활동내용</th><th>담당자</th><th>장소</th><th>비고</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>
</body></html>`;

        const frame = document.createElement('iframe');
        frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
        document.body.appendChild(frame);

        try {
          const fdoc = frame.contentWindow.document;
          fdoc.open();
          fdoc.write(html);
          fdoc.close();
          frame.contentWindow.document.title = `월간운영계획_${year}년${month}월`;
          setTimeout(() => {
            frame.contentWindow.focus();
            frame.contentWindow.print();
            setTimeout(() => { if (frame.parentNode) document.body.removeChild(frame); }, 2000);
          }, 400);
          showToast("인쇄 창에서 'PDF로 저장'을 선택하세요.");
        } catch (error) {
          console.error('PDF export error:', error);
          if (frame.parentNode) document.body.removeChild(frame);
          showToast("PDF 저장 중 오류가 발생했습니다.", "error");
        }
      };

      const exportToCSV = () => {
        let csvContent = "\uFEFF"; 
        csvContent += "날짜,요일,시간,부서,교육활동내용,담당자,장소,비고,중요여부\n";
        
        daysInViewMonth.forEach(dateStr => {
          const dayEvents = visibleMonthEvents.filter(e => e.date === dateStr);
          const isHoliday = holidays[dateStr];
          const dayName = getDayName(dateStr);
          
          if (dayEvents.length === 0) {
            const activityText = isHoliday ? isHoliday : '';
            csvContent += `${dateStr},${dayName},,,${activityText},,,,\n`;
          } else {
            dayEvents.forEach(e => {
              const escapeCsv = (str) => `"${(str || '').replace(/"/g, '""')}"`;
              csvContent += `${dateStr},${dayName},${escapeCsv(e.time)},${escapeCsv(e.department)},${escapeCsv(e.activity)},${escapeCsv(e.manager)},${escapeCsv(e.location)},${escapeCsv(e.note)},${e.isImportant ? 'O' : ''}\n`;
            });
          }
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `월간운영계획_${currentMonth.getFullYear()}년${currentMonth.getMonth() + 1}월.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const changeMonth = (offset) => {
        setCurrentMonth(prev => {
          const next = new Date(prev);
          next.setMonth(prev.getMonth() + offset);
          return next;
        });
      };

      const goToToday = () => {
        setCurrentMonth(new Date());
        setTimeout(() => {
          const todayRow = document.getElementById(`row-${todayStr}`);
          if (todayRow) {
            const container = todayRow.closest('.overflow-auto, .overflow-y-auto');
            if (container) {
              container.scrollTo({
                top: todayRow.offsetTop * zoomRef.current - 140,
                behavior: 'smooth'
              });
            } else {
              todayRow.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }
        }, 100);
      };

      useEffect(() => {
        if (!hasScrolledRef.current && events.length > 0) {
          setTimeout(goToToday, 100);
          hasScrolledRef.current = true; 
        }
      }, [events]);

      useEffect(() => {
        const timer = setTimeout(() => {
          if (!hasScrolledRef.current) {
            goToToday();
            hasScrolledRef.current = true;
          }
        }, 800);
        return () => clearTimeout(timer);
      }, []);

      const holidayYearOptions = useMemo(() => {

        const base = currentMonth.getFullYear();
        [base - 1, base, base + 1, base + 2].forEach(y => years.add(String(y)));
        return Array.from(years).sort();
      }, [holidayDraft, currentMonth]);

      const visibleHolidayRows = useMemo(() => {
        return holidayDraft
          .map((h, idx) => ({ h, idx }))
          .filter(({ h }) => holidayYear === 'all' || (h.date || '').startsWith(holidayYear));

      const isWeekendOrHoliday = (dateStr) => {

        return d.getDay() === 0 || d.getDay() === 6 || !!holidays[dateStr];
      };

      return (
        <div className="h-screen w-full flex bg-gray-50 font-sans text-gray-800 overflow-hidden">
          {toast.show && (
            <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded shadow-lg flex items-center space-x-2 text-white ${toast.type === 'error' ? 'bg-red-500' : 'bg-green-500'}`}>
              {toast.type === 'error' ? <AlertCircle size={18} /> : <CheckCircle2 size={18} />}
              <span>{toast.message}</span>
            </div>
          )}

          {gate.isOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-50 z-[60] flex items-center justify-center p-4">
              <div className="bg-white rounded-lg shadow-xl w-full max-w-sm p-6">
                <h3 className="text-lg font-bold mb-1 flex items-center">
                  <KeyRound size={20} className="mr-2 text-blue-600" />
                  {gate.mode === 'verify' ? '관리자 확인' : gate.mode === 'setup' ? '관리자 암호 설정' : '관리자 암호 변경'}
                </h3>
                <p className="text-xs text-gray-500 mb-4">
                  {gate.mode === 'verify'
                    ? '부서 관리는 관리자 암호가 필요합니다.'
                    : gate.mode === 'setup'
                      ? '아직 암호가 없습니다. 사용할 관리자 암호를 정해주세요. 이후에는 이 암호를 아는 사람만 부서를 수정할 수 있습니다.'
                      : '새로 사용할 관리자 암호를 입력해주세요.'}
                </p>

                <input
                  type="password"
                  autoFocus
                  value={gate.pw}
                  onChange={(e) => setGate(prev => ({ ...prev, pw: e.target.value, error: '' }))}
                  onKeyDown={(e) => { if (e.key === 'Enter' && gate.mode === 'verify') submitGate(); }}
                  placeholder={gate.mode === 'verify' ? '관리자 암호' : '새 암호 (4자 이상)'}
                  className="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />

                {gate.mode !== 'verify' && (
                  <input
                    type="password"
                    value={gate.pw2}
                    onChange={(e) => setGate(prev => ({ ...prev, pw2: e.target.value, error: '' }))}
                    onKeyDown={(e) => { if (e.key === 'Enter') submitGate(); }}
                    placeholder="암호 확인"
                    className="w-full mt-2 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  />
                )}

                {gate.error && <p className="mt-2 text-xs text-red-600">{gate.error}</p>}

                <div className="mt-5 flex justify-end gap-2">
                  <button onClick={closeGate} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded text-sm">취소</button>
                  <button onClick={submitGate} disabled={gate.busy || !gate.pw} className="px-5 py-2 bg-[#2563EB] hover:bg-blue-700 disabled:opacity-50 text-white font-bold rounded shadow text-sm">
                    {gate.busy ? '확인 중…' : gate.mode === 'verify' ? '확인' : '저장'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {deptAdmin.isOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-3">

                <div className="px-5 py-4 border-b border-gray-200 flex justify-between items-center shrink-0">
                  <h3 className="text-lg font-bold flex items-center"><Settings size={20} className="mr-2 text-blue-600" /> 관리자 설정</h3>
                  <button onClick={closeDeptAdmin} className="p-1 text-gray-500 hover:bg-gray-100 rounded"><X size={20} /></button>
                </div>

                <div className="px-5 pt-3 flex gap-2 shrink-0">
                  <button onClick={() => setAdminTab('dept')} className={`px-4 py-1.5 rounded-t text-sm font-semibold border-b-2 ${adminTab === 'dept' ? 'border-blue-600 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>부서</button>
                  <button onClick={() => setAdminTab('holiday')} className={`px-4 py-1.5 rounded-t text-sm font-semibold border-b-2 ${adminTab === 'holiday' ? 'border-blue-600 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>공휴일 · 휴업일</button>
                  <button onClick={() => setAdminTab('data')} className={`px-4 py-1.5 rounded-t text-sm font-semibold border-b-2 ${adminTab === 'data' ? 'border-blue-600 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>내보내기 · 가져오기</button>
                  <button onClick={() => setAdminTab('sheet')} className={`px-4 py-1.5 rounded-t text-sm font-semibold border-b-2 ${adminTab === 'sheet' ? 'border-blue-600 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>구글 시트 연동</button>
                </div>

                <div className="px-5 py-3 bg-blue-50 border-b border-blue-100 text-xs text-blue-800 shrink-0">

                    ? '일정이 바뀔 때마다 구글 시트로 자동 전송됩니다. 시트는 늘 최신 상태로 유지되므로 노트북LM 등에서 소스로 연결해 쓸 수 있습니다.'
                    : adminTab === 'data'

                    : adminTab === 'dept'
                    ? '이름·색상을 바꾸고 순서를 옮기거나 부서를 추가·삭제할 수 있습니다. 저장하면 모든 사용자 화면에 바로 반영됩니다. 이름을 바꾸면 그 부서로 등록된 기존 일정의 부서명도 함께 바뀌고, 부서를 삭제하면 그 부서로 등록됐던 일정은 회색 표시로 남습니다.'
                    : '여기 등록된 날짜는 일정표에서 분홍색 배경으로 표시되고 이름이 함께 나옵니다. 재량휴업일이나 임시공휴일도 같은 방식으로 추가하면 됩니다. 저장하면 모든 사용자 화면에 바로 반영됩니다.'}
                </div>

                <div className={`p-4 overflow-y-auto flex-1 space-y-2 ${adminTab === 'dept' ? '' : 'hidden'}`}>
                  {deptAdmin.list.map((d, idx) => (

                        <button onClick={() => moveDeptDraft(idx, 1)} disabled={idx === deptAdmin.list.length - 1} className="p-0.5 text-gray-400 hover:text-blue-600 disabled:opacity-25" title="아래로"><ArrowDown size={14} /></button>
                      </div>

                      <input
                        type="text"
                        value={d.name}
                        onChange={(e) => updateDeptDraft(idx, 'name', e.target.value)}
                        placeholder="부서명"
                        className="w-28 sm:w-36 px-2 py-1.5 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                      />

                      <label className="flex items-center gap-1 text-xs text-gray-500 shrink-0">
                        배경
                        <input type="color" value={d.bg} onChange={(e) => updateDeptDraft(idx, 'bg', e.target.value)} className="w-8 h-8 p-0 border border-gray-300 rounded cursor-pointer bg-white" />
                      </label>

                      <label className="flex items-center gap-1 text-xs text-gray-500 shrink-0">
                        글씨
                        <input type="color" value={d.text} onChange={(e) => updateDeptDraft(idx, 'text', e.target.value)} className="w-8 h-8 p-0 border border-gray-300 rounded cursor-pointer bg-white" />

                      <div className="flex-1 flex justify-center min-w-0">

                        </span>

                  <button onClick={addDeptDraft} className="w-full mt-2 py-2 border-2 border-dashed border-gray-300 rounded text-sm text-gray-500 hover:border-blue-400 hover:text-blue-600 flex items-center justify-center gap-1">
                    <Plus size={16} /> 부서 추가
                  </button>

                    >
                      <option value="all">전체</option>
                      {holidayYearOptions.map(y => <option key={y} value={y}>{y}년</option>)}
                    </select>
                    <span className="text-xs text-gray-500">{visibleHolidayRows.length}일 표시 / 전체 {holidayDraft.length}일</span>
                  </div>

                  <div className="space-y-2">
                    {visibleHolidayRows.map(({ h, idx }) => (
                      <div key={`hol-${idx}`} className="flex items-center gap-2 p-2 rounded border border-gray-200 hover:bg-gray-50">
                        <input
                          type="date"
                          value={h.date}
                          onChange={(e) => updateHolidayDraft(idx, 'date', e.target.value)}
                          className="px-2 py-1.5 border border-gray-300 rounded text-sm shrink-0"
                        />
                        <span className={`text-xs w-6 text-center shrink-0 ${getDayName(h.date) === '일' ? 'text-red-500' : getDayName(h.date) === '토' ? 'text-blue-500' : 'text-gray-400'}`}>
                          {getDayName(h.date)}
                        </span>
                        <input
                          type="text"

                    <th className="py-2 px-3 border-b border-gray-300 w-[12%] min-w-[90px] text-center">장소</th>
                    <th className="py-2 px-3 border-b border-gray-300 w-[26%] min-w-[220px] text-center">비고</th>
                    <th className="py-2 px-2 border-b border-gray-300 w-20 text-center whitespace-nowrap">관리</th>
                  </tr>
                </thead>
                <tbody className="text-sm leading-snug">
                  {isSearching && searchResults.length === 0 && (
                    <tr><td colSpan={9} className="py-10 text-center text-gray-400 italic">검색 결과가 없습니다.</td></tr>
                  )}

                  {isSearching && searchResults.map((ev) => {
                    const dayName = getDayName(ev.date);
                    return (
                      <tr key={`s-${ev.id}`} className={`border-b border-gray-200 bg-white hover:bg-blue-50 transition-colors ${ev.isImportant ? 'font-semibold text-blue-900' : ''}`}>
                        <td className="py-1.5 px-3 font-medium text-gray-700 whitespace-nowrap text-center">
                          <button onClick={() => goToEventDate(ev.date)} className="hover:underline text-blue-700" title="이 날짜로 이동">
                            {ev.date.replace(/-/g, '.').slice(2)}
                          </button>
                        </td>
                        <td className={`py-1.5 px-2 text-center whitespace-nowrap ${dayName === '일' ? 'text-red-500' : dayName === '토' ? 'text-blue-500' : ''}`}>{dayName}</td>
                        <td className="py-1.5 px-3 whitespace-nowrap text-center">{ev.time}</td>
                        <td className="py-1.5 px-2 text-center whitespace-nowrap"><DeptBadge name={ev.department} map={deptMap} /></td>
                        <td className="py-1.5 px-4">
                          <div className="flex items-center">
                            {ev.isImportant && <Star size={14} className="mr-1.5 text-yellow-500 fill-current shrink-0" />}
                            <span>{ev.activity}</span>
                          </div>
                        </td>
                        <td className="py-1.5 px-3 text-gray-600 whitespace-nowrap text-center">{ev.manager}</td>
                        <td className="py-1.5 px-3 text-gray-600 text-center break-words leading-snug">{ev.location}</td>
                        <td className="py-1.5 px-3 text-gray-500 text-[11px] text-center break-words leading-snug">{ev.note}</td>
                        <td className="py-1.5 px-2 text-center whitespace-nowrap">
                          <div className="flex justify-center space-x-2 action-btn">
                            <button onClick={(e) => { e.stopPropagation(); startEdit(ev); }} className="text-gray-400 hover:text-blue-600" title="수정"><Edit2 size={16}/></button>
                            <button onClick={(e) => { e.stopPropagation(); promptDelete(ev); }} className="text-gray-400 hover:text-red-600" title="삭제"><Trash2 size={16}/></button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}

                  {!isSearching && daysInViewMonth.map((dateStr) => {
                    const dayEvents = visibleMonthEvents.filter(e => e.date === dateStr);
                    const dayName = getDayName(dateStr);
                    const isHoliWeek = isWeekendOrHoliday(dateStr);
                    const isToday = dateStr === todayStr;
                    const holidayName = holidays[dateStr];

                    let rowBgClassBase = "hover:bg-blue-50 transition-colors border-b ";
                    if (isToday) rowBgClassBase += "bg-[#FEF08A] ";
                    else if (isHoliWeek) rowBgClassBase += "bg-[#FFF0F5] ";
                    else rowBgClassBase += "bg-white ";

                    if (dayEvents.length === 0) {
                      const finalRowClass = rowBgClassBase + "border-[#7F7F7F] ";
                      return (
                        <tr key={dateStr} id={`row-${dateStr}`} className={`${finalRowClass} cursor-pointer group`} onClick={() => handleRowClick(dateStr)}>
                          <td className="py-1.5 px-3 font-medium text-gray-600 whitespace-nowrap text-center">{dateStr.split('-').slice(1).join('/')}</td>
                          <td className={`py-1.5 px-2 text-center whitespace-nowrap ${dayName === '일' ? 'text-red-500' : dayName === '토' ? 'text-blue-500' : ''}`}>{dayName}</td>
                          <td className="py-1.5 px-3 text-gray-400 whitespace-nowrap"></td>
                          <td className="py-1.5 px-2 whitespace-nowrap"></td>
                          <td className="py-1.5 px-4 text-gray-500">
                            {holidayName ? <span className="text-red-500 font-semibold">{holidayName}</span> : <span className="opacity-0 group-hover:opacity-100 text-xs text-blue-400">+ 클릭하여 일정 추가</span>}
                          </td>
                          <td className="py-1.5 px-3 whitespace-nowrap"></td><td className="py-1.5 px-3"></td><td className="py-1.5 px-3"></td><td className="py-1.5 px-2 whitespace-nowrap"></td>
                        </tr>
                      );
                    }

                    return dayEvents.map((ev, idx) => {
                      const isLastEventOfDay = idx === dayEvents.length - 1;
                      const finalRowClass = rowBgClassBase + (isLastEventOfDay ? "border-[#7F7F7F] " : "border-gray-200 ");
                      
                      return (
                        <tr key={ev.id} id={idx === 0 ? `row-${dateStr}` : undefined} className={`${finalRowClass} ${ev.isImportant ? 'font-semibold text-blue-900' : ''}`} onClick={(e) => {
                          if(e.target.closest('.action-btn')) return;
                          handleRowClick(dateStr);
                        }}>
                          {idx === 0 ? (
                            <>
                              <td className="py-1.5 px-3 font-medium text-gray-700 whitespace-nowrap text-center" rowSpan={dayEvents.length}>{dateStr.split('-').slice(1).join('/')}</td>
                              <td className={`py-1.5 px-2 text-center whitespace-nowrap ${dayName === '일' ? 'text-red-500' : dayName === '토' ? 'text-blue-500' : ''}`} rowSpan={dayEvents.length}>{dayName}</td>
                            </>
                          ) : null}
                          
                          <td className="py-1.5 px-3 whitespace-nowrap text-center">{ev.time}</td>
                          <td className="py-1.5 px-2 text-center whitespace-nowrap"><DeptBadge name={ev.department} map={deptMap} /></td>
                          <td className="py-1.5 px-4">
                            <div className="flex items-center">
                              {ev.isImportant && <Star size={14} className="mr-1.5 text-yellow-500 fill-current shrink-0" />}
                              {holidayName && idx === 0 && <span className="mr-2 text-red-500 whitespace-nowrap">[{holidayName}]</span>}
                              <span>{ev.activity}</span>
                            </div>
                          </td>
                          <td className="py-1.5 px-3 text-gray-600 whitespace-nowrap text-center">{ev.manager}</td>
                          <td className="py-1.5 px-3 text-gray-600 text-center break-words leading-snug">{ev.location}</td>
                          <td className="py-1.5 px-3 text-gray-500 text-[11px] text-center break-words leading-snug">{ev.note}</td>
                          <td className="py-1.5 px-2 text-center whitespace-nowrap">
                            <div className="flex justify-center space-x-2 action-btn">
                              <button onClick={(e) => { e.stopPropagation(); startEdit(ev); }} className="text-gray-400 hover:text-blue-600" title="수정"><Edit2 size={16}/></button>
                              <button onClick={(e) => { e.stopPropagation(); promptDelete(ev); }} className="text-gray-400 hover:text-red-600" title="삭제"><Trash2 size={16}/></button>
                            </div>
                          </td>
                        </tr>
                      );
                    });
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {isFormOpen && (
            <div className="fixed inset-0 bg-black/40 z-30 md:hidden" onClick={() => setIsFormOpen(false)}></div>
          )}

          <div className={`${isFormOpen ? 'flex' : 'hidden'} md:flex fixed md:static inset-y-0 right-0 w-[92%] max-w-md md:w-1/3 md:max-w-none bg-white shadow-[-4px_0_15px_-3px_rgba(0,0,0,0.05)] z-40 flex-col h-full border-l border-gray-200`}>
            <div className="p-4 md:p-6 border-b border-gray-200 bg-gray-50 flex justify-between items-center shrink-0">
              <h2 className="text-lg font-bold text-gray-800 flex items-center">
                {isEditing ? <Edit2 className="mr-2 text-blue-600" size={20} /> : <FileText className="mr-2 text-blue-600" size={20} />}
                {isEditing ? '일정 수정' : '새 일정 등록'}
              </h2>
              <div className="flex items-center gap-3">
                {isEditing && (
                  <button onClick={resetForm} className="text-sm text-gray-500 hover:text-gray-700 underline">취소</button>
                )}
                <button onClick={() => setIsFormOpen(false)} className="md:hidden p-1 text-gray-500 hover:text-gray-800 hover:bg-gray-200 rounded" title="닫기">
                  <X size={20} />
                </button>
              </div>
            </div>

            <div className="p-4 md:p-6 overflow-y-auto flex-1">
              <form onSubmit={saveEvent} className="space-y-5">
                <div className="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-4">
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-1">날짜 <span className="text-red-500">*</span></label>
                    <div className="flex items-center space-x-2">
                      <input type="date" name="date" value={formData.date} onChange={handleInputChange} required className="flex-1 p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" />
                      {formData.isRepeating && (
                        <>
                          <span className="text-gray-500">~</span>
                          <input type="date" name="endDate" value={formData.endDate} onChange={handleInputChange} required className="flex-1 p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" />
                        </>
                      )}
                    </div>
                  </div>

                  {!isEditing && (
                    <div>
                      <label className="flex items-center space-x-2 cursor-pointer mb-2">
                        <input type="checkbox" name="isRepeating" checked={formData.isRepeating} onChange={handleInputChange} className="rounded text-blue-600 focus:ring-blue-500" />
                        <span className="text-sm font-medium text-gray-700">기간 선택 (요일 미선택 시 매일 반복)</span>
                      </label>
                      
                      {formData.isRepeating && (
                        <div className="space-y-3 mt-3 px-1">
                          <label className="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="excludeWeekends" checked={formData.excludeWeekends} onChange={handleInputChange} className="rounded text-red-500 focus:ring-red-500" />
                            <span className="text-sm font-medium text-red-600">주말(토, 일) 제외</span>
                          </label>
                          <div className="flex justify-between">
                            {WEEKDAYS.map((day, idx) => (
                              <button
                                key={day}
                                type="button"
                                onClick={() => toggleRepeatDay(idx)}
                                disabled={formData.excludeWeekends && (idx === 0 || idx === 6)}
                                className={`w-8 h-8 rounded-full text-xs font-medium flex items-center justify-center transition-colors ${
                                  formData.excludeWeekends && (idx === 0 || idx === 6)
                                    ? 'bg-gray-100 text-gray-300 cursor-not-allowed border border-gray-200'
                                    : formData.repeatDays.includes(idx) 
                                      ? 'bg-blue-600 text-white shadow-md' 
                                      : 'bg-white border border-gray-300 text-gray-600 hover:bg-gray-100'
                                }`}
                              >
                                {day}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>

                <div>
                  <div className="flex items-center justify-between mb-2">
                    <label className="block text-sm font-semibold text-gray-700">부서</label>
                    {formData.department && (
                      <button type="button" onClick={() => setFormData(prev => ({ ...prev, department: '' }))} className="text-xs text-gray-500 hover:text-gray-700 underline">
                        선택 해제
                      </button>
                    )}
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {departments.map(d => {
                      const selected = formData.department === d.name;
                      return (
                        <button
                          key={d.name}
                          type="button"
                          onClick={() => toggleDepartment(d.name)}
                          className={`px-2.5 py-1 rounded-full text-xs font-semibold border transition-all ${
                            selected
                              ? 'ring-2 ring-offset-1 ring-blue-500 shadow-sm scale-105'
                              : 'opacity-70 hover:opacity-100'
                          }`}
                          style={{ backgroundColor: d.bg, color: d.text, borderColor: d.border || shadeColor(d.bg) }}
                        >
                          {d.name}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-1">교육활동내용 <span className="text-red-500">*</span></label>
                  <input type="text" name="activity" value={formData.activity} onChange={handleInputChange} required placeholder="예: 1학기 학부모 총회" className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" />
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1 flex items-center"><Clock size={14} className="mr-1"/> 시간</label>
                    <input type="text" name="time" value={formData.time} onChange={handleInputChange} placeholder="예: 14:00~16:00" className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1 flex items-center"><User size={14} className="mr-1"/> 담당자</label>
                    <input type="text" name="manager" value={formData.manager} onChange={handleInputChange} placeholder="예: 교무부장" className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" />
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1 flex items-center"><MapPin size={14} className="mr-1"/> 장소</label>
                  <input type="text" name="location" value={formData.location} onChange={handleInputChange} placeholder="예: 시청각실" className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">비고</label>
                  <textarea name="note" value={formData.note} onChange={handleInputChange} rows="2" placeholder="추가 전달사항" className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm resize-none"></textarea>
                </div>

                <div className="bg-yellow-50 p-3 rounded border border-yellow-200">
                  <label className="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" name="isImportant" checked={formData.isImportant} onChange={handleInputChange} className="rounded text-yellow-500 focus:ring-yellow-500 w-4 h-4" />
                    <span className="text-sm font-bold text-yellow-800 flex items-center">
                      <Star size={16} className="mr-1 fill-current" /> 중요 일정으로 표시
                    </span>
                  </label>
                </div>

                <div className="pt-4 border-t border-gray-200">
                  <button type="submit" className="w-full bg-[#2563EB] hover:bg-blue-700 text-white font-bold py-3 px-4 rounded shadow transition-colors flex justify-center items-center">
                    {isEditing ? '변경사항 저장' : '일정 등록하기'}
                  </button>
                </div>
              </form>
            </div>
          </div>

          {!isFormOpen && (
            <button
              onClick={() => { resetForm(); setIsFormOpen(true); }}
              className="md:hidden fixed bottom-5 right-5 z-30 flex items-center gap-1.5 bg-[#2563EB] hover:bg-blue-700 text-white font-bold pl-4 pr-5 py-3.5 rounded-full shadow-lg active:scale-95 transition-transform"
            >
              <Plus size={20} /> 새 일정
            </button>
          )}
        </div>
      );
    }

    // --- 5. 앱 렌더링 ---
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
